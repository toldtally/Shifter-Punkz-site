<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shifter Punkz TRPG</title>
<meta name="description" content="Shifter Punkz TRPG — เกมเล่นบทบาทสมมติระบบ D8 Dice Pool เล่นเป็น Shifter, Norms หรือ C.P.D.">
<meta property="og:title" content="Shifter Punkz TRPG">
<meta property="og:description" content="Shifter Punkz TRPG — เกมเล่นบทบาทสมมติระบบ D8 Dice Pool เล่นเป็น Shifter, Norms หรือ C.P.D.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0A12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' fill='%230B0A12'/%3E%3Cpath d='M4 4h12l8 8v12H12L4 16z' fill='none' stroke='%23FF2E88' stroke-width='2.5'/%3E%3Cpath d='M10 10h6v6h-6z' fill='%232EE6F0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0B0A12}
a{color:#2EE6F0}a:hover{color:#FF2E88}
.gl-wait{opacity:0}
.gl-play{animation:glIn .84s linear var(--d,0s) both}
@keyframes glIn{
0%{opacity:0;clip-path:inset(40% 0 45% 0);transform:translate3d(-16px,0,0);text-shadow:-4px 0 #FF2E88,4px 0 #2EE6F0;box-shadow:-4px 0 0 rgba(255,46,136,.7),4px 0 0 rgba(46,230,240,.7)}
7%{opacity:1;clip-path:inset(8% 0 72% 0);transform:translate3d(12px,0,0)}
14%{clip-path:inset(58% 0 18% 0);transform:translate3d(-10px,0,0)}
21%{clip-path:inset(0 0 0 0);transform:translate3d(6px,0,0);opacity:.45}
29%{opacity:1;clip-path:inset(22% 0 52% 0);transform:translate3d(-14px,0,0);text-shadow:-4px 0 #FF2E88,4px 0 #2EE6F0}
37%{clip-path:inset(0 0 0 0);transform:translate3d(4px,0,0);text-shadow:-3px 0 #FF2E88,3px 0 #2EE6F0;box-shadow:-3px 0 0 rgba(255,46,136,.6),3px 0 0 rgba(46,230,240,.6)}
46%{clip-path:inset(70% 0 6% 0);transform:translate3d(9px,0,0)}
54%{clip-path:inset(0 0 0 0);transform:translate3d(-3px,0,0);opacity:.75}
66%{opacity:1;transform:translate3d(1px,0,0);text-shadow:-2px 0 rgba(255,46,136,.7),2px 0 rgba(46,230,240,.7);box-shadow:-1px 0 0 rgba(255,46,136,.4),1px 0 0 rgba(46,230,240,.4)}
100%{opacity:1;clip-path:inset(0 0 0 0);transform:none;text-shadow:none;box-shadow:none}}
.tab-in{animation:glIn .6s linear both}
.cpd-play .cpd-body{animation:cpdFade .3s ease-out .6s both}
.crt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:32px;pointer-events:none;background:#050508;background-image:repeating-linear-gradient(0deg,rgba(255,212,0,.07) 0 1px,transparent 1px 3px)}
.cpd-play .crt{animation:crtOn .3s cubic-bezier(.2,.8,.2,1) both,crtOff .2s ease-in .55s forwards}
.bl{margin:0;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.06em;color:#FFD400;white-space:nowrap;clip-path:inset(0 100% 0 0)}
.bl-ok{color:#2EE6F0}
.cpd-play .bl{animation:blType .12s steps(16) var(--d,0s) forwards}
@keyframes crtOn{0%{transform:scale(0,.004);filter:brightness(4)}45%{transform:scale(1,.004);filter:brightness(3)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{to{opacity:0;visibility:hidden}}
@keyframes blType{to{clip-path:inset(0 0 0 0)}}
@keyframes cpdFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero-gl{animation:glHero .9s linear var(--d,0s) both}
@keyframes glHero{
0%{opacity:0;clip-path:inset(40% 0 45% 0);transform:translate3d(-18px,0,0);text-shadow:-5px 0 #FF2E88,5px 0 #2EE6F0}
7%{opacity:1;clip-path:inset(8% 0 72% 0);transform:translate3d(14px,0,0)}
14%{clip-path:inset(58% 0 18% 0);transform:translate3d(-10px,0,0)}
21%{clip-path:inset(0 0 0 0);transform:translate3d(6px,0,0);opacity:.45}
29%{opacity:1;clip-path:inset(22% 0 52% 0);transform:translate3d(-14px,0,0);text-shadow:-5px 0 #FF2E88,5px 0 #2EE6F0}
37%{clip-path:inset(0 0 0 0);transform:translate3d(4px,0,0);text-shadow:-3px 0 #FF2E88,3px 0 #2EE6F0}
46%{clip-path:inset(70% 0 6% 0);transform:translate3d(9px,0,0)}
54%{clip-path:inset(0 0 0 0);transform:translate3d(-3px,0,0);opacity:.75}
66%{opacity:1;transform:translate3d(1px,0,0);text-shadow:-2px 0 rgba(255,46,136,.7),2px 0 rgba(46,230,240,.7)}
100%{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
.hero-bg{animation:heroBg 1.1s steps(1,end) both}
@keyframes heroBg{0%{opacity:0}10%{opacity:.6}18%{opacity:0}30%{opacity:.9}38%{opacity:.3}50%{opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){
.hero-gl,.hero-bg{animation:none}
.gl-wait{opacity:1}
.gl-play,.tab-in,.cpd-play .cpd-body{animation:none}
.crt{display:none}}

[data-soon]{opacity:.5;cursor:not-allowed!important;pointer-events:auto}
[data-soon] .soon-chip{margin-left:6px;padding:1px 6px;border:1px solid currentColor;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
@media (max-width: 720px){
  p.hero-gl{width:auto!important;height:auto!important;max-width:100%!important}
  .hero-bg{justify-content:center!important;align-items:flex-end!important;padding:0 16px 20px!important;font-size:10px}
  .hero-bg > *{opacity:.45}
}
[aria-busy="true"]{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div style="background: #0B0A12; color: #D8D6E8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; min-height: 100vh; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px)">

  <!-- Advisory strip -->
  <div style="display: flex; align-items: stretch; background: #FFD400; color: #0B0A12; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
    <p style="margin: 0; padding: 9px 16px; flex: 1; min-width: 0">{{t.advisory}}</p>
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
  </div>

  <!-- Nav -->
  <header style="border-bottom: 1px solid #2A2740">
    <nav style="max-width: 1280px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 4h12l8 8v12H12L4 16z" fill="none" stroke="#FF2E88" stroke-width="2.5"></path><path d="M10 10h6v6h-6z" fill="#2EE6F0"></path></svg>
        <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.12em">SHIFTER<span style="color: #FF2E88">PUNKZ</span></span>
        <span style="padding: 3px 8px; border: 1px solid #2EE6F0; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #2EE6F0">TRPG</span>
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 24px; flex: 1; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.06em">
        <a href="index.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navHome}}</a>
        <a href="#howto" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navHow}}</a>
        <a href="#lore" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">LORE</a>
        <a href="#store" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navStore}}</a>
      </div>
      <span role="link" aria-disabled="true" title="Coming soon" data-soon style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid #FF2E88; color: #FF2E88; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.06em">{{t.navLogin}}<span class="soon-chip">SOON</span></span>
      <div role="group" aria-label="Language" style="display: flex; border: 1px solid #2EE6F0">
        <button type="button" onClick="{{setTh}}" aria-pressed="{{thPressed}}" style="{{thStyle}}">TH</button>
        <button type="button" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="{{enStyle}}">EN</button>
      </div>
    </nav>
  </header>

  <!-- Hero: full-bleed key art -->
  <section id="top" style="position: relative; min-height: 640px; display: flex; align-items: center; overflow: hidden; background: #120F1E; border-bottom: 1px solid #2A2740">
    <div class="hero-bg" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding: 0 8%; background-image: repeating-linear-gradient(135deg, rgba(46,230,240,0.06) 0 2px, transparent 2px 22px)" aria-hidden="true">
      <p style="margin: 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #6E6A88; line-height: 1.8; white-space: pre-line">{{t.keyArt}}</p>
    </div>
    <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,10,18,0.94) 0%, rgba(11,10,18,0.6) 48%, rgba(11,10,18,0) 78%), linear-gradient(0deg, rgba(11,10,18,1) 0%, rgba(11,10,18,0) 30%)" aria-hidden="true"></div>
    <div style="position: relative; width: 100%; max-width: 1280px; margin: 0 auto; padding: 88px 24px; box-sizing: border-box">
      <div style="max-width: 660px; display: flex; flex-direction: column; gap: 22px">
        <p class="hero-gl" style="--d: 0.15s; margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #2EE6F0">TABLETOP ROLE-PLAYING GAME</p>
        <h1 class="hero-gl" style="--d: 0.3s; margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: clamp(48px, 7vw, 96px); line-height: 0.92; color: #FFFFFF; text-shadow: 0 0 24px rgba(46,230,240,0.45)">SHIFTER<br><span style="color: #FF2E88">PUNKZ</span> <span style="color: #2EE6F0">TRPG</span></h1>
        <p class="hero-gl" style="--d: 0.5s; margin: 0; font-size: 19px; line-height: 1.7; color: #D8D6E8">{{t.heroSub}}</p>
        <div class="hero-gl" style="--d: 0.65s; display: flex; flex-direction: column; gap: 12px; margin-top: 6px">
          <div style="display: flex; flex-wrap: wrap; gap: 12px">
            <a href="#howto" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; background: #FF2E88; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.06em; clip-path: polygon(0 0, 100% 0, 100% 70%, 92% 100%, 0 100%)">{{t.ctaHow}}</a>
            <a href="#lore" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border: 1.5px solid #2EE6F0; color: #2EE6F0; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.06em">{{t.ctaLore}}</a>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 12px">
            <span role="link" aria-disabled="true" title="Coming soon" data-soon style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 28px; background: #2EE6F0; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.06em; clip-path: polygon(0 0, 100% 0, 100% 70%, 92% 100%, 0 100%)">{{t.ctaChar}}<span class="soon-chip">SOON</span></span>
            <a href="#store" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border: 1.5px solid #FFD400; color: #FFD400; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.06em">{{t.ctaStore}}</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 01 HOW TO PLAY -->
  <section id="howto" data-rv="howto" style="background: #0F0D19; border-top: 1px solid #2A2740; border-bottom: 1px solid #2A2740">
    <div style="max-width: 1280px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 48px">
      <div class="{{rv.howto}}" style="display: flex; flex-wrap: wrap; gap: 40px">
        <div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
          <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #2EE6F0">01 // NEW TO TRPG?</p>
          <h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 44px; color: #FFFFFF">{{t.howTitle}}</h2>
          <p style="margin: 0; font-size: 17px; line-height: 1.85">{{t.howP1}}</p>
          <p style="margin: 0; font-size: 17px; line-height: 1.85">{{t.howP2}}</p>
        </div>
        <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{roles}}" as="ro" hint-placeholder-count="2">
            <div style="padding: 22px; background: #151225; border: 1px solid #3A3655; border-left: 3px solid {{ro.accent}}">
              <p style="margin: 0 0 6px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; color: {{ro.accent}}">{{ro.name}}</p>
              <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #C3C0D6">{{ro.desc}}</p>
            </div>
          </sc-for>
        </div>
      </div>

      <!-- Loop -->
      <div style="display: flex; flex-direction: column; gap: 16px">
        <h3 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 26px; color: #FFFFFF">{{t.loopTitle}}</h3>
        <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
          <sc-for list="{{loop}}" as="lp" hint-placeholder-count="4">
            <li class="{{lp.cls}}" style="position: relative; padding: 24px; background: #151225; border: 1px solid #2A2740; --d: {{lp.d}}">
              <p style="margin: 0 0 10px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 40px; line-height: 1; color: #2A2740">{{lp.n}}</p>
              <p style="margin: 0 0 6px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 18px; color: #2EE6F0">{{lp.title}}</p>
              <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #C3C0D6">{{lp.desc}}</p>
            </li>
          </sc-for>
        </ol>
      </div>

      <!-- Example of play + what you need -->
      <div style="display: flex; flex-wrap: wrap; gap: 24px">
        <div style="flex: 1 1 520px; min-width: 0; padding: 23px 28px; background: #08070D; border: 1px solid #2EE6F0; display: flex; flex-direction: column; gap: 14px">
          <p style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.1em; color: #2EE6F0">{{t.exampleLabel}}</p>
          <sc-for list="{{example}}" as="ex" hint-placeholder-count="5">
            <p style="margin: 0; display: flex; align-items: baseline; gap: 12px; font-size: 15px; line-height: 1.75"><span style="flex: 0 0 72px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.04em; color: {{ex.color}}">{{ex.who}}</span><span style="flex: 1; min-width: 0">{{ex.line}}</span></p>
          </sc-for>
        </div>
        <div style="flex: 1 1 340px; min-width: 0; padding: 28px; background: #151225; border: 1px solid #3A3655; display: flex; flex-direction: column; gap: 14px">
          <p style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.1em; color: #FFD400">{{t.needLabel}}</p>
          <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
            <sc-for list="{{needs}}" as="nd" hint-placeholder-count="4">
              <li style="display: flex; gap: 12px; font-size: 15px; line-height: 1.6"><span style="color: #FFD400" aria-hidden="true">▸</span><span><b style="color: #FFFFFF; font-weight: 600">{{nd.name}}</b> — {{nd.desc}}</span></li>
            </sc-for>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- 02 LORE (tabs) -->
  <section id="lore" data-rv="lore" style="max-width: 1280px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px">
    <div class="{{rv.lore}}" style="display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #FF2E88">02 // LORE ARCHIVE</p>
      <h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 44px; color: #FFFFFF">{{t.loreTitle}}</h2>
      <p style="margin: 0; max-width: 680px; font-size: 16px; line-height: 1.7; color: #9A97B0">{{t.loreSub}}</p>
    </div>
    <div role="tablist" aria-label="Lore chapters" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="6">
        <button type="button" role="tab" aria-selected="{{tb.selected}}" onClick="{{tb.pick}}" style="{{tb.style}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.75">{{tb.code}}</span> {{tb.label}}</button>
      </sc-for>
    </div>

    <!-- Origin -->
    <sc-if value="{{show.origin}}" hint-placeholder-val="{{ true }}">
      <div role="tabpanel" class="tab-in" style="display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; background: #151225; border: 1px solid #2A2740; border-top: 3px solid #FF2E88">
        <div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
          <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #FF2E88">CHAPTER 01 // ORIGIN</p>
          <h3 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 32px; color: #FFFFFF">{{t.originTitle}}</h3>
          <sc-for list="{{origin}}" as="p" hint-placeholder-count="5">
            <p style="margin: 0; font-size: 17px; line-height: 1.85">{{p.text}}</p>
          </sc-for>
        </div>
        <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
          <div style="border: 1.5px solid #FFD400; background: #17140A">
            <div style="height: 10px; background: repeating-linear-gradient(45deg, #FFD400 0 10px, #17140A 10px 20px)" aria-hidden="true"></div>
            <div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 10px">
              <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: #FFD400">⚠ EXTINCTED ZONE</p>
              <p style="margin: 0; font-size: 15px; line-height: 1.75; color: #E9E4C8">{{t.zone1}}</p>
              <p style="margin: 0; font-size: 15px; line-height: 1.75; color: #E9E4C8">{{t.zone2}}</p>
            </div>
          </div>
          <div style="padding: 20px 22px; border: 1px dashed #3A3655; display: flex; flex-direction: column; gap: 8px">
            <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #2EE6F0">GENRE</p>
            <p style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 18px; color: #FFFFFF">Semi-cyberpunk · Action</p>
          </div>
        </div>
      </div>
    </sc-if>

    <!-- Shifter -->
    <sc-if value="{{show.shifter}}" hint-placeholder-val="{{ false }}">
      <div role="tabpanel" class="tab-in" style="display: flex; flex-direction: column; gap: 28px; padding: 40px; background: #151225; border: 1px solid #2A2740; border-top: 3px solid #2EE6F0">
        <div style="display: flex; flex-wrap: wrap; gap: 32px">
          <div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
            <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #2EE6F0">CHAPTER 02 // SHIFTER</p>
            <h3 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 32px; color: #FFFFFF">{{t.shifterTitle}}</h3>
            <p style="margin: 0; font-size: 17px; line-height: 1.85">{{t.shifterP1}}</p>
            <p style="margin: 0; font-size: 17px; line-height: 1.85">{{t.shifterP2}}</p>
          </div>
          <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
            <sc-for list="{{shifterRisks}}" as="r" hint-placeholder-count="3">

      els.forEach((el) => this._io.observe(el));
    };

        { text: L('ช่วง พ.ศ. 26xx คลื่นรังสีคอสมิคพัดเข้าสู่ระบบสุริยะและปนเปื้อนโลก บางคนสะสมรังสีในร่างกายโดยไม่รู้ตัว บ้างไหลตาย บ้างป่วยเป็นมะเร็งที่หาสาเหตุไม่ได้ บ้างลุกลามจนติดเตียง บ้างประสาทสัมผัสผิดปกติจนคลุ้มคลั่ง', 'In the 26xx B.E. era, a wave of cosmic radiation swept into the solar system and contaminated Earth. Some absorbed it without knowing: some died in their sleep, some developed unexplained cancers, some became bedridden, and some lost their senses to madness.') },
        { text: L('นักวิทยาศาสตร์ทั่วโลกเก็บตัวอย่างรังสีมาวิจัยหวังหายาต้าน แต่กลับพบสิ่งเหนือความคาดหมาย รังสีเพียงเล็กน้อยแปลงเป็นพลังงานมหาศาลได้ ทั้งไฟฟ้า แสง และความร้อน นวัตกรรมพลังงานคอสมิคจึงกลายเป็นสาธารณูปโภคของผู้คน', 'Scientists everywhere studied samples in search of a cure, and found something else: a trace of the radiation could become enormous energy for electricity, light and heat. Cosmic power became part of everyday infrastructure.') },
        { text: L('นักลงทุนผู้ถือหุ้นโรงพยาบาลเอกชนรายใหญ่เห็นโอกาส จึงบีบนักวิทยาศาสตร์ผู้คิดค้นด้วยเงินมหาศาลและคำขู่ต่อครอบครัว ให้ทดลองดัดแปลงยีนมนุษย์ด้วยรังสีนี้อย่างเงียบๆ โดยใช้ผู้ป่วยไร้บ้านและผู้ป่วยติดเตียงบางส่วน', 'A major private-hospital investor saw an opportunity. With vast sums of money and threats against his family, he forced the inventor to secretly test the radiation on human genes, using homeless people and some bedridden patients.') },
        { text: L('หลายสิบชีวิตผ่านไป จนผู้ป่วยกลุ่มหนึ่งฟื้นตัวอย่างน่าอัศจรรย์ ร่างกายแปรสภาพเป็นบางสิ่งที่เหนือความคาดหมาย และเริ่มปลดปล่อยพลังคอสมิคออกมาเมื่อพยายามหนีจากห้องขัง นักวิทยาศาสตร์จึงเรียกพวกเขาว่า Shifter', 'Dozens of lives later, one group of patients made a miraculous recovery. Their bodies changed in ways no one expected, and when they tried to escape their cells, cosmic power burst out of them. The scientist named them Shifters.') },
        { text: L('Shifter บางคนถูกปล่อยตัวไปสร้างครอบครัว มีทายาททั้งที่เป็นคนธรรมดาและเป็น Shifter ประชากร Shifter จึงเพิ่มขึ้นเรื่อยๆ บางคนใช้พลังมั่วซั่วหรือในทางที่ผิด จนสังคมเหมารวมว่าพวกเขาเป็นตัวประหลาด รัฐบาลจึงก่อตั้ง C.P.D. ขึ้นมาเพื่อกวาดล้างและลดผลกระทบจากรังสี', 'Some Shifters were released and started families, with children who were ordinary or Shifters themselves, and their numbers grew. A few used their powers recklessly or for crime, until society branded them all freaks, and the government founded the C.P.D. to sweep them up and limit the radiation\'s harm.') }
      ],
      shifterRisks: [
        { name: 'Shifter Degradation', desc: L('พลังคอสมิคค่อยๆ กัดกินความทรงจำทุกครั้งที่ใช้พลัง', 'Cosmic power eats away at memory every time it is used.') },
        { name: 'Cosmic Stigma', desc: L('สภาวะที่ได้รับเมื่อใช้พลังเกินค่า Whelm ที่มีอยู่', 'The toll for pushing power beyond your remaining Whelm.') },
        { name: 'Cosmic Outburst', desc: L('พลังหลุดการควบคุม เมื่อใช้เกินตัวหรือได้รับรังสีปริมาณมาก', 'Power breaks loose after overuse or heavy radiation exposure.') }
      ],
      shifters: [
        { code: 'TYPE-01 // FORCE', name: 'Shape', desc: L('เปลี่ยนรูปร่างและสภาพร่างกาย', 'Reshapes the body and its form.'), ex: L('เช่น Cosmic Vapor แปลงร่างเป็นไอคอสมิค, Shadow Bringer คุมเงาเป็นอีกร่าง, Chameleon กลืนไปกับสภาพแวดล้อม, Camouflage แปลงเป็นเป้าหมายที่สัมผัส, Beast แปลงเป็นอสูร', 'e.g. Cosmic Vapor turns to cosmic mist, Shadow Bringer makes a second body of shadow, Chameleon blends in, Camouflage copies whoever you last touched, Beast becomes a monster.') },
        { code: 'TYPE-02 // FORCE', name: 'Heat', desc: L('ควบคุมความร้อนและความเย็น', 'Controls heat and cold.'), ex: L('เช่น Burner เรียกไฟจากตัว, Glacier สร้างน้ำแข็ง, Burstster เปลี่ยนวัตถุเป็นระเบิดเวลา', 'e.g. Burner calls fire from the body, Glacier makes ice, Burstster turns an object into a time bomb.') },
        { code: 'TYPE-03 // TACTICAL', name: 'Energy', desc: L('ควบคุมพลังงานรอบตัว', 'Controls the energy around you.'), ex: L('เช่น คุมแรงแม่เหล็ก, Voltage คุมไฟฟ้า, ย้ายแหล่งกำเนิดแสง, คุมกระแสลม, Void Devourer ดูดอากาศแล้วยิงเป็นกระสุน', 'e.g. magnetism, Voltage controls electricity, moving light sources, wind, Void Devourer swallows air and fires it as bullets.') },
        { code: 'TYPE-04 // TACTICAL', name: 'Velocity', desc: L('เร่งหรือหน่วงความเร็วและเวลา', 'Speeds up or slows down motion and time.'), ex: L('เช่น เพิ่มความเร็วตัวเอง, เร่งเวลาของสภาพวัตถุ, ชะลอหรือหยุดเวลาสั้นๆ', 'e.g. speeding yourself up, aging an object fast, slowing or stopping time briefly.') },
        { code: 'TYPE-05 // TRICK', name: 'Area', desc: L('บิดพื้นที่และตำแหน่ง', 'Bends space and position.'), ex: L('เช่น Replace สลับ 2 วัตถุ, คุมแรงโน้มถ่วง, บีบอัดบรรยากาศ, Blink Rat วาร์ปตัวเอง, สร้างสถานที่จำลองจากภาพวาด', 'e.g. Replace swaps two objects, gravity control, compressing air, Blink Rat teleports, building a place from a drawing.') },
        { code: 'TYPE-06 // TRICK', name: 'Impulse', desc: L('เล่นกับจิตใจและความรู้สึก', 'Plays with minds and feelings.'), ex: L('เช่น สลับความรู้สึกกับเป้าหมาย, Fracture of Mind สร้างภาพหลอน, แฝงจิตเข้าสิ่งมีชีวิต, ยืมความชำนาญผ่านการสัมผัส', 'e.g. swapping feelings with a target, Fracture of Mind causes hallucinations, possessing a living thing, borrowing skill by touch.') },
        { code: 'TYPE-07 // SENSE', name: 'Entropy', desc: L('ย้อนสภาพและความเสื่อม', 'Rewinds state and decay.'), ex: L('เช่น Reverse State ย้อนสภาพร่างกายตัวเองกลับไปเมื่อเทิร์นที่แล้ว', 'e.g. Reverse State rewinds your body to how it was last turn.') },
        { code: 'TYPE-08 // SENSE', name: 'Density', desc: L('เปลี่ยนน้ำหนักและความหนาแน่น', 'Changes weight and density.'), ex: L('เช่น เปลี่ยนน้ำหนักตัวเองหรือวัตถุ, ปรับความดังของเสียง, Venomous กันพิษ มองเห็นและปรับระดับพิษในของเหลว', 'e.g. changing your own or an object\'s weight, sound volume, Venomous resists poison and sees and tunes poison in liquids.') }
      ],
      divisions: [
        { code: 'DIVISION 9', name: 'Aegis Containment Unit', desc: L('หน่วยจู่โจมและกักกันคอสมิค หน้าด่านปะทะ เกราะหนัก ควบคุมพื้นที่ และจับกุมแบบไม่สังหาร', 'Assault and containment. Front-line heavy armor, area control and non-lethal arrests.') },
        { code: 'DIVISION 7', name: 'Specter Investigations', desc: L('หน่วยสืบสวนและสายลับเงา แกะรอยการลักลอบขน Shifter และแทรกซึม อัตราแปรพักตร์และถูกลอบสังหารสูงที่สุด', 'Investigation and shadow agents who trace Shifter trafficking and infiltrate. The highest defection and assassination rates.') },
        { code: 'DIVISION 13', name: 'Re-Genesis Research & Rehab', desc: L('ศูนย์วิจัยและบำบัด นักวิจัยน้ำดีและแพทย์สนาม ผู้สร้างเซรั่มควบคุมพลัง', 'Research and rehabilitation. Honest researchers and field medics who make power-control serums.') },
        { code: 'DIVISION 0', name: 'ARGUS', desc: L('หน่วยข่าวกรองลับสุดยอด ดักฟัง สอดส่อง และสืบสวนคอร์รัปชันทั้งในและนอกองค์กร', 'Top-secret intelligence that watches, listens and investigates corruption inside and outside the agency.') }
      ],
      tiers: [
        { n: '1', color: '#4ADE80', name: 'Field Tracker', desc: L('เจ้าหน้าที่ภาคสนามหน้าใหม่ อุปกรณ์จำกัด เสี่ยงที่สุด และถูกซื้อตัวง่ายที่สุด', 'Rookie field agents with little gear, the greatest risk, and the easiest to buy off.') },
        { n: '2', color: '#2EE6F0', name: 'Tactical Agent', desc: L('บรรจุเข้า Division หลัก ได้อุปกรณ์และสกิลเฉพาะทางประจำหน่วย', 'Posted to a main Division, with its specialist gear and skills.') },
        { n: '3', color: '#FFD400', name: 'Strike Commander', desc: L('หัวหน้าทีมภาคสนาม ขอกำลังเสริมและอนุมัติอาวุธกักกันหนักได้', 'Field team leader who can call in support and authorize heavy containment weapons.') },
        { n: '4', color: '#FF7A3D', name: 'Bureau Inspector', desc: L('ผู้บริหารระดับสูง วางยุทธศาสตร์เขต และเล่นเกมการเมืองเพื่อปกป้องลูกน้อง', 'Senior command who plan district strategy and play politics to protect their people.') },
        { n: '5', color: '#C084FC', name: 'Grand Commissioner', desc: L('ผู้นำสูงสุดและตำนานที่ยังมีชีวิตขององค์กร', 'The agency\'s supreme leader and living legend.') }
      ],
      syndicates: [
        { type: L('ทุนวิจัยและเทคโนโลยีสังเคราะห์', 'RESEARCH CAPITAL & SYNTH TECH'), name: 'Apex Cybernetics', motto: L('มิติเวลาเหรอ? ก็แค่องค์ความรู้ทางวิทยาศาสตร์ที่ยังไม่ได้ถูกใส่ราคา', 'Space-time? Just science that hasn\'t been priced yet.'), desc: L('กลุ่มทุนคราบองค์กรเทคโนโลยีระดับสูง อยู่เบื้องหลังการจับ Shifter มาเป็นแบตเตอรี่มนุษย์ และสร้างอุปกรณ์พลัง Shifter สังเคราะห์', 'A high-tech corporate front behind the capture of Shifters as human batteries and the maker of synthetic Shifter devices.'), style: L('อุปกรณ์ไฮเทค อาวุธปรับแต่ง', 'High-tech gear, modded weapons') },
        { type: L('อิทธิพลมืดและธุรกิจสีเทา', 'DARK INFLUENCE & GREY BUSINESS'), name: 'Golden Crown', motto: L('พลังวิเศษจะไปมีค่าอะไร ถ้าแกโดนซื้อตัวด้วยเงิน หรือโดนกฎหมายล่าจนไม่มีที่ซุกหัวนอน', 'What good is a superpower if you can be bought, or hunted by the law until you have nowhere to sleep?'), desc: L('เจ้าพ่อคาสิโนและกลุ่มทุนเก่าแก่ ถนัดฟอกเงิน ติดสินบน และชิงไหวชิงพริบทางการเมือง มอง Shifter เป็นสินค้า', 'Casino lords and old money who launder, bribe and outmaneuver politicians, and see Shifters as merchandise.'), style: L('คาสิโน แหล่งฟอกเงิน', 'Casinos, money laundering') },
        { type: L('กำลังและอาวุธสงคราม', 'FORCE & WAR WEAPONS'), name: 'Ironhide', motto: L('ไม่สนใจหรอกว่าแกจะวาร์ปหรือบิดเบือนมิติได้… ตราบใดที่เนื้อหนังแกยังสะท้อนกระสุนไม่ได้', 'Warp all you like… your skin still can\'t stop a bullet.'), desc: L('สายทหารและอาวุธหนัก เน้นความโหดเหี้ยมและยุทธวิธีล่า Shifter โดยเฉพาะ ไล่ล่าอดีตหัวหน้าที่หนีทัพไม่ปล่อย', 'Military muscle and heavy weapons, ruthless and trained to hunt Shifters, never letting deserters go.'), style: L('อำนาจทางการทหาร', 'Military power') },
        { type: L('นักฆ่าและข่าวกรองเงา', 'ASSASSINS & SHADOW INTEL'), name: 'Eclipse Phantom', motto: L('ล่าในเงามืด สังหารไร้ร่องรอย อดีตคือสิ่งที่ต้องถูกลบ', 'Hunt in shadow, kill without a trace. The past must be erased.'), desc: L('สายลอบสังหาร กวาดล้าง Shifter ที่แข็งขืน และตามล่าอดีตหัวหน้าที่คิดจะลาออกไปเป็นคนธรรมดา', 'Assassins who erase defiant Shifters and hunt former bosses trying to retire as ordinary people.'), style: L('นักล่าค่าหัว แหล่งข้อมูลใต้ดิน', 'Bounty hunting, underground intel network') },
        { type: L('อดีตผู้มีอิทธิพลและคนนอกกฎหมาย', 'FORMER BOSSES & OUTCASTS'), name: 'Rust & Relics', motto: L('พวกเราไม่ใช่ Shifter… แต่ถ้าคิดจะมาล่าพวกเรา เตรียมใจโดนหมาจนตรอกกัดไว้ได้เลย', 'We\'re not Shifters… but hunt us like one and you\'ll meet a cornered dog\'s bite.'), desc: L('เครือข่ายอดีตหัวหน้าแก๊งที่อิ่มตัว คนที่หนีตาย และคนธรรมดาที่ถูกเข้าใจผิดว่าเป็น Shifter รวมตัวกันเพื่อเอาชีวิตรอด', 'A network of burnt-out former bosses, runaways and ordinary people mistaken for Shifters, banded together to survive.'), style: L('อำนาจการต่อรองกับ Outlaws กลุ่มอื่นๆ', 'Bargaining power over other Outlaw groups') }
      ],
      professions: [
        { name: 'Synth-Tech Mechanic', desc: L('ช่างดัดแปลงอุปกรณ์', 'Gadget modder') },
        { name: 'Back-Alley Street Doc', desc: L('หมอเถื่อน', 'Unlicensed doctor') },
        { name: 'High-Risk Transporter', desc: L('คนขับรถส่งของหนีตาย', 'Getaway courier') },
        { name: 'Cosmic Hazard Cleaner', desc: L('พนักงานเก็บกวาดสารพิษมิติ', 'Radiation cleanup crew') },
        { name: 'Underground Sound Engineer / DJ', desc: L('ดีเจตัดคลื่นเสียงป่วนเรดาร์', 'DJ who jams radar with sound') },
        { name: 'Arena Promoter', desc: L('โปรโมเตอร์สังเวียนเถื่อน', 'Underground fight promoter') }
      ],
      tech: [
        { name: 'Cosmic Gadget', desc: L('อุปกรณ์สังเคราะห์ที่ให้พลังเทียบเคียง Shifter เช่น ถุงมือข้ามมิติระยะสั้น หรือปืนลำแสงสลับมวล ใช้พลังงานจาก Cosmic Die และแบตเตอรี่ในตัว ถ้าใช้จนแบตติดลบ อุปกรณ์จะพังและผู้ใช้ติด Cosmic Stigma', 'Synthetic devices that rival a Shifter, like short-range phase gloves or mass-swap ray guns. They run on Cosmic Dice and an internal battery; run it below zero and the device breaks, leaving the user with Cosmic Stigma.') },
        { name: 'Synthetic Glitch', desc: L('อุปกรณ์สังเคราะห์มักมีเอฟเฟกต์ข้างเคียง เช่น ย้ายมิติได้จริงแต่เซลล์ร่างกายสลายชั่วขณะ หรือมีคลื่นรบกวนจนปวดหัว', 'Synthetic gear has side effects: a phase device that works but briefly breaks down your cells, or interference that splits your skull.') },
        { name: 'Shifter Energy Cell', desc: L('การจับ Shifter จริงมาทำเป็นแบตเตอรี่มนุษย์ เพื่อขับเคลื่อนอาวุธสงครามหรือเกราะป้องกันของกลุ่มผู้มีอิทธิพล', 'Real Shifters captured and turned into human batteries to power the syndicates\' weapons and armor.') }
      ],
      roles: [
        { name: 'Game Master (GM)', accent: '#FFD400', desc: L('ผู้เล่าเรื่องและผู้ตัดสิน บรรยายฉาก เล่นเป็น NPC ทุกตัว วางปมภารกิจ และบอกว่าเมื่อไหร่ต้องทอยเต๋า', 'Storyteller and referee who sets scenes, plays every NPC, builds the mission and calls for rolls.') },
        { name: L('ผู้เล่น (Player)', 'Player'), accent: '#2EE6F0', desc: L('สวมบทบาทตัวละครของตัวเอง ตัดสินใจว่าตัวละครพูดอะไร ทำอะไร และร่วมมือกับเพื่อนผ่านภารกิจ', 'Plays one character: decides what they say and do, and works with the others through the mission.') }
      ],
      loop: stag([
        { n: '01', title: L('GM เล่าสถานการณ์', 'The GM sets the scene'), desc: L('บรรยายว่าตัวละครอยู่ที่ไหน เห็นอะไร และมีอะไรเกิดขึ้น', 'Where you are, what you see, what is happening.') },
        { n: '02', title: L('ผู้เล่นบอกสิ่งที่จะทำ', 'You say what you do'), desc: L('พูดเป็นตัวละครหรือบอกการกระทำได้อย่างอิสระ', 'Speak in character or describe your action, anything goes.') },
        { n: '03', title: L('ทอยเต๋าเมื่อผลไม่แน่นอน', 'Roll when it\'s uncertain'), desc: L('GM บอกว่าใช้ Basic Ability ไหน แล้วทอยเต๋า D8', 'The GM names a Basic Ability and you roll your D8s.') },
        { n: '04', title: L('GM เล่าผลลัพธ์', 'The GM narrates the result'), desc: L('สำเร็จ สำเร็จบางส่วน หรือพลาด เรื่องราวเดินต่อ แล้ววนกลับไปข้อ 1', 'Success, partial success or failure. The story moves, and it starts again.') }
      ], 'howto', 0.2),
