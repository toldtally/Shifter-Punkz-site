<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เข้าสู่ระบบ · Shifter Punkz</title>
<meta name="description" content="เข้าสู่ระบบ Shifter Punkz (beta)">
<meta name="robots" content="noindex">
<meta property="og:title" content="เข้าสู่ระบบ · Shifter Punkz">
<meta property="og:description" content="เข้าสู่ระบบ Shifter Punkz (beta)">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0A12">
<link rel="icon" href="../assets/icons/favicon.ico" sizes="48x48">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="manifest" href="../assets/icons/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0B0A12}
a{color:#2EE6F0}a:hover{color:#FF2E88}
.hero-gl{animation:glHero .9s linear var(--d,0s) both}
@keyframes glHero{
0%{opacity:0;clip-path:inset(40% 0 45% 0);transform:translate3d(-18px,0,0);text-shadow:-5px 0 #FF2E88,5px 0 #2EE6F0}
7%{opacity:1;clip-path:inset(8% 0 72% 0);transform:translate3d(14px,0,0)}
14%{clip-path:inset(58% 0 18% 0);transform:translate3d(-10px,0,0)}
21%{clip-path:inset(0 0 0 0);transform:translate3d(6px,0,0);opacity:.45}
29%{opacity:1;clip-path:inset(22% 0 52% 0);transform:translate3d(-14px,0,0)}
37%{clip-path:inset(0 0 0 0);transform:translate3d(4px,0,0);text-shadow:-3px 0 #FF2E88,3px 0 #2EE6F0}
54%{transform:translate3d(-3px,0,0);opacity:.75}
66%{opacity:1;transform:translate3d(1px,0,0);text-shadow:-2px 0 rgba(255,46,136,.7),2px 0 rgba(46,230,240,.7)}
100%{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
.cpd-play .cpd-body{animation:cpdFade .3s ease-out .6s both}
.crt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:32px;pointer-events:none;background:#050508;background-image:repeating-linear-gradient(0deg,rgba(255,212,0,.07) 0 1px,transparent 1px 3px)}
.cpd-play .crt{animation:crtOn .3s cubic-bezier(.2,.8,.2,1) both,crtOff .2s ease-in .55s forwards}
.bl{margin:0;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.06em;color:#FFD400;white-space:nowrap;clip-path:inset(0 100% 0 0)}
.bl-ok{color:#2EE6F0}
.cpd-play .bl{animation:blType .12s steps(16) var(--d,0s) forwards}
@keyframes crtOn{0%{transform:scale(0,.004);filter:brightness(4)}45%{transform:scale(1,.004);filter:brightness(3)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{to{opacity:0;visibility:hidden}}
@keyframes blType{to{clip-path:inset(0 0 0 0)}}
@keyframes cpdFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fld{width:100%;box-sizing:border-box;min-height:46px;padding:10px 12px;background:#0B0A12;border:1px solid #3A3655;color:#FFFFFF;font-family:'IBM Plex Sans Thai',sans-serif;font-size:15px}
.fld:focus{outline:2px solid #2EE6F0;outline-offset:-1px}
.fld::placeholder{color:#8C88A6}
@media (prefers-reduced-motion: reduce){.hero-gl,.cpd-play .cpd-body{animation:none}.crt{display:none}}

[data-soon]{opacity:.5;cursor:not-allowed!important;pointer-events:auto}
[data-soon] .soon-chip{margin-left:6px;padding:1px 6px;border:1px solid currentColor;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
@media (max-width: 720px){
  p.hero-gl{width:auto!important;height:auto!important;max-width:100%!important}
  .hero-bg{justify-content:center!important;align-items:flex-end!important;padding:0 16px 20px!important;font-size:10px}
  .hero-bg > *{opacity:.45}
}
[aria-busy="true"]{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div style="background: #0B0A12; color: #D8D6E8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; min-height: 100vh; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px)">

  <!-- Advisory strip -->
  <div style="display: flex; align-items: stretch; background: #FFD400; color: #0B0A12; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
    <p style="margin: 0; padding: 9px 16px; flex: 1; min-width: 0">{{t.advisory}}</p>
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
  </div>

  <!-- Nav -->
  <header style="border-bottom: 1px solid #2A2740">
    <nav style="max-width: 1280px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
      <a href="../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 4h12l8 8v12H12L4 16z" fill="none" stroke="#FF2E88" stroke-width="2.5"></path><path d="M10 10h6v6h-6z" fill="#2EE6F0"></path></svg>
        <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.12em">SHIFTER<span style="color: #FF2E88">PUNKZ</span></span>
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 24px; flex: 1; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.06em">
        <a href="../index.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navHome}}</a>
        <a href="../trpg.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">TRPG</a>
      </div>
      <div role="group" aria-label="Language" style="display: flex; border: 1px solid #2EE6F0">
        <button type="button" onClick="{{setTh}}" aria-pressed="{{thPressed}}" style="{{thStyle}}">TH</button>
        <button type="button" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="{{enStyle}}">EN</button>
      </div>
    </nav>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 64px 24px 96px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">

    <!-- Left: why sign up -->
    <section style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 22px; padding-top: 12px">
      <div style="align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid #FFD400; background: #17140A; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #FFD400">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6.5" fill="none" stroke="#FFD400" stroke-width="1.5"></rect><path d="M4.5 6V4.2a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="#FFD400" stroke-width="1.5"></path></svg>
        ACCESS RESTRICTED // REGISTERED PLAYERS ONLY
      </div>
      <h1 class="hero-gl" style="--d: 0.1s; margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: clamp(40px, 5.5vw, 68px); line-height: 1.02; color: #FFFFFF; text-shadow: 0 0 22px rgba(46,230,240,0.35)">{{t.leftTitle}}</h1>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{perks}}" as="pk" hint-placeholder-count="3">
          <li style="display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #151225; border: 1px solid #2A2740; border-left: 3px solid {{pk.accent}}">
            <span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{pk.accent}}; padding-top: 3px">{{pk.code}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-family: 'Chakra Petch', sans-serif; font-size: 17px; color: #FFFFFF">{{pk.title}}</b><span style="font-size: 14px; line-height: 1.6; color: #A9A5C2">{{pk.desc}}</span></span>
          </li>
        </sc-for>
      </ul>
    </section>

    <!-- Right: auth card (CRT boot on open) -->
    <section aria-label="Account" class="cpd-play" style="flex: 1 1 460px; min-width: 0; max-width: 560px; position: relative; overflow: hidden; background: #151225; border: 1px solid #3A3655; border-top: 3px solid #2EE6F0; box-shadow: 0 0 40px rgba(46,230,240,0.12)">
      <div class="crt" aria-hidden="true">
        <p class="bl" style="--d: 0.2s">C.P.D. CITIZEN REGISTRY v26.0</p>
        <p class="bl" style="--d: 0.3s">&gt; VERIFYING IDENTITY...</p>
        <p class="bl bl-ok" style="--d: 0.42s">&gt; READY</p>
      </div>
      <div class="cpd-body" style="padding: 32px; display: flex; flex-direction: column; gap: 22px">

        <sc-if value="{{isSetPw}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #4ADE80">ACCESS GRANTED // INVITE</p>
              <h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 26px; color: #FFFFFF">{{setPwTitle}}</h2>
              <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #A9A5C2">{{setPwSub}}</p>
            </div>
            <sc-if value="{{setPwNeedsName}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="sp-name" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A9A5C2">{{t.displayName}}</label>
                <input id="sp-name" class="fld" type="text" maxlength="30" value="{{setPwName}}" placeholder="{{t.displayPh}}">
              </div>
            </sc-if>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="sp-pw" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A9A5C2">{{setPwLabel}}</label>
              <input id="sp-pw" class="fld" type="password" autocomplete="new-password" placeholder="••••••••">
              <span style="font-size: 12px; color: #8C88A6">{{t.pwHint}}</span>
            </div>
            <sc-if value="{{hasMsg}}" hint-placeholder-val="{{ false }}"><p role="status" aria-live="polite" style="margin: 0; padding: 10px 12px; background: #0B0A12; border-left: 3px solid {{msgColor}}; font-size: 13.5px; line-height: 1.55; color: #E4E1F0">{{msg}}</p></sc-if>
            <button type="button" onClick="{{savePassword}}" style="min-height: 52px; border: 0; cursor: pointer; background: #FF2E88; color: #0B0A12; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.06em">{{setPwBtn}}</button>
          </div>
        </sc-if>
        <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 22px">
            <!-- Tabs -->
            <div role="tablist" aria-label="Account mode" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #3A3655">
              <button type="button" role="tab" aria-selected="{{signupSel}}" onClick="{{goSignup}}" style="{{signupTab}}">{{t.tabSignup}}</button>
              <button type="button" role="tab" aria-selected="{{loginSel}}" onClick="{{goLogin}}" style="{{loginTab}}">{{t.tabLogin}}</button>
            </div>

            <!-- Social -->
            <div style="display: flex; flex-direction: column; gap: 10px">
              <button type="button" onClick="{{socialGoogle}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border: 1px solid #3A3655; background: #FFFFFF; color: #0B0A12; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.03em"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAApCAYAAABHomvIAAAK+klEQVR42sWZe4zc11XHP+fc+/vNy2uT1LghJaSKIIFNHJXajYVMWRu50ApBEWJdRBWSKiKbtipSmwpU9THZ8GgBIUUhTROp0Lg8VO2mUBQhRJOythQnIXFSShQHSkVU4pjaib3Z3dmZ+T3uOfwxsxu3fsZU6pFmNJr53d/vc88993vOPSNcgDkIU1NBDhyo1797156tiOw2s50gkyCXAZsUiSZSgi4BR1Xjs4geLJIsNP/pK99cHz89HWR+Pp3v2XJeuC4qsxiA79mziYa/x4z34tygqk0QcMAdBwRxUEEVREEjoJh7TyUcJMR9ZOnLMj9fererzN7hozEXAehTU1EOHKh9aipyqX+AWj+CZFeSHK8NN5ILiAigoiJiACgq4gkF1EUU1RiIOWgA41nQP5CvfHHufN48K+DaIL9pxzYrw2c15TsYOqmWWlzARB1EkNFtRNC1zygmMvIgChJA1F2COUqMeUQzDB5UrT8k8/u+M7oXp3lSzxRv63Azb7mFkB7V6DssFZVJSqIewAOCyGtjvuvWJmtzH0G6CC4qjgYXDWXyVNZ1rSH/9To1Hyt/9f1TdLvSPQOPnCHmosxS++2Tn8LyWVsR10ITZQxWBagDJIWkuAvrHlz3orqJCiI4CgTQIIY6EnAJuESQgCHDVvuHWsNieLD5yuZd7MJkdtbOCrgOd+dVn4TGnbZIzTCqllEoIhQBq+IIsA64CzgmqI1WW4KOltdd1CA4qJoGhYBrwAmgkYTW7UYnKxLP1JJ+qTN/7zFwvnfDrLvU5wgyS+13X34zl9idMKy0kVSbScgTZAkyg2igjouZ4B5iDJplmcYYVVVMBFXVELMYsjwLMQZ3zBFzBBeldlI7b2XDxDeqlL9rw/y936HblTPtZjlVSnxuy1aGPEkvZPSjMIjCIGP0ijDMoAieiuiBPFAr1Bwyk4dVw6Gq9iNZozEkpRaEK03DDY6+M8TGtSAMTGqX4O28kw1c/325CL9w2UN3HzvnLnYQHGE/yuKmx5DwNhZDzTCEdbD+CNJWM9ciE6whDPSRutLPZP+w/2vnkqpDt96abfvfpV+uNXRjaFyPZvRdn7Usf8fEl84NNwJcIMpuan+kdRuN8DlekYoyRoZhBLcG2MucIlcbZpWuNm6XfU/8+al6yZYto+WZnHQOHx7F9vHjspZ9fHq6NajanyXkO1JpPz/x0F8cu5BsIj7yXofYeB7XNzEQowxKoTBcB3SGGfTzAUvx1+Su577q09MB4ELS1ZrgAxybnt7wxvn5nne7+r079qxC7U823keHv+QkNUlGsVUqFApFdAbRKPLAYvZu+dgLD/n0ZC7zh0teh/n4WTJKinKu9HaqxbHw34SLk7kQALXR/g4OAWNCIovFH8ptRx7y+8lk5vXBrYGtgV4o3GiJn8+vYRi+jtEijTO+jdNBwiAoff0WVy1v5ePUzGEinP0BXdfpa89fhFyIzT+HR8psD01p0fdEcMXH6mgOitN2QezP5GoKXyCeEw5gVmye759FRHeiCmqO+yniI05GpPRFWvJlB2E/5whqFxDf8cf+E3XOm0JJcr14T7oiIrw <script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'th', mode: 'signup', role: 'player', name: '', switched: false };
  }
  renderVals() {
    const th = this.state.lang !== 'en';
    const L = (a, b) => (th ? a : b);
    const mode = this.state.mode;
    const on = 'min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-family: JetBrains Mono, monospace; font-size: 13px; font-weight: 500; background: #2EE6F0; color: #0B0A12';
    const off = 'min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-family: JetBrains Mono, monospace; font-size: 13px; font-weight: 500; background: transparent; color: #2EE6F0';
    const tabBase = 'min-height: 48px; border: 0; cursor: pointer; font-family: Chakra Petch, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.04em; ';
    const tabOn = tabBase + 'background: #2EE6F0; color: #0B0A12';
    const tabOff = tabBase + 'background: transparent; color: #D8D6E8';
    const roleBase = 'text-align: left; padding: 14px; cursor: pointer; background: #0B0A12; color: #FFFFFF; min-height: 44px; ';
    const roleDefs = [
      { id: 'player', name: L('ผู้เล่น', 'Player'), accent: '#2EE6F0', desc: L('สร้างตัวละครและเข้าร่วม session', 'Make characters and join sessions') },
      { id: 'gm', name: 'GM', accent: '#FFD400', desc: L('เปิด session และดูตัวละครของผู้เล่น', 'Run sessions and see players\' sheets') }
    ];
    const cur = roleDefs.find((r) => r.id === this.state.role) || roleDefs[0];
    const nm = (this.state.name || '').trim();
    return {
      setTh: () => this.setState({ lang: 'th' }),
      setEn: () => this.setState({ lang: 'en' }),
      thPressed: th ? 'true' : 'false',
      enPressed: th ? 'false' : 'true',
      thStyle: th ? on : off,
      enStyle: th ? off : on,
      isSignup: mode === 'signup',
      isLogin: mode === 'login',
      isDone: mode === 'done',
      notDone: mode !== 'done',
      signupSel: mode === 'signup' ? 'true' : 'false',
      loginSel: mode === 'login' ? 'true' : 'false',
      signupTab: mode === 'signup' ? tabOn : tabOff,
      loginTab: mode === 'login' ? tabOn : tabOff,
      goSignup: () => this.setState({ mode: 'signup' }),
      goLogin: () => this.setState({ mode: 'login' }),
      submit: () => this.setState({ mode: 'done' }),
      socialGoogle: () => this.setState({ mode: 'done' }),
      socialDiscord: () => this.setState({ mode: 'done' }),
      logout: () => this.setState({ mode: 'login' }),
      setName: (e) => this.setState({ name: e && e.target ? e.target.value : '' }),
      roles: roleDefs.map((r) => Object.assign({}, r, {
        pressed: r.id === cur.id ? 'true' : 'false',
        style: roleBase + (r.id === cur.id ? 'border: 2px solid ' + r.accent + '; box-shadow: 0 0 16px ' + (r.id === 'gm' ? 'rgba(255,212,0,0.2)' : 'rgba(46,230,240,0.2)') : 'border: 2px solid #3A3655'),
        pick: () => this.setState({ role: r.id })
      })),
      roleSwitch: roleDefs.map((r) => Object.assign({}, r, {
        pressed: r.id === cur.id ? 'true' : 'false',
        style: 'min-height: 44px; border: 0; cursor: pointer; font-family: Chakra Petch, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.04em; ' + (r.id === cur.id ? 'background: ' + r.accent + '; color: #0B0A12' : 'background: transparent; color: #D8D6E8'),
        pick: () => { if (r.id !== this.state.role) this.setState({ role: r.id, switched: true }); }
