<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GM Monitor · Shifter Punkz</title>
<meta name="description" content="GM Monitor Shifter Punkz (beta)">
<meta name="robots" content="noindex">
<meta property="og:title" content="GM Monitor · Shifter Punkz">
<meta property="og:description" content="GM Monitor Shifter Punkz (beta)">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0A12">
<link rel="icon" href="../assets/icons/favicon.ico" sizes="48x48">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="manifest" href="../assets/icons/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0B0A12}
a{color:#2EE6F0}a:hover{color:#FF2E88}
.cpd-play .cpd-body{animation:cpdFade .3s ease-out .6s both}
.crt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:32px;pointer-events:none;background:#050508;background-image:repeating-linear-gradient(0deg,rgba(255,212,0,.07) 0 1px,transparent 1px 3px)}
.cpd-play .crt{animation:crtOn .3s cubic-bezier(.2,.8,.2,1) both,crtOff .2s ease-in .55s forwards}
.bl{margin:0;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.06em;color:#FFD400;white-space:nowrap;clip-path:inset(0 100% 0 0)}
.bl-ok{color:#2EE6F0}
.cpd-play .bl{animation:blType .12s steps(16) var(--d,0s) forwards}
@keyframes crtOn{0%{transform:scale(0,.004);filter:brightness(4)}45%{transform:scale(1,.004);filter:brightness(3)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{to{opacity:0;visibility:hidden}}
@keyframes blType{to{clip-path:inset(0 0 0 0)}}
@keyframes cpdFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.live-dot{animation:livePulse 1.4s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
.flash{animation:flashIn 1.2s ease-out}
@keyframes flashIn{0%{box-shadow:0 0 0 2px #FFD400,0 0 28px rgba(255,212,0,.45)}100%{box-shadow:0 0 0 0 rgba(255,212,0,0)}}
.fld{width:100%;box-sizing:border-box;padding:8px 10px;background:#0B0A12;border:1px solid #2A2740;color:#FFFFFF;font-family:'IBM Plex Sans Thai',sans-serif;font-size:13px}
.fld:focus{outline:2px solid #2EE6F0;outline-offset:-1px}
.fld::placeholder{color:#6E6A88}
summary{cursor:pointer;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#D8D6E8;min-height:32px;display:flex;align-items:center}
@media (prefers-reduced-motion: reduce){.cpd-play .cpd-body,.flash,.live-dot{animation:none}.crt{display:none}}
.eq{display:flex;align-items:flex-end;gap:3px;height:18px}
.eq i{display:block;width:4px;height:4px;background:currentColor;animation:eqB .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
.eq.off i{animation:none;height:3px;opacity:.5}
@keyframes eqB{0%,100%{height:4px}50%{height:18px}}
.bgm-range{width:100%;accent-color:#2EE6F0}
@media (prefers-reduced-motion: reduce){.eq i{animation:none;height:8px}}

[data-soon]{opacity:.5;cursor:not-allowed!important;pointer-events:auto}
[data-soon] .soon-chip{margin-left:6px;padding:1px 6px;border:1px solid currentColor;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
@media (max-width: 720px){
  p.hero-gl{width:auto!important;height:auto!important;max-width:100%!important}
  .hero-bg{justify-content:center!important;align-items:flex-end!important;padding:0 16px 20px!important;font-size:10px}
  .hero-bg > *{opacity:.45}
}
[aria-busy="true"]{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div style="background: #0B0A12; color: #D8D6E8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; min-height: 100vh; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px)">

  <div style="display: flex; align-items: stretch; background: #FFD400; color: #0B0A12; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
    <p style="margin: 0; padding: 9px 16px; flex: 1; min-width: 0">{{t.advisory}}</p>
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
  </div>

  <header style="border-bottom: 1px solid #2A2740">
    <nav style="max-width: 1400px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
      <a href="../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
        <img src="../assets/logo-z.png" alt="Shifter Punkz" width="40" height="40" style="display: block; width: 40px; height: 40px">
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 24px; flex: 1; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.06em">
        <a href="../index.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navHome}}</a>
        <a href="../trpg.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">TRPG</a>
        <a href="sessions.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navTables}}</a>
        <a href="npcs.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navNpc}}</a>
      </div>
      <div style="position: relative" onKeyDown="{{userMenuKey}}">
        <button type="button" onClick="{{toggleUserMenu}}" aria-haspopup="true" aria-expanded="{{userMenuExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px 0 4px; border: 1px solid {{roleColor}}; text-decoration: none; color: #FFFFFF; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; background: transparent; cursor: pointer">
        <span style="width: 30px; height: 30px; background: #1D1930; border: 1px solid #3A3655; display: flex; align-items: center; justify-content: center; font-size: 13px; color: {{roleColor}}" aria-hidden="true">{{meInitial}}</span><span>{{meName}}</span>
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="margin-left: 2px"><path d="M1.5 3.5L5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg>
        </button>
        <sc-if value="{{userMenuOpen}}" hint-placeholder-val="{{ false }}">
          <div role="menu" style="position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; min-width: 210px; display: flex; flex-direction: column; background: #151225; border: 1px solid #3A3655; box-shadow: 0 14px 34px rgba(0,0,0,0.55)">
            <sc-if value="{{menuNotGm}}" hint-placeholder-val="{{ true }}">
              <a role="menuitem" href="characters.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #2EE6F0; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuChars}}</a>
              <sc-if value="{{charJustSwitched}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: #4ADE80; border-bottom: 1px solid #2A2740">{{t.menuSwitchedPlayer}}</p>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuIsGm}}" hint-placeholder-val="{{ false }}">
              <button type="button" role="menuitem" onClick="{{askChars}}" aria-expanded="{{charWarnExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #2EE6F0; border-bottom: 1px solid #2A2740; width: 100%; border: 0; border-bottom: 1px solid #2A2740; background: transparent; cursor: pointer; text-align: left"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuChars}}<span style="margin-left: auto; padding: 1px 6px; border: 1px solid #2EE6F0; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">PLAYER</span></button>
              <sc-if value="{{charWarn}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #06181A; border-bottom: 1px solid #2A2740">
                  <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #C9EEF0">{{charWarnText}}</p>
                  <button type="button" onClick="{{switchToPlayer}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; background: #2EE6F0; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; cursor: pointer">{{t.menuSwitchPlayer}}</button>
                </div>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuIsGm}}" hint-placeholder-val="{{ false }}">
              <a role="menuitem" href="sessions.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FFD400; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M5 14.5h6M8 12v2.5" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuSessions}}</a>
              <sc-if value="{{roleJustSwitched}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: #4ADE80; border-bottom: 1px solid #2A2740">{{t.menuSwitched}}</p>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuCanAskGm}}" hint-placeholder-val="{{ true }}">
              <button type="button" role="menuitem" onClick="{{askSessions}}" aria-expanded="{{roleWarnExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; width: 100%; border: 0; border-bottom: 1px solid #2A2740; background: transparent; cursor: pointer; text-align: left; color: #FFD400"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M5 14.5h6M8 12v2.5" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuSessions}}<span style="margin-left: auto; padding: 1px 6px; border: 1px solid #FFD400; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">GM</span></button>
              <sc-if value="{{roleWarn}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #1F1A06; border-bottom: 1px solid #2A2740">
                  <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #EDE3B8">{{roleWarnText}}</p>
                  <button type="button" onClick="{{switchToGm}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; background: #FFD400; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; cursor: pointer">{{t.menuSwitchRole}}</button>
                </div>
              </sc-if>
            </sc-if>
            <a role="menuitem" href="account.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #D8D6E8; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="#2EE6F0" stroke-width="1.5"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="#2EE6F0" stroke-width="1.5"></path></svg>{{t.menuSettings}}</a>
            <a role="menuitem" href="auth.html" onClick="{{navLogout}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FF3D6E"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3v11h3M10.5 5l3 3-3 3M13.5 8H6" fill="none" stroke="#FF3D6E" stroke-width="1.5"></path></svg>{{t.menuLogout}}</a>
          </div>
        </sc-if>
      </div>
      <div role="group" aria-label="Language" style="display: flex; border: 1px solid #2EE6F0">
        <button type="button" onClick="{{setTh}}" aria-pressed="{{thPressed}}" style="{{thStyle}}">TH</button>
        <button type="button" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="{{enStyle}}">EN</button>
      </div>
    </nav>
  </header>

  

  <!-- LOCKED (player) -->
  <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
    <main style="max-width: 720px; margin: 0 auto; padding: 80px 24px 120px">
      <section style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px; padding: 36px; background: #151225; border: 1px solid #FFD400; border-top: 3px solid #FFD400">
        <div style="height: 10px; align-self: stretch; background: repeating-linear-gradient(45deg, #FFD400 0 10px, #151225 10px 20px)" aria-hidden="true"></div>
        <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #FFD400">ACCESS DENIED // GM CLEARANCE REQUIRED</p>
        <h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 40px; color: #FFFFFF">{{t.lockTitle}}</h1>
        <p style="margin: 0; font-size: 16px; line-height: 1.75; color: #A9A5C2">{{t.lockBody}}</p>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <a href="account.html#role" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; background: #FFD400; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; clip-path: polygon(0 0, 100% 0, 100% 70%, 92% 100%, 0 100%)">{{t.switchRole}}</a>
          <a href="characters.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border: 1.5px solid #3A3655; color: #D8D6E8; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px">{{t.backMine}}</a>
        </div>
      </section>
    </main>
  </sc-if>

  <!-- GM VIEW -->
  <sc-if value="{{isGm}}" hint-placeholder-val="{{ true }}">
    <main class="cpd-play" style="position: relative; max-width: 1400px; margin: 0 auto; padding: 28px 24px 96px">
      <div class="crt" aria-hidden="true">
        <p class="bl" style="--d: 0.2s">C.P.D. TACTICAL TABLE v26.0</p>
        <p class="bl" style="--d: 0.3s">&gt; LINKING PLAYER SIGNALS...</p>
        <p class="bl bl-ok" style="--d: 0.42s">&gt; LIVE</p>
      </div>
      <div class="cpd-body" style="display: flex; flex-direction: column; gap: 24px">

        <!-- Title + table -->
        <div style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #2A2740">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #FF3D6E"><span class="live-dot" style="width: 9px; height: 9px; background: #FF3D6E; border-radius: 50%" aria-hidden="true"></span>LIVE // {{curTableLabel}}</p>
            <h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: clamp(36px, 4.5vw, 54px); color: #FFFFFF; text-shadow: 0 0 22px rgba(255,212,0,0.3)">GM Monitor</h1>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
            <div style="position: relative">
              <button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuExpanded}}" aria-haspopup="true" style="min-height: 48px; padding: 0 14px; display: inline-flex; align-items: center; gap: 10px; border: 1px solid #2EE6F0; background: #151225; color: #FFFFFF; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #2EE6F0">{{t.switchTable}}</span>{{curTableName}} <span aria-hidden="true" style="color: #2EE6F0">▾</span></button>
              <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
                <div role="menu" style="position: absolute; z-index: 5; top: calc(100% + 6px); right: 0; width: 320px; max-width: 80vw; display: flex; flex-direction: column; background: #151225; border: 1px solid #3A3655; box-shadow: 0 12px 32px rgba(0,0,0,0.5)">
                  <sc-for list="{{tableMenu}}" as="tm" hint-placeholder-count="2">
                    <button type="button" role="menuitem" onClick="{{tm.pick}}" aria-current="{{tm.current}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px; border: 0; border-bottom: 1px solid #2A2740; background: {{tm.bg}}; color: #FFFFFF; cursor: pointer; text-align: left">
                      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{tm.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8C88A6">{{tm.code}} · {{tm.players}}</span></span>
                      <span style="padding: 2px 8px; border: 1px solid {{tm.stColor}}; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: {{tm.stColor}}">{{tm.stLabel}}</span>
                    </button>
                  </sc-for>
                  <a href="sessions.html" role="menuitem" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; color: #2EE6F0; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{t.manageTables}} →</a>
                </div>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 14px; border: 1px solid #3A3655; background: #151225">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #8C88A6">SESSION LV</span>
              <sc-if value="{{lvEdit}}" hint-placeholder-val="{{ true }}">
                <select aria-label="Session Lv" onChange="{{onLv}}" style="font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #2EE6F0; background: #0B0A12; border: 1px solid #3A3655; padding: 0 2px; cursor: pointer">
                  <sc-for list="{{lvOpts}}" as="o" hint-placeholder-count="21">
                    <option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option>
                  </sc-for>
                </select>
              </sc-if>
              <sc-if value="{{lvFixed}}" hint-placeholder-val="{{ false }}">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #2EE6F0">{{curLv}}</span>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 14px; border: 1px solid #3A3655; background: #151225">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #8C88A6">{{t.tableCode}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #FFD400; user-select: all">{{curCode}}</span>
            </div>
            <button type="button" onClick="{{copyCode}}" style="min-height: 48px; padding: 0 16px; border: 1px solid #FFD400; background: transparent; color: #FFD400; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{copyLabel}}</button>
            <sc-if value="{{showCtl}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{togglePause}}" aria-pressed="{{pausedPressed}}" style="min-height: 48px; padding: 0 16px; border: 1px solid #FFD400; background: {{pauseBg}}; color: {{pauseFg}}; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{pauseLabel}}</button>
              <sc-if value="{{showEndPlay}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{askEnd}}" aria-expanded="{{endExpanded}}" style="min-height: 48px; padding: 0 16px; border: 1px solid #FF3D6E; background: transparent; color: #FF3D6E; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{t.endSession}}</button>
              </sc-if>
              <sc-if value="{{isCampaign}}" hint-placeholder-val="{{ false }}">
                <button type="button" onClick="{{askEndCamp}}" aria-expanded="{{endCampExpanded}}" style="min-height: 48px; padding: 0 16px; border: 0; background: #FF3D6E; color: #0B0A12; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{t.endCampaign}}</button>
              </sc-if>
            </sc-if>
          </div>
        </div>
        <sc-if value="{{hasSwitch}}" hint-placeholder-val="{{ false }}">
          <div role="alertdialog" aria-label="{{t.oneRun}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px; background: #1F1A06; border: 1px solid #FFD400">
            <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <p style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; color: #FFD400">{{switchTitle}}</p>
              <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #EDE3B8">{{switchBody}}</p>
            </div>
            <button type="button" onClick="{{cancelSwitch}}" style="min-height: 40px; padding: 0 16px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{t.cancel}}</button>
            <button type="button" onClick="{{doSwitch}}" style="min-height: 40px; padding: 0 16px; border: 0; background: #FFD400; color: #0B0A12; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{t.doSwitch}}</button>
          </div>
        </sc-if>
        <sc-if value="{{hasEnd}}" hint-placeholder-val="{{ false }}">
          <div role="alertdialog" aria-labelledby="end-h" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px; background: #24060E; border: 1px solid #FF3D6E">
            <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <p id="end-h" style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; color: #FF3D6E">{{endTitle}}</p>
              <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #F2C9D3">{{endBody}}</p>
            </div>
            <button type="button" onClick="{{cancelEnd}}" style="min-height: 40px; padding: 0 16px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{t.cancel}}</button>
            <button type="button" onClick="{{doEnd}}" style="min-height: 40px; padding: 0 16px; border: 0; background: #FF3D6E; color: #0B0A12; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{endOk}}</button>
          </div>
        </sc-if>
        <sc-if value="{{hasEnded}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 14px; background: #151225; border: 1px solid #3A3655; border-left: 3px solid #8C88A6">
            <p style="margin: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8C88A6">ARCHIVE // {{endedNote}}</span>
              <span style="font-size: 14px; color: #D8D6E8">{{t.archiveNote}}</span>
            </p>
            <a href="sessions.html" style="color: #2EE6F0; font-weight: 700; font-size: 14px">{{t.backSessions}}</a>
          </div>
        </sc-if>
        <sc-if value="{{hasIdle}}" hint-placeholder-val="{{ false }}">
          <p role="status" style="margin: 0; padding: 12px 14px; background: #151225; border-left: 3px solid #C084FC; font-size: 14px; line-height: 1.6; color: #D8D6E8">{{idleNote}}</p>
        </sc-if>
        </div>

        <!-- Online + Turn order -->
        <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch">
          <div style="flex: 0 1 220px; min-width: 180px; padding: 14px 16px; background: #151225; border: 1px solid #2A2740; border-left: 3px solid #4ADE80; display: flex; flex-direction: column; gap: 4px">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8C88A6">{{t.online}}</span>
            <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 28px; color: #4ADE80">{{onlineCount}}</span>
          </div>
          <section aria-labelledby="turn-h" style="flex: 999 1 560px; min-width: 0; padding: 14px 16px; background: #151225; border: 1px solid #2A2740; border-left: 3px solid #FFD400; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
              <div style="display: flex; align-items: baseline; gap: 12px">
                <h2 id="turn-h" style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.06em; color: #FFFFFF">TURN ORDER</h2>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FFD400">ROUND {{round}}</span>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <button type="button" onClick="{{prevTurn}}" style="min-height: 38px; padding: 0 12px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{t.prev}}</button>
                <button type="button" onClick="{{nextTurn}}" style="min-height: 38px; padding: 0 16px; border: 0; background: #FFD400; color: #0B0A12; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{t.next}}</button>
                <button type="button" onClick="{{resetRound}}" style="min-height: 38px; padding: 0 12px; border: 1px solid #3A3655; background: transparent; color: #8C88A6; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{t.resetRound}}</button>
              </div>
            </div>
            <ol aria-label="Turn order" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{turns}}" as="tn" hint-placeholder-count="5">
                <li style="{{tn.style}}">
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{tn.numColor}}">{{tn.pos}}</span>
                  <span style="display: flex; flex-direction: column; min-width: 0">
                    <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; color: {{tn.nameColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tn.name}}</span>
                    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: {{tn.kindColor}}">{{tn.kind}}</span>
                  </span>
                  <span style="display: flex; gap: 4px; margin-left: auto">
                    <button type="button" aria-label="{{tn.upLabel}}" onClick="{{tn.up}}" disabled="{{tn.first}}" style="width: 28px; height: 28px; border: 1px solid #3A3655; background: #0B0A12; color: #D8D6E8; cursor: pointer">◀</button>
                    <button type="button" aria-label="{{tn.downLabel}}" onClick="{{tn.down}}" disabled="{{tn.last}}" style="width: 28px; height: 28px; border: 1px solid #3A3655; background: #0B0A12; color: #D8D6E8; cursor: pointer">▶</button>
                    <sc-if value="{{tn.isNpc}}" hint-placeholder-val="{{ false }}">
                      <button type="button" aria-label="{{tn.rmLabel}}" onClick="{{tn.remove}}" style="width: 28px; height: 28px; border: 1px solid #4A1630; background: #0B0A12; color: #FF3D6E; cursor: pointer">×</button>
                    </sc-if>
                  </span>
                </li>
              </sc-for>
            </ol>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
              <label for="npc-name" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8C88A6">{{t.addNpc}}</label>
              <input id="npc-name" class="fld" type="text" maxlength="30" placeholder="{{t.npcPh}}" value="{{npcName}}" onInput="{{setNpcName}}" style="flex: 1 1 200px; width: auto; min-height: 38px">
              <button type="button" onClick="{{addNpc}}" style="min-height: 38px; padding: 0 16px; border: 1px solid #FF2E88; background: transparent; color: #FF2E88; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">+ NPC</button>
            </div>
          </section>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
          <!-- Party cards -->
          <div style="flex: 999 1 640px; min-width: 0; align-self: flex-start; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px">
            <sc-for list="{{party}}" as="p" hint-placeholder-count="3">
              <article class="{{p.flash}}" style="display: flex; flex-direction: column; gap: 12px; padding: 18px; background: #151225; border: 1px solid #2A2740; border-top: 3px solid {{p.color}}">
                <div style="display: flex; gap: 12px; align-items: center">
                  <div style="position: relative; width: 52px; height: 52px; flex-shrink: 0; background: #0B0A12; border: 1px solid {{p.color}}; display: flex; align-items: center; justify-content: center; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 22px; color: {{p.color}}" aria-hidden="true"><sc-if value="{{p.hasPortrait}}" hint-placeholder-val="{{ false }}"><img src="{{p.portrait}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></sc-if><sc-if value="{{p.noPortrait}}" hint-placeholder-val="{{ true }}">{{p.initial}}</sc-if><span style="position: absolute; right: -4px; bottom: -4px; width: 12px; height: 12px; border: 2px solid #151225; background: {{p.onlineColor}}"></span></div>
                  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                    <h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 21px; color: #FFFFFF">{{p.name}}</h2>
                    <p style="margin: 0; font-size: 12px; color: #A9A5C2">{{p.sub}}</p>
                  </div>
                  <span style="padding: 2px 8px; border: 1px solid {{p.color}}; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{p.color}}">{{p.factor}}</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 7px">
                  <sc-for list="{{p.bars}}" as="b" hint-placeholder-count="2">
                    <div style="display: flex; align-items: center; gap: 10px">
                      <span style="width: 26px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{b.color}}">{{b.k}}</span>
                      <div style="flex: 1; height: 10px; background: #0B0A12; border: 1px solid #2A2740" aria-hidden="true"><div style="height: 100%; width: {{b.pct}}; background: {{b.color}}; transition: width .5s"></div></div>
                      <span style="width: 54px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #FFFFFF">{{b.v}}</span>
                    </div>
                  </sc-for>
                </div>
                <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #2A2740; border: 1px solid #2A2740">
                  <sc-for list="{{p.ba}}" as="s" hint-placeholder-count="4">
                    <div style="padding: 6px 2px; background: #0B0A12; text-align: center"><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8C88A6">{{s.k}}</span><span style="display: block; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 17px; color: #FFFFFF">{{s.v}}</span></div>
                  </sc-for>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px">
                  <span style="padding: 3px 8px; background: #0B0A12; border: 1px solid #2A2740; color: #FFD400">SE {{p.se}}</span>
                  <span style="padding: 3px 8px; background: #0B0A12; border: 1px solid #2A2740; color: #FF2E88">EX {{p.ex}}</span>
                  <span style="padding: 3px 8px; background: #0B0A12; border: 1px solid #2A2740; color: #D8D6E8">ADV {{p.adv}}</span>
                  <span style="padding: 3px 8px; background: #0B0A12; border: 1px solid #2A2740; color: #A9A5C2">COIN {{p.coins}}</span>
                  <span style="padding: 3px 8px; background: #0B0A12; border: 1px solid #2A2740; color: #4ADE80">SLOT {{p.slots}}</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 10px">
                  <sc-for list="{{p.loadout}}" as="lg" hint-placeholder-count="4">
                    <div style="display: flex; flex-direction: column; gap: 4px">
                      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: {{lg.color}}">{{lg.k}}</span>
                      <sc-if value="{{lg.empty}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #8C88A6">{{lg.emptyText}}</span></sc-if>
                      <sc-for list="{{lg.items}}" as="it" hint-placeholder-count="1">
                        <div style="display: flex; flex-direction: column; gap: 2px; padding: 6px 9px; background: #0B0A12; border: 1px solid #2A2740; border-left: 2px solid {{lg.color}}">
                          <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><b style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FFFFFF">{{it.name}}</b><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A9A5C2">{{it.meta}}</span></span>
                          <span style="font-size: 12.5px; line-height: 1.5; color: #A9A5C2">{{it.fx}}</span>
                        </div>
                      </sc-for>
                    </div>
                  </sc-for>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8C88A6">INJURIES</span>
                  <sc-if value="{{p.noInj}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; color: #8C88A6">—</span></sc-if>
                  <sc-for list="{{p.inj}}" as="ij" hint-placeholder-count="1">
                    <span style="padding: 2px 8px; background: #2A0F1C; border: 1px solid #FF3D6E; font-size: 12px; color: #FF8FA8">{{ij.n}}</span>
                  </sc-for>
                </div>
                <details>
                  <summary>{{t.details}}</summary>
                  <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 6px; font-size: 13px; line-height: 1.6; color: #A9A5C2">
                    <sc-for list="{{p.detail}}" as="dl" hint-placeholder-count="4">
                      <p style="margin: 0"><b style="color: #FFFFFF; font-weight: 600">{{dl.k}}</b> {{dl.v}}</p>
                    </sc-for>
                  </div>
                </details>
                <textarea class="fld" rows="2" aria-label="{{t.gmNote}} {{p.name}}" placeholder="{{t.gmNote}}" onInput="{{p.onNote}}">{{p.note}}</textarea>
                <sc-if value="{{p.notConfirm}}" hint-placeholder-val="{{ true }}">
                  <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid #2A2740">
                    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{p.agoColor}}">{{p.ago}}</span>
                    <button type="button" onClick="{{p.askDel}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #4A1630; background: transparent; color: #FF3D6E; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">{{t.remove}}</button>
                  </div>
                </sc-if>
                <sc-if value="{{p.isConfirm}}" hint-placeholder-val="{{ false }}">
                  <div role="alertdialog" aria-label="{{t.remove}} {{p.name}}" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #1A0B14; border: 1px solid #FF3D6E">
                    <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #E8C9D3">{{p.confirmText}}</p>
                    <div style="display: flex; gap: 8px; justify-content: flex-end">
                      <button type="button" onClick="{{p.cancelDel}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">{{t.cancel}}</button>
                      <button type="button" onClick="{{p.doDel}}" style="min-height: 36px; padding: 0 12px; border: 0; background: #FF3D6E; color: #0B0A12; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">{{t.confirmRemove}}</button>
                    </div>
                  </div>
                </sc-if>
              </article>
            </sc-for>
          </div>

          <aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

              <div style="padding: 10px 16px; background: #1D1930; border-bottom: 1px solid #2A2740; display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: #FFFFFF">LIVE FEED</h2><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{feedStateColor}}">{{feedState}}</span></div>
              <ol role="log" aria-live="polite" style="flex: 1 1 0; min-height: 260px; margin: 0; padding: 8px 0; list-style: none; display: flex; flex-direction: column; overflow-y: auto">

                  <li style="display: flex; gap: 10px; padding: 8px 16px; border-bottom: 1px solid #1D1930; font-size: 13px; line-height: 1.5">
                    <span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8C88A6; padding-top: 2px">{{fd.time}}</span>
                    <span><b style="color: {{fd.color}}; font-weight: 600">{{fd.who}}</b> <span style="color: #D8D6E8">{{fd.what}}</span></span>
                  </li>
                </sc-for>
              </ol>
            </section>
          </aside>
        </div>

        <!-- Scene screen: pictures the GM puts up for every seated player -->
        <section aria-labelledby="scene-h" style="background: #151225; border: 1px solid #2A2740; border-top: 3px solid #FF2E88">
          <div style="padding: 10px 16px; background: #1D1930; border-bottom: 1px solid #2A2740; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px">
            <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px">
              <h2 id="scene-h" style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: #FFFFFF">SCENE SCREEN</h2>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #8C88A6">{{t.sceneSub}}</span>
            </div>
            <span role="status" aria-live="polite" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: {{sceneStatusColor}}">{{sceneStatus}}</span>
          </div>
          <div style="padding: 16px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 20px">
            <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A9A5C2">{{t.sceneNow}}</span>
              <sc-if value="{{sceneNoShown}}" hint-placeholder-val="{{ false }}">
                <div style="aspect-ratio: 16 / 10; max-width: 100%; background: #0B0A12; border: 1px solid #2A2740; display: flex; align-items: center; justify-content: center">
                  <span style="padding: 16px; text-align: center; font-size: 13px; line-height: 1.6; color: #8C88A6">{{t.sceneOff}}</span>
                </div>
              </sc-if>
              <sc-if value="{{sceneHasShown}}" hint-placeholder-val="{{ true }}">
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px">
                  <sc-for list="{{sceneShownList}}" as="sh" hint-placeholder-count="4">
                    <div style="min-width: 0; display: flex; flex-direction: column; background: #0B0A12; border: 1px solid #FF2E88">
                      <div style="position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #000000">
                        <img src="{{sh.url}}" alt="{{sh.title}}" style="width: 100%; height: 100%; object-fit: contain; display: block">
                        <span style="position: absolute; top: 6px; left: 6px; padding: 2px 6px; background: #FF2E88; color: #0B0A12; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">{{sh.slot}}</span>
                      </div>
                      <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px">
                        <span style="flex: 1; min-width: 0; font-size: 12px; color: #FFFFFF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{sh.title}}</span>
                        <button type="button" onClick="{{sh.hide}}" aria-label="{{sh.hideLabel}}" title="{{sh.hideLabel}}" style="min-width: 32px; min-height: 32px; padding: 0 8px; border: 1px solid #FF2E88; background: transparent; color: #FF2E88; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">■</button>
                      </div>
                    </div>
                  </sc-for>
                </div>
              </sc-if>
              <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
                <span style="min-width: 0; flex: 1 1 140px; font-size: 12px; line-height: 1.5; color: #A9A5C2">{{sceneCount}}</span>
                <button type="button" onClick="{{sceneClear}}" disabled="{{sceneClearOff}}" style="min-height: 40px; padding: 0 14px; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 1px solid #FF2E88; background: transparent; color: #FF2E88">{{t.sceneClear}}</button>
              </div>
            </div>

        };

          const curId = full[Math.min(this.state.turn, full.length - 1)].id;
