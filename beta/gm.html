<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GM Monitor · Shifter Punkz</title>
<meta name="description" content="GM Monitor Shifter Punkz (beta)">
<meta name="robots" content="noindex">
<meta property="og:title" content="GM Monitor · Shifter Punkz">
<meta property="og:description" content="GM Monitor Shifter Punkz (beta)">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0A12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' fill='%230B0A12'/%3E%3Cpath d='M4 4h12l8 8v12H12L4 16z' fill='none' stroke='%23FF2E88' stroke-width='2.5'/%3E%3Cpath d='M10 10h6v6h-6z' fill='%232EE6F0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0B0A12}
a{color:#2EE6F0}a:hover{color:#FF2E88}
.cpd-play .cpd-body{animation:cpdFade .3s ease-out .6s both}
.crt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:32px;pointer-events:none;background:#050508;background-image:repeating-linear-gradient(0deg,rgba(255,212,0,.07) 0 1px,transparent 1px 3px)}
.cpd-play .crt{animation:crtOn .3s cubic-bezier(.2,.8,.2,1) both,crtOff .2s ease-in .55s forwards}
.bl{margin:0;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.06em;color:#FFD400;white-space:nowrap;clip-path:inset(0 100% 0 0)}
.bl-ok{color:#2EE6F0}
.cpd-play .bl{animation:blType .12s steps(16) var(--d,0s) forwards}
@keyframes crtOn{0%{transform:scale(0,.004);filter:brightness(4)}45%{transform:scale(1,.004);filter:brightness(3)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{to{opacity:0;visibility:hidden}}
@keyframes blType{to{clip-path:inset(0 0 0 0)}}
@keyframes cpdFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.live-dot{animation:livePulse 1.4s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
.flash{animation:flashIn 1.2s ease-out}
@keyframes flashIn{0%{box-shadow:0 0 0 2px #FFD400,0 0 28px rgba(255,212,0,.45)}100%{box-shadow:0 0 0 0 rgba(255,212,0,0)}}
.fld{width:100%;box-sizing:border-box;padding:8px 10px;background:#0B0A12;border:1px solid #2A2740;color:#FFFFFF;font-family:'IBM Plex Sans Thai',sans-serif;font-size:13px}
.fld:focus{outline:2px solid #2EE6F0;outline-offset:-1px}
.fld::placeholder{color:#6E6A88}
summary{cursor:pointer;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#D8D6E8;min-height:32px;display:flex;align-items:center}
@media (prefers-reduced-motion: reduce){.cpd-play .cpd-body,.flash,.live-dot{animation:none}.crt{display:none}}
.eq{display:flex;align-items:flex-end;gap:3px;height:18px}
.eq i{display:block;width:4px;height:4px;background:currentColor;animation:eqB .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
.eq.off i{animation:none;height:3px;opacity:.5}
@keyframes eqB{0%,100%{height:4px}50%{height:18px}}
.bgm-range{width:100%;accent-color:#2EE6F0}
@media (prefers-reduced-motion: reduce){.eq i{animation:none;height:8px}}

[data-soon]{opacity:.5;cursor:not-allowed!important;pointer-events:auto}
[data-soon] .soon-chip{margin-left:6px;padding:1px 6px;border:1px solid currentColor;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
@media (max-width: 720px){
  p.hero-gl{width:auto!important;height:auto!important;max-width:100%!important}
  .hero-bg{justify-content:center!important;align-items:flex-end!important;padding:0 16px 20px!important;font-size:10px}
  .hero-bg > *{opacity:.45}
}
[aria-busy="true"]{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div style="background: #0B0A12; color: #D8D6E8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; min-height: 100vh; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px)">

  <div style="display: flex; align-items: stretch; background: #FFD400; color: #0B0A12; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
    <p style="margin: 0; padding: 9px 16px; flex: 1; min-width: 0">{{t.advisory}}</p>
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
  </div>

  <header style="border-bottom: 1px solid #2A2740">
    <nav style="max-width: 1400px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
      <a href="../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 4h12l8 8v12H12L4 16z" fill="none" stroke="#FF2E88" stroke-width="2.5"></path><path d="M10 10h6v6h-6z" fill="#2EE6F0"></path></svg>
        <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.12em">SHIFTER<span style="color: #FF2E88">PUNKZ</span></span>
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 24px; flex: 1; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.06em">
        <a href="../index.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navHome}}</a>
        <a href="../trpg.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">TRPG</a>
        <a href="sessions.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navTables}}</a>
      </div>
      <div style="position: relative" onKeyDown="{{userMenuKey}}">
        <button type="button" onClick="{{toggleUserMenu}}" aria-haspopup="true" aria-expanded="{{userMenuExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px 0 4px; border: 1px solid {{roleColor}}; text-decoration: none; color: #FFFFFF; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; background: transparent; cursor: pointer">
        <span style="width: 30px; height: 30px; background: #1D1930; border: 1px solid #3A3655; display: flex; align-items: center; justify-content: center; font-size: 13px; color: {{roleColor}}" aria-hidden="true">{{meInitial}}</span><span>{{meName}}</span>
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="margin-left: 2px"><path d="M1.5 3.5L5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg>
        </button>
        <sc-if value="{{userMenuOpen}}" hint-placeholder-val="{{ false }}">
          <div role="menu" style="position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; min-width: 210px; display: flex; flex-direction: column; background: #151225; border: 1px solid #3A3655; box-shadow: 0 14px 34px rgba(0,0,0,0.55)">
            <sc-if value="{{menuNotGm}}" hint-placeholder-val="{{ true }}">
              <a role="menuitem" href="characters.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #2EE6F0; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuChars}}</a>
              <sc-if value="{{charJustSwitched}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: #4ADE80; border-bottom: 1px solid #2A2740">{{t.menuSwitchedPlayer}}</p>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuIsGm}}" hint-placeholder-val="{{ false }}">
              <button type="button" role="menuitem" onClick="{{askChars}}" aria-expanded="{{charWarnExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #2EE6F0; border-bottom: 1px solid #2A2740; width: 100%; border: 0; border-bottom: 1px solid #2A2740; background: transparent; cursor: pointer; text-align: left"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuChars}}<span style="margin-left: auto; padding: 1px 6px; border: 1px solid #2EE6F0; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">PLAYER</span></button>
              <sc-if value="{{charWarn}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #06181A; border-bottom: 1px solid #2A2740">
                  <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #C9EEF0">{{charWarnText}}</p>
                  <button type="button" onClick="{{switchToPlayer}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; background: #2EE6F0; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; cursor: pointer">{{t.menuSwitchPlayer}}</button>
                </div>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuIsGm}}" hint-placeholder-val="{{ false }}">
              <a role="menuitem" href="sessions.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FFD400; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M5 14.5h6M8 12v2.5" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuSessions}}</a>
              <sc-if value="{{roleJustSwitched}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: #4ADE80; border-bottom: 1px solid #2A2740">{{t.menuSwitched}}</p>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuCanAskGm}}" hint-placeholder-val="{{ true }}">
              <button type="button" role="menuitem" onClick="{{askSessions}}" aria-expanded="{{roleWarnExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; width: 100%; border: 0; border-bottom: 1px solid #2A2740; background: transparent; cursor: pointer; text-align: left; color: #FFD400"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M5 14.5h6M8 12v2.5" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuSessions}}<span style="margin-left: auto; padding: 1px 6px; border: 1px solid #FFD400; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">GM</span></button>
              <sc-if value="{{roleWarn}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #1F1A06; border-bottom: 1px solid #2A2740">
                  <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #EDE3B8">{{roleWarnText}}</p>
                  <button type="button" onClick="{{switchToGm}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; background: #FFD400; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; cursor: pointer">{{t.menuSwitchRole}}</button>
                </div>
              </sc-if>
            </sc-if>
            <a role="menuitem" href="account.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #D8D6E8; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="#2EE6F0" stroke-width="1.5"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="#2EE6F0" stroke-width="1.5"></path></svg>{{t.menuSettings}}</a>
            <a role="menuitem" href="auth.html" onClick="{{navLogout}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FF3D6E"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3v11h3M10.5 5l3 3-3 3M13.5 8H6" fill="none" stroke="#FF3D6E" stroke-width="1.5"></path></svg>{{t.menuLogout}}</a>
          </div>
        </sc-if>
      </div>
      <div role="group" aria-label="Language" style="display: flex; border: 1px solid #2EE6F0">
        <button type="button" onClick="{{setTh}}" aria-pressed="{{thPressed}}" style="{{thStyle}}">TH</button>
        <button type="button" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="{{enStyle}}">EN</button>
      </div>
    </nav>
  </header>

  

  <!-- LOCKED (player) -->
  <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
    <main style="max-width: 720px; margin: 0 auto; padding: 80px 24px 120px">
      <section style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px; padding: 36px; background: #151225; border: 1px solid #FFD400; border-top: 3px solid #FFD400">
        <div style="height: 10px; align-self: stretch; background: repeating-linear-gradient(45deg, #FFD400 0 10px, #151225 10px 20px)" aria-hidden="true"></div>
        <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #FFD400">ACCESS DENIED // GM CLEARANCE REQUIRED</p>
        <h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 40px; color: #FFFFFF">{{t.lockTitle}}</h1>
        <p style="margin: 0; font-size: 16px; line-height: 1.75; color: #A9A5C2">{{t.lockBody}}</p>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <a href="account.html#role" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; background: #FFD400; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; clip-path: polygon(0 0, 100% 0, 100% 70%, 92% 100%, 0 100%)">{{t.switchRole}}</a>
          <a href="characters.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border: 1.5px solid #3A3655; color: #D8D6E8; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px">{{t.backMine}}</a>
        </div>
      </section>
    </main>
  </sc-if>

  <!-- GM VIEW -->
  <sc-if value="{{isGm}}" hint-placeholder-val="{{ true }}">
    <main class="cpd-play" style="position: relative; max-width: 1400px; margin: 0 auto; padding: 28px 24px 96px">
      <div class="crt" aria-hidden="true">
        <p class="bl" style="--d: 0.2s">C.P.D. TACTICAL TABLE v26.0</p>
        <p class="bl" style="--d: 0.3s">&gt; LINKING PLAYER SIGNALS...</p>
        <p class="bl bl-ok" style="--d: 0.42s">&gt; LIVE</p>
      </div>
      <div class="cpd-body" style="display: flex; flex-direction: column; gap: 24px">

        <!-- Title + table -->
        <div style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #2A2740">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #FF3D6E"><span class="live-dot" style="width: 9px; height: 9px; background: #FF3D6E; border-radius: 50%" aria-hidden="true"></span>LIVE // {{curTableLabel}}</p>
            <h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: clamp(36px, 4.5vw, 54px); color: #FFFFFF; text-shadow: 0 0 22px rgba(255,212,0,0.3)">GM Monitor</h1>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
            <div style="position: relative">
              <button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuExpanded}}" aria-haspopup="true" style="min-height: 48px; padding: 0 14px; display: inline-flex; align-items: center; gap: 10px; border: 1px solid #2EE6F0; background: #151225; color: #FFFFFF; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #2EE6F0">{{t.switchTable}}</span>{{curTableName}} <span aria-hidden="true" style="color: #2EE6F0">▾</span></button>
              <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
                <div role="menu" style="position: absolute; z-index: 5; top: calc(100% + 6px); right: 0; width: 320px; max-width: 80vw; display: flex; flex-direction: column; background: #151225; border: 1px solid #3A3655; box-shadow: 0 12px 32px rgba(0,0,0,0.5)">
                  <sc-for list="{{tableMenu}}" as="tm" hint-placeholder-count="2">
                    <button type="button" role="menuitem" onClick="{{tm.pick}}" aria-current="{{tm.current}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px; border: 0; border-bottom: 1px solid #2A2740; background: {{tm.bg}}; color: #FFFFFF; cursor: pointer; text-align: left">
                      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{tm.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8C88A6">{{tm.code}} · {{tm.players}}</span></span>
                      <span style="padding: 2px 8px; border: 1px solid {{tm.stColor}}; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: {{tm.stColor}}">{{tm.stLabel}}</span>
                    </button>
                  </sc-for>
                  <a href="sessions.html" role="menuitem" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; color: #2EE6F0; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{t.manageTables}} →</a>
                </div>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 14px; border: 1px solid #3A3655; background: #151225">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #8C88A6">{{t.tableCode}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #FFD400; user-select: all">{{curCode}}</span>
            </div>
            <button type="button" onClick="{{copyCode}}" style="min-height: 48px; padding: 0 16px; border: 1px solid #FFD400; background: transparent; color: #FFD400; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{copyLabel}}</button>
            <button type="button" onClick="{{togglePause}}" aria-pressed="{{pausedPressed}}" style="min-height: 48px; padding: 0 16px; border: 1px solid #FFD400; background: {{pauseBg}}; color: {{pauseFg}}; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{pauseLabel}}</button>
            <button type="button" onClick="{{askEnd}}" aria-expanded="{{endExpanded}}" style="min-height: 48px; padding: 0 16px; border: 1px solid #FF3D6E; background: transparent; color: #FF3D6E; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{t.endSession}}</button>
          </div>
        </div>
        <sc-if value="{{hasSwitch}}" hint-placeholder-val="{{ false }}">
          <div role="alertdialog" aria-label="{{t.oneRun}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px; background: #1F1A06; border: 1px solid #FFD400">
            <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <p style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; color: #FFD400">{{switchTitle}}</p>
              <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #EDE3B8">{{switchBody}}</p>
            </div>

          bgmSyncSub: sync ? L('ผู้เล่นใน session ได้ยินเพลงเดียวกัน (ปรับเสียงฝั่งตัวเองได้)', 'Players in the session hear the same mix (their own volume)') : L('ตอนนี้ได้ยินเฉพาะเครื่อง GM', 'Only this device hears it right now'),
          bgmToggleSync: () => { this.setState({ bgmSync: !sync }); setTimeout(() => this.bgmBroadcast(), 0); }
        };
      })(),
      setTh: () => this.setState({ lang: 'th' }),
      setEn: () => this.setState({ lang: 'en' }),
      thPressed: th ? 'true' : 'false',
      enPressed: th ? 'false' : 'true',
      thStyle: th ? on : off,
      enStyle: th ? off : on,
      isGm: isGm,
      locked: !isGm,
      roleName: isGm ? 'GM' : L('ผู้เล่น', 'Player'),
      roleColor: isGm ? '#FFD400' : '#2EE6F0',
      previewRoles: [{ id: 'player', name: L('ผู้เล่น', 'Player') }, { id: 'gm', name: 'GM' }].map((r) => ({
        name: r.name,
        pressed: this.state.role === r.id ? 'true' : 'false',
        pick: () => this.setState({ role: r.id }),
        style: 'min-height: 32px; padding: 0 12px; border: 0; cursor: pointer; font-family: JetBrains Mono, monospace; font-size: 12px; ' + (this.state.role === r.id ? 'background: #3A3655; color: #FFFFFF' : 'background: transparent; color: #8C88A6')
      })),
      curTableName: L(TABLES[this.state.cur].th, TABLES[this.state.cur].en),
      curTableLabel: L('Session: ' + TABLES[this.state.cur].th, 'SESSION: ' + TABLES[this.state.cur].en.toUpperCase()),
      curCode: TABLES[this.state.cur].code,
      menuOpen: this.state.menu,
      menuExpanded: this.state.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !this.state.menu }),
      tableMenu: Object.keys(TABLES).filter((k) => TABLES[k].st !== 'ended').map((k) => {
        const T = TABLES[k]; const isCur = k === this.state.cur;
        return {
          name: L(T.th, T.en), code: T.code, players: T.n + L(' ผู้เล่น', ' players'),
          current: isCur ? 'true' : 'false', bg: isCur ? '#1D1930' : 'transparent',
          stColor: isCur ? '#4ADE80' : '#8C88A6', stLabel: isCur ? 'LIVE' : L('พักอยู่', 'PAUSED'),
          pick: () => this.setState(isCur ? { menu: false } : { menu: false, pendingTable: k })
        };
      }),
      hasSwitch: !!this.state.pendingTable,
      switchTitle: this.state.pendingTable ? L('เริ่ม session ที่ ' + TABLES[this.state.pendingTable].th + '?', 'Start a session at ' + TABLES[this.state.pendingTable].en + '?') : '',
      switchBody: this.state.pendingTable ? L('1 บัญชีรันได้ทีละ 1 session session ' + TABLES[this.state.cur].th + ' จะถูกพักอัตโนมัติ ผู้เล่นที่นั่นจะเห็นสถานะ "รอ GM" และข้อมูลทั้งหมดยังอยู่ครบ', 'One live session per account. ' + TABLES[this.state.cur].en + ' will be paused; its players see "waiting for GM" and nothing is lost.') : '',
      cancelSwitch: () => this.setState({ pendingTable: null }),
      doSwitch: () => {
        const to = this.state.pendingTable; const from = this.state.cur;
        const snaps = Object.assign({}, this.state.snaps);
        snaps[from] = { order: this.state.order, turn: this.state.turn, round: this.state.round, removed: this.state.removed, chars: this.state.chars, feed: this.state.feed };
        const nx = snaps[to];
        this.setState({ cur: to, pendingTable: null, snaps: snaps, order: nx.order, turn: nx.turn, round: nx.round, removed: nx.removed, chars: nx.chars, feed: nx.feed, confirm: null, copied: false, paused: false });
      },
      copyCode: () => {
        try { if (navigator.clipboard) navigator.clipboard.writeText(TABLES[this.state.cur].code).catch(() => {}); } catch (e) {}
        this.setState({ copied: true });
      },
      copyLabel: this.state.copied ? L('คัดลอกแล้ว', 'Copied') : L('คัดลอกรหัส', 'Copy code'),
      togglePause: () => { const np = !this.state.paused; this.setState({ paused: np, ending: false }); demoSt(this.state.cur, np ? 'paused' : 'live'); },
      pauseBg: this.state.paused ? '#FFD400' : 'transparent',
      pauseFg: this.state.paused ? '#0B0A12' : '#FFD400',
      askEnd: () => this.setState({ ending: !this.state.ending, pendingTable: null }),
      endExpanded: this.state.ending ? 'true' : 'false',
      hasEnd: !!this.state.ending && !this.state.ended,
      endTitle: L('จบ session ' + TABLES[this.state.cur].th + '?', 'End ' + TABLES[this.state.cur].en + '?'),
      cancelEnd: () => this.setState({ ending: false }),
      doEnd: () => { this.setState({ ending: false, ended: true, paused: true }); demoSt(this.state.cur, 'ended'); },
      hasEnded: !!this.state.ended,
      endedNote: L('จบ session ' + TABLES[this.state.cur].th + ' แล้ว', TABLES[this.state.cur].en + ' has ended.'),
      pausedPressed: this.state.paused ? 'true' : 'false',
      pauseLabel: this.state.paused ? L('▶ เริ่ม session ต่อ', '▶ Resume session') : L('❚❚ พัก session', '❚❚ Pause session'),
      feedState: this.state.paused ? 'PAUSED' : 'STREAMING',
      feedStateColor: this.state.paused ? '#8C88A6' : '#4ADE80',
      onlineCount: list.filter((c) => c.online).length + ' / ' + list.length,
      round: String(this.state.round),
      npcName: this.state.npcName,
      setNpcName: (e) => this.setState({ npcName: e && e.target ? e.target.value : '' }),
      addNpc: () => {
        const nm = (this.state.npcName || '').trim();
        if (!nm) return;
        const id = 'npc' + this.state.npcSeq;
        this.setState({ order: this.state.order.concat([{ id: id, kind: 'npc', name: nm }]), npcName: '', npcSeq: this.state.npcSeq + 1 });
      },
      nextTurn: () => {
        const n = order.length;
        if (!n) return;
        const nt = this.state.turn + 1;
        if (nt >= n) this.setState({ turn: 0, round: this.state.round + 1 });
        else this.setState({ turn: nt });
      },
      prevTurn: () => {
        const n = order.length;
        if (!n) return;
        const pt = this.state.turn - 1;
        if (pt < 0) { if (this.state.round > 1) this.setState({ turn: n - 1, round: this.state.round - 1 }); }
        else this.setState({ turn: pt });
      },
      resetRound: () => this.setState({ turn: 0, round: 1 }),
      turns: order.map((o, i) => {
        const pc = o.kind === 'pc';
        const c = pc ? this.state.chars[o.id] : null;
        const active = i === Math.min(this.state.turn, order.length - 1);
        const color = pc ? C[c.f] : '#FF2E88';
        const move = (d) => () => {
          const full = this.state.order.filter((x) => x.kind === 'npc' || this.state.removed.indexOf(x.id) === -1);
          const j = i + d;
          if (j < 0 || j >= full.length) return;
          const curId = full[Math.min(this.state.turn, full.length - 1)].id;
          const arr = full.slice(); const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
          this.setState({ order: arr, turn: arr.findIndex((x) => x.id === curId) });
        };
        return {
          pos: String(i + 1).padStart(2, '0'),
          name: pc ? c.name : o.name,
          kind: pc ? 'PC · ' + FN[c.f] : 'NPC',
          color: color,
          isNpc: !pc,
          first: i === 0,
          last: i === order.length - 1,
          up: move(-1), down: move(1),
          upLabel: L('เลื่อน ', 'Move ') + (pc ? c.name : o.name) + L(' ขึ้นก่อน', ' earlier'),
          downLabel: L('เลื่อน ', 'Move ') + (pc ? c.name : o.name) + L(' ไปทีหลัง', ' later'),
          rmLabel: L('เอา ', 'Remove ') + o.name + L(' ออก', ''),
          remove: () => {
            const full = this.state.order.filter((x) => x.kind === 'npc' || this.state.removed.indexOf(x.id) === -1);
            const arr = full.filter((x) => x.id !== o.id);
            this.setState({ order: arr, turn: Math.min(this.state.turn > i ? this.state.turn - 1 : this.state.turn, Math.max(0, arr.length - 1)) });
          },
          numColor: active ? '#0B0A12' : '#8C88A6',
          nameColor: active ? '#0B0A12' : '#FFFFFF',
          kindColor: active ? '#2A2410' : color,
          style: 'flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 10px; ' + (active ? 'background: rgba(255,212,0,0.8); border: 1px solid rgba(255,212,0,0.8); box-shadow: 0 0 16px rgba(255,212,0,0.24)' : 'background: #0B0A12; border: 1px solid #2A2740; border-left: 3px solid ' + color)
        };
      }),
      party: list.map((c) => ({
        name: c.name, factor: FN[c.f], color: C[c.f], initial: c.name.charAt(0), portrait: c.portrait || '', hasPortrait: !!c.portrait, noPortrait: !c.portrait,
        sub: L('ผู้เล่น: ', 'Player: ') + c.player + ' · ' + c.sub,
        onlineColor: c.online ? '#4ADE80' : '#3A3655',
        flash: now - c.at < 1300 ? 'flash' : '',
        bars: [{ k: 'IP', color: '#FF3D6E', v: c.ip + '/' + c.ipMax, pct: Math.round(c.ip / c.ipMax * 100) + '%' }].concat(c.wmMax ? [{ k: 'WM', color: '#2EE6F0', v: c.wm + '/' + c.wmMax, pct: Math.round(c.wm / c.wmMax * 100) + '%' }] : []),
        ba: ['FOR', 'TAC', 'TRI', 'SEN'].map((k, i) => ({ k: k, v: String(c.ba[i]) })),
        se: String(c.se), ex: String(c.ex), adv: String(c.adv), coins: String(c.coins),
        slots: loadout(c).slots,
        loadout: loadout(c).groups,
        inj: c.inj.map((n) => ({ n: n })),
        noInj: c.inj.length === 0,
        detail: [
          { k: c.f === 'cpd' ? 'Division' : 'Trait', v: c.f === 'cpd' ? 'Division 9' : '—' },
          { k: 'Flaw', v: '—' },
          { k: 'Skills', v: '—' },
          { k: 'Background', v: '—' }
        ],
        ago: ago(c.at),
        agoColor: now - c.at < 15000 ? '#FFD400' : '#8C88A6',
        isConfirm: this.state.confirm === c.id,
        notConfirm: this.state.confirm !== c.id,
        confirmText: L('เอา ' + c.name + ' ออกจาก session นี้? ใบตัวละครของผู้เล่นยังอยู่ แต่ GM จะไม่เห็นอีก', 'Remove ' + c.name + ' from this session? The player keeps their sheet, but you won\'t see it here.'),
        askDel: () => this.setState({ confirm: c.id }),
        cancelDel: () => this.setState({ confirm: null }),
        doDel: () => this.setState({ removed: this.state.removed.concat([c.id]), confirm: null })
      })),
      feed: this.state.feed.filter((f) => this.state.removed.indexOf(f.id) === -1).map((f) => ({
        time: hhmmss(f.at), who: this.state.chars[f.id].name, color: C[this.state.chars[f.id].f], what: th ? f.th : f.en
      })),
      t: {
        bgmStop: L('หยุดทั้งหมด', 'Stop all'),
        bgmMood: L('อารมณ์เพลง', 'Mood'),
        bgmMusic: L('เพลง', 'Music'),
        bgmSync: L('ส่งเสียงให้ผู้เล่น', 'Play for players'),
        bgmNote: L('เพลงสร้างสดในเบราว์เซอร์ ไม่ซ้ำเดิม · ผู้เล่นกด "ฟังด้วย" ในใบตัวละครหนึ่งครั้งเพื่อเปิดเสียง', 'Music is generated live and never repeats exactly. Players tap "Listen" once on their sheet.'),
        menuChars: L('ตัวละครของฉัน', 'My Characters'),
        menuSessions: L('Session ของฉัน', 'My Sessions'),
        menuSwitchRole: L('เปลี่ยนเป็น GM', 'Switch to GM'),
        menuSwitched: L('✓ เปลี่ยนบทบาทเป็น GM แล้ว', '✓ You are now a GM'),
        menuSwitchPlayer: L('เปลี่ยนเป็นผู้เล่น', 'Switch to Player'),
        menuSwitchedPlayer: L('✓ เปลี่ยนบทบาทเป็นผู้เล่นแล้ว', '✓ You are now a Player'),
        menuSettings: L('ตั้งค่าบัญชี', 'Settings'),
        menuLogout: L('ออกจากระบบ', 'Log out'),
        advisory: L('ประกาศ C.P.D. // ระดับรังสีคอสมิค: สูง // หลีกเลี่ยงพื้นที่ EXTINCTED ZONE', 'C.P.D. ADVISORY // COSMIC RADIATION: ELEVATED // AVOID ALL EXTINCTED ZONES'),
        navHome: L('หน้าแรก', 'HOME'),
        online: L('ผู้เล่นออนไลน์', 'PLAYERS ONLINE'),
        next: L('เทิร์นถัดไป ▶', 'Next turn ▶'),
        prev: L('◀ ย้อน', '◀ Back'),
        resetRound: L('เริ่มรอบใหม่', 'Restart'),
        addNpc: L('เพิ่ม NPC', 'ADD NPC'),
        npcPh: L('ชื่อ NPC เช่น ลูกน้อง Golden Crown', 'NPC name, e.g. Golden Crown thug'),
        previewAs: L('ดูหน้านี้ในฐานะ', 'VIEW THIS PAGE AS'),
        lockTitle: L('หน้านี้สำหรับ GM เท่านั้น', 'This page is for GMs only'),
        lockBody: L('ตอนนี้บัญชีของคุณใช้บทบาทผู้เล่น เปลี่ยนบทบาทเป็น GM ในหน้าตั้งค่าบัญชีก่อน แล้วกลับมาเปิด GM Monitor อีกครั้ง', 'Your account is using the Player role. Switch to GM in Account settings, then open the GM Monitor again.'),
        switchRole: L('เปลี่ยนเป็น GM', 'Switch to GM'),
        backMine: L('กลับไปตัวละครของฉัน', 'Back to my characters'),
        tableName: L('Session: ตรอกนีออนลาดพร้าว', 'SESSION: LAT PHRAO NEON ALLEY'),
        navTables: L('Session ของฉัน', 'MY SESSIONS'),
        switchTable: L('SESSION', 'SESSION'),
        manageTables: L('จัดการ session ทั้งหมด / สร้าง session ใหม่', 'Manage sessions / new session'),
        oneRun: L('1 บัญชีรันได้ทีละ 1 session', 'One live session per account'),
        doSwitch: L('พัก session เดิม แล้วสลับ', 'Pause current & switch'),
        endSession: L('■ จบ session', '■ End session'),
        endBody: L('ผู้เล่นทุกคนจะออกจาก session นี้ และรหัสเชิญจะใช้ไม่ได้อีก ตัวละครยังอยู่ในบัญชีของผู้เล่น ย้อนกลับไม่ได้', 'Every player leaves this session and the invite code stops working. Characters stay in each player\'s account. This can\'t be undone.'),
        doEnd: L('จบ session', 'End session'),
        backSessions: L('กลับไปหน้า Session ของฉัน →', 'Back to My Sessions →'),
        tableCode: L('รหัสเชิญผู้เล่น', 'PLAYER INVITE CODE'),
        details: L('รายละเอียดเต็ม', 'Full details'),
        gmNote: L('โน้ต GM (ผู้เล่นไม่เห็น)', 'GM note (hidden from players)'),
        remove: L('เอาออกจาก session', 'Remove from session'),
        cancel: L('ยกเลิก', 'Cancel'),
        confirmRemove: L('ยืนยันเอาออก', 'Remove'),
        dropHint: L('ลากไฟล์ .json ของผู้เล่นมาวางที่นี่ หรือ', 'Drop players\' .json files here, or'),
        pick: L('เลือกไฟล์', 'choose files'),
        exportParty: L('Export ทั้งปาร์ตี้ (JSON)', 'Export party (JSON)'),
        importNote: L('ใช้สำหรับผู้เล่นที่ยังไม่ได้เข้าร่วม session ออนไลน์ ชื่อตัวละครซ้ำจะอัปเดตทับข้อมูลเดิม', 'For players not yet in the online session. A matching character name updates the existing card.'),
        protoNote: L('PROTOTYPE // ข้อมูลและการอัปเดตในหน้านี้เป็นการจำลอง ตอนเชื่อม Supabase จะรับการเปลี่ยนแปลงจริงจากใบตัวละครของผู้เล่นใน session ทันที', 'PROTOTYPE // Data and updates here are simulated. With Supabase, changes arrive live from the players\' sheets in this session.')
      }
