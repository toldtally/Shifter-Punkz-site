<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPC Network · Shifter Punkz</title>
<meta name="description" content="NPC ของ GM Shifter Punkz (beta)">
<meta name="robots" content="noindex">
<meta property="og:title" content="NPC Network · Shifter Punkz">
<meta property="og:description" content="NPC ของ GM Shifter Punkz (beta)">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0A12">
<link rel="icon" href="../assets/icons/favicon.ico?v=63be0f36" sizes="48x48">
<link rel="icon" href="../assets/icons/favicon.svg?v=86c95924" type="image/svg+xml">
<link rel="icon" href="../assets/icons/favicon-32.png?v=b49e2f50" sizes="32x32" type="image/png">
<link rel="icon" href="../assets/icons/favicon-16.png?v=b942ad05" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=8f9a1321">
<link rel="manifest" href="../assets/icons/site.webmanifest?v=bcd47d89">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0B0A12}
a{color:#2EE6F0}a:hover{color:#FF2E88}
.cpd-play .cpd-body{animation:cpdFade .3s ease-out .6s both}
.crt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:32px;pointer-events:none;background:#050508;background-image:repeating-linear-gradient(0deg,rgba(255,212,0,.07) 0 1px,transparent 1px 3px)}
.cpd-play .crt{animation:crtOn .3s cubic-bezier(.2,.8,.2,1) both,crtOff .2s ease-in .55s forwards}
.bl{margin:0;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.06em;color:#FFD400;white-space:nowrap;clip-path:inset(0 100% 0 0)}
.bl-ok{color:#2EE6F0}
.cpd-play .bl{animation:blType .12s steps(16) var(--d,0s) forwards}
@keyframes crtOn{0%{transform:scale(0,.004);filter:brightness(4)}45%{transform:scale(1,.004);filter:brightness(3)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{to{opacity:0;visibility:hidden}}
@keyframes blType{to{clip-path:inset(0 0 0 0)}}
@keyframes cpdFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.live-dot{animation:livePulse 1.4s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
.flash{animation:flashIn 1.2s ease-out}
@keyframes flashIn{0%{box-shadow:0 0 0 2px #FFD400,0 0 28px rgba(255,212,0,.45)}100%{box-shadow:0 0 0 0 rgba(255,212,0,0)}}
.fld{width:100%;box-sizing:border-box;padding:8px 10px;background:#0B0A12;border:1px solid #2A2740;color:#FFFFFF;font-family:'IBM Plex Sans Thai',sans-serif;font-size:13px}
.fld:focus{outline:2px solid #2EE6F0;outline-offset:-1px}
.fld::placeholder{color:#6E6A88}
summary{cursor:pointer;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#D8D6E8;min-height:32px;display:flex;align-items:center}
@media (prefers-reduced-motion: reduce){.cpd-play .cpd-body,.flash,.live-dot{animation:none}.crt{display:none}}
.gl{animation:glIn .84s linear var(--d,0s) both}
@keyframes glIn{0%{opacity:0;clip-path:inset(40% 0 45% 0);transform:translate3d(-16px,0,0)}7%{opacity:1;clip-path:inset(8% 0 72% 0);transform:translate3d(12px,0,0)}14%{clip-path:inset(58% 0 18% 0);transform:translate3d(-10px,0,0)}21%{clip-path:inset(0 0 0 0);transform:translate3d(6px,0,0);opacity:.45}54%{transform:translate3d(-3px,0,0);opacity:.75}100%{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@media (prefers-reduced-motion: reduce){.gl{animation:none}}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:#A9A5C2;text-transform:uppercase}
.mm-gang{position:absolute;box-sizing:border-box;border:2px solid;pointer-events:none}
.mm-gang>button{pointer-events:auto;position:absolute;left:-2px;top:-2px;height:32px;max-width:calc(100% + 4px);box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 12px;border:0;cursor:grab;color:#0B0A12;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
.mm-gang>button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
.mm-resize{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;cursor:nwse-resize;pointer-events:auto;touch-action:none}
.mm-node{position:absolute;z-index:2;transform:translate(-50%,-50%);width:122px;box-sizing:border-box;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;background:#151225;border:1px solid #3A3655;cursor:grab;color:#FFFFFF;touch-action:none;user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.mm-node:active{cursor:grabbing}
.mm-node:focus-visible{outline:2px solid #2EE6F0;outline-offset:3px}
.mm-pic{width:64px;height:64px;box-sizing:border-box;border:2px solid;overflow:hidden;background:#0B0A12;display:flex;align-items:center;justify-content:center}
.mm-pic img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.mm-name{max-width:100%;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;line-height:1.25;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-chip{max-width:100%;box-sizing:border-box;padding:1px 6px;border:1px solid;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-tag{position:absolute;z-index:1;transform:translate(-50%,-50%);max-width:170px;padding:2px 8px;border:1px solid;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:12px;line-height:1.5;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-tag:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.mm-node{transition:none}}

[data-soon]{opacity:.5;cursor:not-allowed!important;pointer-events:auto}
[data-soon] .soon-chip{margin-left:6px;padding:1px 6px;border:1px solid currentColor;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
@media (max-width: 720px){
  p.hero-gl{width:auto!important;height:auto!important;max-width:100%!important}
  .hero-bg{justify-content:center!important;align-items:flex-end!important;padding:0 16px 20px!important;font-size:10px}
  .hero-bg > *{opacity:.45}
}
[aria-busy="true"]{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div style="background: #0B0A12; color: #D8D6E8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; min-height: 100vh; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px)">

  <div style="display: flex; align-items: stretch; background: #FFD400; color: #0B0A12; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
    <p style="margin: 0; padding: 9px 16px; flex: 1; min-width: 0">{{t.advisory}}</p>
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
  </div>

  <header style="border-bottom: 1px solid #2A2740">
    <nav style="max-width: 1400px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
      <a href="../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
        <img src="../assets/logo-z.png?v=7eb004a4" alt="Shifter Punkz" width="40" height="40" style="display: block; width: 40px; height: 40px">
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 24px; flex: 1; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.06em">
        <a href="../index.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navHome}}</a>
        <a href="../trpg.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">TRPG</a>
        <a href="sessions.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navTables}}</a>
        <a href="npcs.html" aria-current="page" style="color: #FFD400; text-decoration: none; padding: 12px 0; border-bottom: 2px solid #FFD400">{{t.navNpc}}</a>
      </div>
      <div style="position: relative" onKeyDown="{{userMenuKey}}">
        <button type="button" onClick="{{toggleUserMenu}}" aria-haspopup="true" aria-expanded="{{userMenuExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px 0 4px; border: 1px solid {{roleColor}}; text-decoration: none; color: #FFFFFF; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; background: transparent; cursor: pointer">
        <span style="width: 30px; height: 30px; background: #1D1930; border: 1px solid #3A3655; display: flex; align-items: center; justify-content: center; font-size: 13px; color: {{roleColor}}" aria-hidden="true">{{meInitial}}</span><span>{{meName}}</span>
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="margin-left: 2px"><path d="M1.5 3.5L5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg>
        </button>
        <sc-if value="{{userMenuOpen}}" hint-placeholder-val="{{ false }}">
          <div role="menu" style="position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; min-width: 210px; display: flex; flex-direction: column; background: #151225; border: 1px solid #3A3655; box-shadow: 0 14px 34px rgba(0,0,0,0.55)">
            <sc-if value="{{menuNotGm}}" hint-placeholder-val="{{ true }}">
              <a role="menuitem" href="characters.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #2EE6F0; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuChars}}</a>
              <sc-if value="{{charJustSwitched}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: #4ADE80; border-bottom: 1px solid #2A2740">{{t.menuSwitchedPlayer}}</p>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuIsGm}}" hint-placeholder-val="{{ false }}">
              <button type="button" role="menuitem" onClick="{{askChars}}" aria-expanded="{{charWarnExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #2EE6F0; border-bottom: 1px solid #2A2740; width: 100%; border: 0; border-bottom: 1px solid #2A2740; background: transparent; cursor: pointer; text-align: left"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuChars}}<span style="margin-left: auto; padding: 1px 6px; border: 1px solid #2EE6F0; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">PLAYER</span></button>
              <sc-if value="{{charWarn}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #06181A; border-bottom: 1px solid #2A2740">
                  <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #C9EEF0">{{charWarnText}}</p>
                  <button type="button" onClick="{{switchToPlayer}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; background: #2EE6F0; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; cursor: pointer">{{t.menuSwitchPlayer}}</button>
                </div>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuIsGm}}" hint-placeholder-val="{{ false }}">
              <a role="menuitem" href="sessions.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FFD400; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M5 14.5h6M8 12v2.5" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuSessions}}</a>
              <sc-if value="{{roleJustSwitched}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: #4ADE80; border-bottom: 1px solid #2A2740">{{t.menuSwitched}}</p>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuCanAskGm}}" hint-placeholder-val="{{ true }}">
              <button type="button" role="menuitem" onClick="{{askSessions}}" aria-expanded="{{roleWarnExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; width: 100%; border: 0; border-bottom: 1px solid #2A2740; background: transparent; cursor: pointer; text-align: left; color: #FFD400"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M5 14.5h6M8 12v2.5" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuSessions}}<span style="margin-left: auto; padding: 1px 6px; border: 1px solid #FFD400; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">GM</span></button>
              <sc-if value="{{roleWarn}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #1F1A06; border-bottom: 1px solid #2A2740">
                  <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #EDE3B8">{{roleWarnText}}</p>
                  <button type="button" onClick="{{switchToGm}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; background: #FFD400; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; cursor: pointer">{{t.menuSwitchRole}}</button>
                </div>
              </sc-if>
            </sc-if>
            <a role="menuitem" href="account.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #D8D6E8; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="#2EE6F0" stroke-width="1.5"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="#2EE6F0" stroke-width="1.5"></path></svg>{{t.menuSettings}}</a>
            <a role="menuitem" href="auth.html" onClick="{{navLogout}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FF3D6E"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3v11h3M10.5 5l3 3-3 3M13.5 8H6" fill="none" stroke="#FF3D6E" stroke-width="1.5"></path></svg>{{t.menuLogout}}</a>
          </div>
        </sc-if>
      </div>
      <div role="group" aria-label="Language" style="display: flex; border: 1px solid #2EE6F0">
        <button type="button" onClick="{{setTh}}" aria-pressed="{{thPressed}}" style="{{thStyle}}">TH</button>
        <button type="button" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="{{enStyle}}">EN</button>
      </div>
    </nav>
  </header>

  <main style="max-width: 1440px; margin: 0 auto; padding: 36px 24px 96px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #FFD400">ROLE // GM · {{countLabel}}</p>
        <h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: clamp(36px, 4.5vw, 56px); color: #FFFFFF; text-shadow: 0 0 22px rgba(255,212,0,0.3)">NPC Network</h1>
        <p style="margin: 0; max-width: 720px; font-size: 14px; line-height: 1.65; color: #A9A5C2">{{t.sub}}</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <button type="button" onClick="{{addNpc}}" style="min-height: 44px; padding: 0 18px; border: 0; background: #FFD400; color: #0B0A12; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; clip-path: polygon(0 0, 100% 0, 100% 70%, 92% 100%, 0 100%)">{{t.addNpc}}</button>
        <button type="button" onClick="{{addGang}}" style="min-height: 44px; padding: 0 16px; border: 1px solid #FFD400; background: transparent; color: #FFD400; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{t.addGang}}</button>
        <button type="button" onClick="{{toggleLink}}" aria-pressed="{{linkPressed}}" style="min-height: 44px; padding: 0 16px; border: 1px solid #2EE6F0; background: {{linkBg}}; color: {{linkFg}}; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">{{linkBtn}}</button>
        <label for="mm-addpc" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{t.addPc}}</label>
        <select id="mm-addpc" class="fld" onChange="{{addPc}}" disabled="{{pcPoolOff}}" style="width: auto; min-height: 44px; padding: 0 10px; border-color: #2EE6F0; color: #2EE6F0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">
          <option value="" selected>{{pcPoolLabel}}</option>
          <sc-for list="{{pcPool}}" as="pp" hint-placeholder-count="2">
            <option value="{{pp.id}}">{{pp.label}}</option>
          </sc-for>
        </select>
      </div>
    </div>

    <sc-if value="{{linkMode}}" hint-placeholder-val="{{ false }}">
      <p role="status" style="margin: 0; padding: 10px 14px; background: #06181A; border-left: 3px solid #2EE6F0; font-size: 13.5px; line-height: 1.55; color: #C9EEF0">{{linkHint}}</p>
    </sc-if>
    <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
      <p role="status" style="margin: 0; align-self: flex-start; padding: 10px 14px; background: #151225; border-left: 3px solid #FFD400; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #D8D6E8">{{toast}}</p>
    </sc-if>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <!-- Mind map: gangs are frames, NPCs and PCs are nodes, relationships are lines -->
      <section aria-label="{{t.mapLabel}}" style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; background: #151225; border: 1px solid #2A2740; border-top: 3px solid #FFD400">
        <div style="padding: 8px 12px; background: #1D1930; border-bottom: 1px solid #2A2740; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
          <h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: #FFFFFF">MIND MAP</h2>
          <span style="flex: 1; min-width: 160px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: #8C88A6">{{t.mapTip}}</span>
          <div role="group" aria-label="Zoom" style="display: flex; align-items: center; border: 1px solid #3A3655">
            <button type="button" onClick="{{zoomOut}}" aria-label="{{t.zoomOut}}" title="{{t.zoomOut}}" style="width: 34px; min-height: 32px; border: 0; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px">−</button>
            <span style="min-width: 46px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A9A5C2">{{zoomPct}}</span>
            <button type="button" onClick="{{zoomIn}}" aria-label="{{t.zoomIn}}" title="{{t.zoomIn}}" style="width: 34px; min-height: 32px; border: 0; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px">+</button>
            <button type="button" onClick="{{zoomFit}}" style="min-height: 32px; padding: 0 10px; border: 0; border-left: 1px solid #3A3655; background: transparent; color: #2EE6F0; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">{{t.fit}}</button>
          </div>
        </div>
        <div id="mm-scroll" style="position: relative; height: 700px; overflow: auto; background-color: #0B0A12; background-image: radial-gradient(rgba(46,230,240,0.13) 1px, transparent 1.4px); background-size: 24px 24px">
          <div style="position: relative; width: {{boardW}}px; height: {{boardH}}px">
            <div id="mm-board" style="position: absolute; left: 0; top: 0; width: 2400px; height: 1600px; transform: scale({{zoom}}); transform-origin: 0 0">
              <sc-for list="{{gangs}}" as="g" hint-placeholder-count="2">
                <div class="mm-gang" style="left: {{g.x}}px; top: {{g.y}}px; width: {{g.w}}px; height: {{g.h}}px; border-color: {{g.color}}; background: {{g.fill}}; box-shadow: {{g.ring}}">
                  <button type="button" data-mm-drag="gang:{{g.id}}" onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" title="{{t.dragTip}}" style="background: {{g.color}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; opacity: 0.75">GANG</span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.name}}</span><span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px">{{g.count}}</span></button>
                  <span class="mm-resize" data-mm-resize="{{g.id}}" aria-hidden="true" title="{{t.resizeTip}}" style="background: linear-gradient(135deg, transparent 0 55%, {{g.color}} 55% 64%, transparent 64% 74%, {{g.color}} 74% 83%, transparent 83%)"></span>
                </div>
              </sc-for>
              <svg width="2400" height="1600" viewBox="0 0 2400 1600" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none" aria-hidden="true">
                <defs>
                  <marker id="mm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C084FC"></path></marker>
                </defs>
                <sc-for list="{{links}}" as="l" hint-placeholder-count="3">
                  <line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.color}}" stroke-width="{{l.w}}" stroke-dasharray="{{l.dash}}" stroke-linecap="round" marker-end="{{l.marker}}" opacity="{{l.op}}"></line>
                </sc-for>
              </svg>
              <sc-for list="{{links}}" as="l" hint-placeholder-count="3">
                <button type="button" class="mm-tag" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" aria-label="{{l.aria}}" style="left: {{l.mx}}px; top: {{l.my}}px; border-color: {{l.color}}; color: {{l.color}}; background: {{l.bg}}">{{l.label}}</button>
              </sc-for>
              <sc-if value="{{boxOn}}" hint-placeholder-val="{{ false }}">
                <div aria-hidden="true" style="position: absolute; z-index: 3; left: {{box.x}}px; top: {{box.y}}px; width: {{box.w}}px; height: {{box.h}}px; border: 1px dashed #2EE6F0; background: rgba(46,230,240,0.08); pointer-events: none"></div>
              </sc-if>
              <sc-for list="{{nodes}}" as="n" hint-placeholder-count="4">
                <button type="button" class="mm-node" data-mm-drag="{{n.key}}" onClick="{{n.pick}}" aria-pressed="{{n.pressed}}" aria-label="{{n.aria}}" title="{{n.tip}}" style="left: {{n.x}}px; top: {{n.y}}px; border-color: {{n.border}}; box-shadow: {{n.ring}}">
                  <span class="mm-pic" style="border-color: {{n.color}}">
                    <sc-if value="{{n.hasPic}}" hint-placeholder-val="{{ true }}"><img src="{{n.pic}}" alt="" draggable="false"></sc-if>
                    <sc-if value="{{n.noPic}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 22px; color: {{n.color}}">{{n.initial}}</span></sc-if>
                  </span>
                  <span class="mm-name">{{n.name}}</span>
                  <span class="mm-chip" style="color: {{n.chipColor}}; border-color: {{n.chipColor}}">{{n.chip}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </div>
        <ul aria-label="{{t.legend}}" style="margin: 0; padding: 10px 12px; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; border-top: 1px solid #2A2740">
          <sc-for list="{{legend}}" as="lg" hint-placeholder-count="8">
            <li style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A9A5C2"><svg width="26" height="8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="{{lg.color}}" stroke-width="2.5" stroke-dasharray="{{lg.dash}}"></line></svg>{{lg.label}}</li>
          </sc-for>
        </ul>
      </section>

      <!-- Inspector: edit whatever is selected on the map -->
      <aside aria-label="{{t.inspector}}" style="flex: 1 1 340px; max-width: 460px; min-width: 0; display: flex; flex-direction: column; background: #151225; border: 1px solid #2A2740; border-top: 3px solid {{insColor}}">
        <div style="padding: 10px 14px; background: #1D1930; border-bottom: 1px solid #2A2740; display: flex; align-items: center; gap: 10px">
          <h2 style="flex: 1; margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: #FFFFFF">{{insTitle}}</h2>
          <sc-if value="{{hasSel}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{deselect}}" aria-label="{{t.close}}" title="{{t.close}}" style="width: 32px; min-height: 32px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px">✕</button>
          </sc-if>
        </div>

        <!-- nothing selected: the NPC list -->
        <sc-if value="{{selNone}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
            <label for="npc-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{t.search}}</label>
            <input id="npc-q" class="fld" type="search" value="{{q}}" onInput="{{onQ}}" placeholder="{{t.searchPh}}">
            <sc-if value="{{listEmpty}}" hint-placeholder-val="{{ false }}">
              <p style="margin: 0; padding: 22px 12px; border: 1px dashed #3A3655; text-align: center; font-size: 13px; line-height: 1.7; color: #A9A5C2">{{listEmptyText}}</p>
            </sc-if>
            <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 640px; overflow-y: auto">
              <sc-for list="{{npcList}}" as="nl" hint-placeholder-count="4">
                <li>
                  <button type="button" onClick="{{nl.pick}}" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: #0B0A12; border: 1px solid #2A2740; border-left: 3px solid {{nl.color}}; cursor: pointer; text-align: left; color: #FFFFFF">
                    <span style="width: 40px; height: 40px; flex-shrink: 0; overflow: hidden; background: #1D1930; display: flex; align-items: center; justify-content: center; font-family: 'Chakra Petch', sans-serif; font-weight: 700; color: {{nl.color}}"><sc-if value="{{nl.hasPic}}" hint-placeholder-val="{{ true }}"><img src="{{nl.pic}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if><sc-if value="{{nl.noPic}}" hint-placeholder-val="{{ false }}">{{nl.initial}}</sc-if></span>
                    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                      <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{nl.name}}</span>
                      <span style="font-size: 12px; color: #A9A5C2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{nl.meta}}</span>
                    </span>
                  </button>
                </li>
              </sc-for>
            </ul>
          </div>
        </sc-if>

        <!-- several cards selected (box or Shift+click) -->
        <sc-if value="{{selMulti}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 14px; display: flex; flex-direction: column; gap: 12px">
            <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #C9EEF0">{{t.multiTip}}</p>
            <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 480px; overflow-y: auto">
              <sc-for list="{{multiItems}}" as="mi" hint-placeholder-count="3">
                <li><button type="button" onClick="{{mi.pick}}" style="width: 100%; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 10px; background: #0B0A12; border: 1px solid #2A2740; border-left: 3px solid #2EE6F0; cursor: pointer; text-align: left; color: #D8D6E8; font-size: 13px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #2EE6F0">{{mi.kind}}</span><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{mi.name}}</span></button></li>
              </sc-for>
            </ul>
            <button type="button" onClick="{{deselect}}" style="align-self: flex-start; min-height: 38px; padding: 0 14px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{t.clearSel}}</button>
          </div>
        </sc-if>

        <!-- NPC editor -->
        <sc-if value="{{selNpc}}" hint-placeholder-val="{{ true }}">
          <div style="padding: 14px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; gap: 14px; align-items: flex-start">
              <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; align-items: center">
                <label for="npc-pic" title="{{t.picPick}}" style="width: 104px; height: 104px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; background: #0B0A12; border: 1px dashed {{ed.color}}">
                  <sc-if value="{{ed.hasPic}}" hint-placeholder-val="{{ true }}"><img src="{{ed.pic}}" alt="{{ed.name}}" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
                  <sc-if value="{{ed.noPic}}" hint-placeholder-val="{{ false }}"><span style="padding: 6px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; line-height: 1.4; color: #8C88A6">{{t.picAdd}}</span></sc-if>
                </label>
                <input id="npc-pic" type="file" accept="image/png,image/jpeg,image/webp" onChange="{{ed.onPic}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden">
                <sc-if value="{{ed.hasPic}}" hint-placeholder-val="{{ true }}">
                  <button type="button" onClick="{{ed.clearPic}}" style="min-height: 28px; padding: 0 8px; border: 1px solid #3A3655; background: transparent; color: #A9A5C2; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em">{{t.picRemove}}</button>
                </sc-if>
              </div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; flex-direction: column; gap: 4px">
                  <label for="npc-name" class="lbl">{{t.name}}</label>
                  <input id="npc-name" class="fld" type="text" maxlength="60" value="{{ed.name}}" onInput="{{ed.onName}}" placeholder="{{t.namePh}}" style="font-size: 15px">
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px">
                  <label for="npc-role" class="lbl">{{t.role}}</label>
                  <input id="npc-role" class="fld" type="text" maxlength="80" value="{{ed.role}}" onInput="{{ed.onRole}}" placeholder="{{t.rolePh}}">
                </div>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span class="lbl" id="npc-f-l">Faction</span>
              <div role="group" aria-labelledby="npc-f-l" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
                <sc-for list="{{ed.factors}}" as="fc" hint-placeholder-count="4">
                  <button type="button" aria-pressed="{{fc.pressed}}" onClick="{{fc.pick}}" style="{{fc.style}}">{{fc.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="npc-gang" class="lbl">{{t.gang}}</label>
              <select id="npc-gang" class="fld" onChange="{{ed.onGang}}">
                <sc-for list="{{ed.gangOpts}}" as="go" hint-placeholder-count="3">
                  <option value="{{go.v}}" selected="{{go.sel}}">{{go.label}}</option>
                </sc-for>
              </select>
            </div>
            <!-- STATUS: GM only. REP x2 = points to spend; costs follow the player sheet -->
            <div style="display: flex; flex-direction: column; gap: 12px; padding: 12px; background: #0B0A12; border: 1px solid #2A2740">
              <div style="display: flex; align-items: center; gap: 8px">
                <span style="flex: 1; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; color: #D8D6E8">STATUS</span>
                <span title="{{st.ptsTip}}" style="padding: 3px 8px; border: 1px solid {{st.ptsColor}}; color: {{st.ptsColor}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; white-space: nowrap">{{st.ptsText}}</span>
              </div>
              <div role="group" aria-label="{{st.tierLabel}}" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px">
                <button type="button" aria-pressed="{{st.normPressed}}" onClick="{{st.setNorm}}" style="{{st.normStyle}}">{{st.normText}}</button>
                <button type="button" aria-pressed="{{st.bossPressed}}" onClick="{{st.setBoss}}" style="{{st.bossStyle}}">{{st.bossText}}</button>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
                <div style="display: flex; flex-direction: column; gap: 4px"><label for="st-lv" class="lbl">Session Lv</label><input id="st-lv" class="fld" type="number" style="width: 64px; font-family: 'JetBrains Mono', monospace" min="1" max="20" value="{{st.lv}}" onInput="{{st.onLv}}"></div>
                <div style="display: flex; flex-direction: column; gap: 4px"><label for="st-rep" class="lbl">REP</label><input id="st-rep" class="fld" type="number" style="width: 64px; font-family: 'JetBrains Mono', monospace" min="0" max="{{st.repMax}}" value="{{st.rep}}" onInput="{{st.onRep}}"></div>
                <div style="display: flex; flex-direction: column; gap: 4px"><label for="st-slots" class="lbl">Slots</label><input id="st-slots" class="fld" type="number" style="width: 64px; font-family: 'JetBrains Mono', monospace" min="0" max="99" value="{{st.slots}}" onInput="{{st.onSlots}}"></div>
              </div>
              <span style="margin-top: -4px; font-size: 12px; line-height: 1.6; color: {{st.hintColor}}">{{st.repHint}}</span>
              <div style="display: flex; flex-direction: column; gap: 4px"><label for="st-bond" class="lbl">Bonded Item</label><input id="st-bond" class="fld" type="text" maxlength="120" value="{{st.bond}}" onInput="{{st.onBond}}"></div>
              <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
                <div style="display: flex; flex-direction: column; gap: 4px"><label for="st-ipcur" class="lbl" style="color: #FFFFFF">IP</label><div style="display: flex; align-items: center; gap: 6px"><input id="st-ipcur" class="fld" type="number" style="width: 64px; font-family: 'JetBrains Mono', monospace" min="0" max="10" value="{{st.ipCur}}" onInput="{{st.onIpCur}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #8C88A6">/ 10</span></div></div>
                <div style="display: flex; flex-direction: column; gap: 4px"><label for="st-amr" class="lbl">AMR+</label><input id="st-amr" class="fld" type="number" style="width: 64px; font-family: 'JetBrains Mono', monospace" min="0" max="2" value="{{st.amr}}" onInput="{{st.onAmr}}"></div>
                <div style="display: flex; flex-direction: column; gap: 4px"><label for="st-iprgn" class="lbl">RGN+</label><input id="st-iprgn" class="fld" type="number" style="width: 64px; font-family: 'JetBrains Mono', monospace" min="0" max="2" value="{{st.ipRgn}}" onInput="{{st.onIpRgn}}"></div>
              </div>
              <sc-if value="{{st.isShifter}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
                  <div style="display: flex; flex-direction: column; gap: 4px"><label for="st-wmcur" class="lbl" style="color: #C084FC">WM</label><div style="display: flex; align-items: center; gap: 6px"><input id="st-wmcur" class="fld" type="number" style="width: 64px; font-family: 'JetBrains Mono', monospace" min="0" max="10" value="{{st.wmCur}}" onInput="{{st.onWmCur}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #8C88A6">/ 10</span></div></div>
                  <div style="display: flex; flex-direction: column; gap: 4px"><label for="st-pwr" class="lbl">PWR+</label><input id="st-pwr" class="fld" type="number" style="width: 64px; font-family: 'JetBrains Mono', monospace" min="0" max="2" value="{{st.pwr}}" onInput="{{st.onPwr}}"></div>
                  <div style="display: flex; flex-direction: column; gap: 4px"><label for="st-wmrgn" class="lbl">RGN+</label><input id="st-wmrgn" class="fld" type="number" style="width: 64px; font-family: 'JetBrains Mono', monospace" min="1" max="2" value="{{st.wmRgn}}" onInput="{{st.onWmRgn}}"></div>
                </div>
              </sc-if>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <span class="lbl">Basic Ability</span>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 6px">
                  <sc-for list="{{st.ba}}" as="b" hint-placeholder-count="4">
                    <div style="display: flex; align-items: center; gap: 6px; padding: 4px 6px; border: 1px solid #2A2740">
                      <span style="flex: 1; min-width: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; color: #D8D6E8">{{b.label}}</span>
                      <button type="button" onClick="{{b.dec}}" disabled="{{b.decOff}}" aria-label="{{b.decLabel}}" style="width: 28px; height: 28px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer">−</button>
                      <span style="width: 18px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #FFFFFF">{{b.v}}</span>
                      <button type="button" onClick="{{b.inc}}" disabled="{{b.incOff}}" aria-label="{{b.incLabel}}" style="width: 28px; height: 28px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer">+</button>
                    </div>
                  </sc-for>
                </div>
                <span style="font-size: 12px; line-height: 1.6; color: #8C88A6">{{st.baNote}}</span>
              </div>
              <sc-if value="{{st.hasCos}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-direction: column; gap: 4px">
                  <label for="st-cos" class="lbl">{{st.cosTitle}}</label>
                  <div style="display: flex; flex-wrap: wrap; gap: 6px">
                    <sc-if value="{{st.cosPick}}" hint-placeholder-val="{{ true }}">
                      <select id="st-cos" class="fld" value="{{st.cosKey}}" onChange="{{st.onCosKey}}" style="flex: 1; min-width: 0">
                        <sc-for list="{{st.cosOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option></sc-for>
                      </select>
                    </sc-if>
                    <sc-if value="{{st.cosTyped}}" hint-placeholder-val="{{ false }}">
                      <select class="fld" aria-label="Cosmic Type" value="{{st.cosType}}" onChange="{{st.onCosType}}" style="flex: 1; min-width: 0">
                        <sc-for list="{{st.cosTypeOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option></sc-for>
                      </select>
                      <input id="st-cos" class="fld" type="text" maxlength="60" value="{{st.cosName}}" onInput="{{st.onCosName}}" placeholder="{{st.cosNamePh}}" style="order: -1; flex: 1 1 100%; min-width: 0">
                    </sc-if>
                    <select class="fld" aria-label="{{st.cosTitle}} level" value="{{st.cosLv}}" onChange="{{st.onCosLv}}" style="width: auto">
                      <sc-for list="{{st.cosLvs}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option></sc-for>
                    </select>
                  </div>
                  <sc-if value="{{st.cosHasInfo}}" hint-placeholder-val="{{ false }}">
                    <span style="font-size: 12px; line-height: 1.5; color: #A9A5C2">{{st.cosInfo}}</span>
                    <sc-if value="{{st.cosHasPassive}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; line-height: 1.5; color: #8C88A6">Passive: {{st.cosPassive}}</span></sc-if>
                  </sc-if>
                </div>
              </sc-if>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <span class="lbl">General skills (2)</span>
                <sc-for list="{{st.skills}}" as="k" hint-placeholder-count="2">
                  <div style="display: flex; flex-direction: column; gap: 4px">
                    <div style="display: flex; gap: 6px">
                      <select class="fld" aria-label="{{k.aria}}" value="{{k.n}}" onChange="{{k.onName}}" style="flex: 1; min-width: 0">
                        <sc-for list="{{k.opts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option></sc-for>
                      </select>
                      <select class="fld" aria-label="{{k.aria}} level" value="{{k.lv}}" onChange="{{k.onLv}}" disabled="{{k.lvOff}}" style="width: auto">
                        <sc-for list="{{k.lvs}}" as="o" hint-placeholder-count="1"><option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option></sc-for>
                      </select>
                    </div>
                    <sc-if value="{{k.hasFx}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; line-height: 1.5; color: #8C88A6">{{k.fx}}</span></sc-if>
                  </div>
                </sc-for>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <span class="lbl">Weapons (2)</span>

  /* the smallest gang frame that holds a point */

    return hit[0] ? hit[0].id : null;

  /* where new things land: the middle of what the map shows right now */
  viewCenter() {
    const el = document.getElementById('mm-scroll'), z = this.state.zoom;
    if (!el) return { x: 600, y: 400 };
    return { x: Math.round((el.scrollLeft + el.clientWidth / 2) / z), y: Math.round((el.scrollTop + el.clientHeight / 2) / z) };
  }
  clamp(x, y) { return { x: Math.round(Math.min(Math.max(x, 70), NPC_W - 70)), y: Math.round(Math.min(Math.max(y, 70), NPC_H - 70)) }; }

  fit() {
    const el = document.getElementById('mm-scroll'), s = this.state;
    if (!el) return;
    const xs = [], ys = [];
    s.npcs.concat(s.pcs).forEach((n) => { xs.push(n.x - 70, n.x + 70); ys.push(n.y - 70, n.y + 70); });
    s.gangs.forEach((g) => { xs.push(g.x, g.x + g.w); ys.push(g.y, g.y + g.h); });

    const want = Math.min(el.clientWidth / (x1 - x0), el.clientHeight * 1.25 / (y1 - y0));
    const z = [0.4, 0.5, 0.6, 0.7, 0.85, 1].filter((q) => q <= want).pop() || 0.4;

  /* ---- dragging nodes, gang frames and frame corners ---- */

  panStart(e) {

    const node = gid ? this.state.gangs.find((g) => g.id === gid) : this.nodeOf(key);
    if (!node) return;

    const group = multi.length > 1 && multi.indexOf(key) !== -1 ? multi.filter((k) => k !== key).map((k) => { const n = this.nodeOf(k); return n ? { key: k, x: n.x, y: n.y } : null; }).filter(Boolean) : [];

  /* drag on empty map space draws a box; the cards inside it become the selection */
  boxStart(e) {

    if (!sc || !board || !sc.contains(e.target)) return;

    bx.x1 = Math.min(Math.max((e.clientX - b.left) / z, 0), NPC_W);
    bx.y1 = Math.min(Math.max((e.clientY - b.top) / z, 0), NPC_H);

        if (!n) return;

        this.state.npcs.forEach((n) => { const g = this.gangAt(n.x, n.y); if (g !== n.gang) this.editNpc(n.id, { gang: g }); });
