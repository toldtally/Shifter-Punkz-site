<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session ของฉัน · Shifter Punkz</title>
<meta name="description" content="Session ของ GM Shifter Punkz (beta)">
<meta name="robots" content="noindex">
<meta property="og:title" content="Session ของฉัน · Shifter Punkz">
<meta property="og:description" content="Session ของ GM Shifter Punkz (beta)">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0A12">
<link rel="icon" href="../assets/icons/favicon.ico" sizes="48x48">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="manifest" href="../assets/icons/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0B0A12}
a{color:#2EE6F0}a:hover{color:#FF2E88}
.cpd-play .cpd-body{animation:cpdFade .3s ease-out .6s both}
.crt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:32px;pointer-events:none;background:#050508;background-image:repeating-linear-gradient(0deg,rgba(255,212,0,.07) 0 1px,transparent 1px 3px)}
.cpd-play .crt{animation:crtOn .3s cubic-bezier(.2,.8,.2,1) both,crtOff .2s ease-in .55s forwards}
.bl{margin:0;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.06em;color:#FFD400;white-space:nowrap;clip-path:inset(0 100% 0 0)}
.bl-ok{color:#2EE6F0}
.cpd-play .bl{animation:blType .12s steps(16) var(--d,0s) forwards}
@keyframes crtOn{0%{transform:scale(0,.004);filter:brightness(4)}45%{transform:scale(1,.004);filter:brightness(3)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{to{opacity:0;visibility:hidden}}
@keyframes blType{to{clip-path:inset(0 0 0 0)}}
@keyframes cpdFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.live-dot{animation:livePulse 1.4s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
.flash{animation:flashIn 1.2s ease-out}
@keyframes flashIn{0%{box-shadow:0 0 0 2px #FFD400,0 0 28px rgba(255,212,0,.45)}100%{box-shadow:0 0 0 0 rgba(255,212,0,0)}}
.fld{width:100%;box-sizing:border-box;padding:8px 10px;background:#0B0A12;border:1px solid #2A2740;color:#FFFFFF;font-family:'IBM Plex Sans Thai',sans-serif;font-size:13px}
.fld:focus{outline:2px solid #2EE6F0;outline-offset:-1px}
.fld::placeholder{color:#6E6A88}
summary{cursor:pointer;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#D8D6E8;min-height:32px;display:flex;align-items:center}
@media (prefers-reduced-motion: reduce){.cpd-play .cpd-body,.flash,.live-dot{animation:none}.crt{display:none}}
.gl{animation:glIn .84s linear var(--d,0s) both}
@keyframes glIn{0%{opacity:0;clip-path:inset(40% 0 45% 0);transform:translate3d(-16px,0,0)}7%{opacity:1;clip-path:inset(8% 0 72% 0);transform:translate3d(12px,0,0)}14%{clip-path:inset(58% 0 18% 0);transform:translate3d(-10px,0,0)}21%{clip-path:inset(0 0 0 0);transform:translate3d(6px,0,0);opacity:.45}54%{transform:translate3d(-3px,0,0);opacity:.75}100%{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@media (prefers-reduced-motion: reduce){.gl{animation:none}}

[data-soon]{opacity:.5;cursor:not-allowed!important;pointer-events:auto}
[data-soon] .soon-chip{margin-left:6px;padding:1px 6px;border:1px solid currentColor;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
@media (max-width: 720px){
  p.hero-gl{width:auto!important;height:auto!important;max-width:100%!important}
  .hero-bg{justify-content:center!important;align-items:flex-end!important;padding:0 16px 20px!important;font-size:10px}
  .hero-bg > *{opacity:.45}
}
[aria-busy="true"]{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div style="background: #0B0A12; color: #D8D6E8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; min-height: 100vh; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px)">

  <div style="display: flex; align-items: stretch; background: #FFD400; color: #0B0A12; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
    <p style="margin: 0; padding: 9px 16px; flex: 1; min-width: 0">{{t.advisory}}</p>
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
  </div>

  <header style="border-bottom: 1px solid #2A2740">
    <nav style="max-width: 1400px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
      <a href="../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
        <img src="../assets/logo-z.png" alt="" width="36" height="36" style="display: block; width: 36px; height: 36px">
        <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.12em">SHIFTER<span style="color: #FF2E88">PUNKZ</span></span>
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 24px; flex: 1; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.06em">
        <a href="../index.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navHome}}</a>
        <a href="../trpg.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">TRPG</a>
        <a href="sessions.html" aria-current="page" style="color: #FFD400; text-decoration: none; padding: 12px 0; border-bottom: 2px solid #FFD400">{{t.navTables}}</a>
        <a href="npcs.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navNpc}}</a>
      </div>
      <div style="position: relative" onKeyDown="{{userMenuKey}}">
        <button type="button" onClick="{{toggleUserMenu}}" aria-haspopup="true" aria-expanded="{{userMenuExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px 0 4px; border: 1px solid {{roleColor}}; text-decoration: none; color: #FFFFFF; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; background: transparent; cursor: pointer">
        <span style="width: 30px; height: 30px; background: #1D1930; border: 1px solid #3A3655; display: flex; align-items: center; justify-content: center; font-size: 13px; color: {{roleColor}}" aria-hidden="true">{{meInitial}}</span><span>{{meName}}</span>
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="margin-left: 2px"><path d="M1.5 3.5L5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg>
        </button>
        <sc-if value="{{userMenuOpen}}" hint-placeholder-val="{{ false }}">
          <div role="menu" style="position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; min-width: 210px; display: flex; flex-direction: column; background: #151225; border: 1px solid #3A3655; box-shadow: 0 14px 34px rgba(0,0,0,0.55)">
            <sc-if value="{{menuNotGm}}" hint-placeholder-val="{{ true }}">
              <a role="menuitem" href="characters.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #2EE6F0; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuChars}}</a>
              <sc-if value="{{charJustSwitched}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: #4ADE80; border-bottom: 1px solid #2A2740">{{t.menuSwitchedPlayer}}</p>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuIsGm}}" hint-placeholder-val="{{ false }}">
              <button type="button" role="menuitem" onClick="{{askChars}}" aria-expanded="{{charWarnExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #2EE6F0; border-bottom: 1px solid #2A2740; width: 100%; border: 0; border-bottom: 1px solid #2A2740; background: transparent; cursor: pointer; text-align: left"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuChars}}<span style="margin-left: auto; padding: 1px 6px; border: 1px solid #2EE6F0; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">PLAYER</span></button>
              <sc-if value="{{charWarn}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #06181A; border-bottom: 1px solid #2A2740">
                  <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #C9EEF0">{{charWarnText}}</p>
                  <button type="button" onClick="{{switchToPlayer}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; background: #2EE6F0; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; cursor: pointer">{{t.menuSwitchPlayer}}</button>
                </div>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuIsGm}}" hint-placeholder-val="{{ false }}">
              <a role="menuitem" href="sessions.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FFD400; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M5 14.5h6M8 12v2.5" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuSessions}}</a>
              <sc-if value="{{roleJustSwitched}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: #4ADE80; border-bottom: 1px solid #2A2740">{{t.menuSwitched}}</p>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuCanAskGm}}" hint-placeholder-val="{{ true }}">
              <button type="button" role="menuitem" onClick="{{askSessions}}" aria-expanded="{{roleWarnExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; width: 100%; border: 0; border-bottom: 1px solid #2A2740; background: transparent; cursor: pointer; text-align: left; color: #FFD400"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M5 14.5h6M8 12v2.5" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuSessions}}<span style="margin-left: auto; padding: 1px 6px; border: 1px solid #FFD400; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">GM</span></button>
              <sc-if value="{{roleWarn}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #1F1A06; border-bottom: 1px solid #2A2740">
                  <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #EDE3B8">{{roleWarnText}}</p>
                  <button type="button" onClick="{{switchToGm}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; background: #FFD400; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; cursor: pointer">{{t.menuSwitchRole}}</button>
                </div>
              </sc-if>
            </sc-if>
            <a role="menuitem" href="account.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #D8D6E8; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="#2EE6F0" stroke-width="1.5"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="#2EE6F0" stroke-width="1.5"></path></svg>{{t.menuSettings}}</a>
            <a role="menuitem" href="auth.html" onClick="{{navLogout}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FF3D6E"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3v11h3M10.5 5l3 3-3 3M13.5 8H6" fill="none" stroke="#FF3D6E" stroke-width="1.5"></path></svg>{{t.menuLogout}}</a>
          </div>
        </sc-if>
      </div>
      <div role="group" aria-label="Language" style="display: flex; border: 1px solid #2EE6F0">
        <button type="button" onClick="{{setTh}}" aria-pressed="{{thPressed}}" style="{{thStyle}}">TH</button>
        <button type="button" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="{{enStyle}}">EN</button>
      </div>
    </nav>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 44px 24px 96px; display: flex; flex-direction: column; gap: 26px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #FFD400">ROLE // GM · {{countLabel}}</p>
        <h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: clamp(36px, 4.5vw, 56px); color: #FFFFFF; text-shadow: 0 0 22px rgba(255,212,0,0.3)">{{t.title}}</h1>
      </div>
      <button type="button" onClick="{{toggleCreate}}" aria-expanded="{{createExpanded}}" style="min-height: 48px; padding: 0 24px; border: 0; background: #FFD400; color: #0B0A12; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.04em; clip-path: polygon(0 0, 100% 0, 100% 70%, 92% 100%, 0 100%)">{{createBtn}}</button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #151225; border: 1px solid #2A2740; border-left: 3px solid #FFD400">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFD400; white-space: nowrap">RULE</span>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #D8D6E8">{{t.rule}}</p>
    </div>

    <sc-if value="{{createOpen}}" hint-placeholder-val="{{ false }}">
      <form onSubmit="{{create}}" aria-label="{{t.newTitle}}" style="display: flex; flex-direction: column; gap: 16px; padding: 22px; background: #151225; border: 1px solid #3A3655; border-top: 3px solid #FFD400">
        <h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; color: #FFFFFF">{{t.newTitle}}</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <div style="flex: 2 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <label for="tName" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A9A5C2">{{t.fName}}</label>
            <input id="tName" class="fld" type="text" maxlength="48" placeholder="{{t.fNamePh}}" value="{{fName}}" onInput="{{onName}}" aria-invalid="{{nameInvalid}}" style="min-height: 40px; font-size: 14px; border-color: {{nameBorder}}">
          </div>
          <fieldset style="flex: 1 1 220px; min-width: 0; margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
            <legend style="padding: 0; margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A9A5C2">{{t.fType}}</legend>
            <div role="group" style="display: flex; border: 1px solid #3A3655">
              <sc-for list="{{types}}" as="ty" hint-placeholder-count="2">
                <button type="button" aria-pressed="{{ty.pressed}}" onClick="{{ty.pick}}" style="{{ty.style}}">{{ty.label}}</button>
              </sc-for>
            </div>
          </fieldset>
          <div style="flex: 0 1 120px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <label for="tLv" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A9A5C2">{{t.fLv}}</label>
            <select id="tLv" class="fld" onChange="{{onLv}}" aria-describedby="tLvHint" style="min-height: 40px; font-size: 14px; font-family: 'JetBrains Mono', monospace">
              <sc-for list="{{lvOpts}}" as="lo" hint-placeholder-count="21">
                <option value="{{lo.v}}" selected="{{lo.sel}}">{{lo.label}}</option>
              </sc-for>
            </select>
            <span id="tLvHint" style="font-size: 11px; color: #8C88A6">{{t.fLvHint}}</span>
          </div>
          <div style="flex: 0 1 160px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <label for="tMax" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A9A5C2">{{t.fMax}}</label>
            <select id="tMax" class="fld" onChange="{{onMax}}" style="min-height: 40px; font-size: 14px">
              <sc-for list="{{maxOpts}}" as="mo" hint-placeholder-count="5">
                <option value="{{mo.v}}" selected="{{mo.sel}}">{{mo.v}}</option>
              </sc-for>
            </select>
          </div>
        </div>
        <sc-if value="{{hasNameErr}}" hint-placeholder-val="{{ false }}">
          <p role="alert" style="margin: 0; font-size: 13px; color: #FF3D6E">{{t.nameErr}}</p>
        </sc-if>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
          <p style="margin: 0; font-size: 12.5px; color: #8C88A6">{{t.newNote}}</p>
          <div style="display: flex; gap: 8px">
            <button type="button" onClick="{{toggleCreate}}" style="min-height: 40px; padding: 0 14px; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8">{{t.cancel}}</button>
            <button type="submit" style="min-height: 40px; padding: 0 14px; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; background: #FFD400; color: #0B0A12">{{t.doCreate}}</button>
          </div>
        </div>
      </form>
    </sc-if>

    <div role="group" aria-label="Filter" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{filters}}" as="fl" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{fl.pressed}}" onClick="{{fl.pick}}" style="{{fl.style}}">{{fl.label}} <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.75">{{fl.count}}</span></button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 20px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
        <article class="gl" style="--d: {{c.d}}; display: flex; flex-direction: column; gap: 14px; padding: 20px; background: #151225; border: 1px solid {{c.border}}; border-top: 3px solid {{c.stColor}}; opacity: {{c.op}}">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
            <div style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <span style="display: inline-flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: {{c.stColor}}"><span class="{{c.dotClass}}" style="width: 8px; height: 8px; border-radius: 50%; background: {{c.stColor}}" aria-hidden="true"></span>{{c.stLabel}}</span>
              <h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2; color: #FFFFFF">{{c.name}}</h2>
              <p style="margin: 0; font-size: 13px; color: #A9A5C2">{{c.meta}}</p>
            </div>
            <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
              <span style="padding: 2px 8px; border: 1px solid #3A3655; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A9A5C2">{{c.type}}</span>

                <button type="button" onClick="{{c.cancel}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">{{t.cancel}}</button>

                <button type="button" onClick="{{c.askStart}}" style="min-height: 40px; padding: 0 14px; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; background: #4ADE80; color: #0B0A12">▶ {{c.startLabel}}</button>
                <a href="{{c.monitorHref}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid #FFD400; color: #FFD400; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{t.openScreen}}</a>
                <button type="button" onClick="{{c.askEnd}}" style="min-height: 40px; padding: 0 14px; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 1px solid #3A3655; background: transparent; color: #A9A5C2">{{c.endLabel}}</button>

                <button type="button" onClick="{{c.askDel}}" style="min-height: 40px; padding: 0 14px; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 1px solid #4A1630; background: transparent; color: #FF3D6E">{{t.del}}</button>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      lang: 'th', filter: 'all', create: false, fName: '', fType: 'oneshot', fMax: 4, fLv: '', nameErr: false,
      confirm: null, copied: null, toast: '', seq: 0,
      tables: [
        { id: 't1', code: 'SP-K7QX', th: 'ตรอกนีออนลาดพร้าว', en: 'Lat Phrao Neon Alley', type: 'campaign', st: 'live', lv: 4, max: 5, players: ['Kaew (Mint)', 'Tum (Ice)', 'Somying (Ploy)'], lastTh: 'กำลังเล่น', lastEn: 'Running now', sessions: 6 },
        { id: 't2', code: 'SP-R4MZ', th: 'ปฏิบัติการชายขอบ Extincted Zone', en: 'Extincted Zone Edge Run', type: 'oneshot', st: 'paused', max: 4, players: ['Nok (Beam)', 'Fah (Fah)'], lastTh: 'เล่นล่าสุด 3 วันก่อน', lastEn: 'Last played 3 days ago', sessions: 1 },
        { id: 't3', code: 'SP-H2WD', th: 'งานใหญ่ที่ Golden Crown', en: 'The Golden Crown Job', type: 'oneshot', st: 'ended', lv: 3, max: 4, players: ['Pim (Pim)', 'Arm (Arm)', 'Jay (Jay)', 'Bow (Bow)'], lastTh: 'จบเมื่อ 2 สัปดาห์ก่อน', lastEn: 'Ended 2 weeks ago', sessions: 1 }
      ]
    };
  }
  /* prototype only: follow pause / resume / end pressed on the GM Monitor artboard */
  componentDidMount() {
    const LAB = { live: ['กำลังเล่น', 'Running now'], paused: ['พักเมื่อสักครู่', 'Paused just now'], idle: ['จบรอบเล่นเมื่อสักครู่', 'Play ended just now'], ended: ['จบเมื่อสักครู่', 'Ended just now'] };
    const applySt = (map) => {
      if (!map) return;
      this.setState({ tables: this.state.tables.map((y) => (map[y.id] && map[y.id] !== y.st && y.st !== 'ended'
        ? Object.assign({}, y, { st: map[y.id], lastTh: LAB[map[y.id]][0], lastEn: LAB[map[y.id]][1] }) : y)) });
    };
    try { applySt(JSON.parse(localStorage.getItem('sp-demo-sessions') || 'null')); } catch (e) {}
    try { this._demoCh = new BroadcastChannel('sp-demo-sessions'); this._demoCh.onmessage = (e) => applySt(e.data); } catch (e) {}
  }
  componentWillUnmount() { if (this._demoCh) this._demoCh.close(); }
  /* campaigns can change Session Lv as the party grows; one-shots keep theirs */
  setLevel(x, lv) {
    const L = (a, b) => (this.state.lang === 'en' ? b : a);
    this.setState({ tables: this.state.tables.map((y) => (y.id === x.id ? Object.assign({}, y, { lv: lv }) : y)), toast: L('Session Lv ของ "' + (x.th || x.en) + '" เป็น ' + (lv || '-') + ' แล้ว', 'Set "' + (x.en || x.th) + '" to Session Lv ' + (lv || '-')) });
  }
  renderVals() {
    const th = this.state.lang !== 'en';
    const L = (a, b) => (th ? a : b);
    const on = 'min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-family: JetBrains Mono, monospace; font-size: 13px; font-weight: 500; background: #2EE6F0; color: #0B0A12';
    const off = 'min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-family: JetBrains Mono, monospace; font-size: 13px; font-weight: 500; background: transparent; color: #2EE6F0';
    const tables = this.state.tables;
    const live = tables.find((x) => x.st === 'live');
    const nm = (x) => L(x.th, x.en);
    const setT = (id, patch) => this.state.tables.map((x) => (x.id === id ? Object.assign({}, x, patch) : x));
    const newCode = () => { const used = this.state.tables.map((x) => x.code); let c; do { c = 'SP-' + Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join(''); } while (used.indexOf(c) !== -1); return c; };
    const ST = {
      live: { color: '#4ADE80', label: 'LIVE', dot: 'live-dot' },
      paused: { color: '#FFD400', label: L('พักอยู่', 'PAUSED'), dot: '' },
      idle: { color: '#C084FC', label: L('รอรอบถัดไป', 'BETWEEN PLAYS'), dot: '' },
      ended: { color: '#8C88A6', label: L('จบแล้ว', 'ENDED'), dot: '' }
    };
    const cur = this.state.filter;
    const fst = (x) => (x.st === 'idle' ? 'paused' : x.st); // 'between plays' shows under Paused
    const shown = tables.filter((x) => cur === 'all' || fst(x) === cur);
    const fdefs = [
      { id: 'all', label: L('ทั้งหมด', 'All'), color: '#D8D6E8' },
      { id: 'live', label: 'LIVE', color: '#4ADE80' },
      { id: 'paused', label: L('พักอยู่', 'Paused'), color: '#FFD400' },
      { id: 'ended', label: L('จบแล้ว', 'Ended'), color: '#8C88A6' }
    ];
    const cf = this.state.confirm;
    return {
      userMenuOpen: !!this.state.userMenu,
      userMenuExpanded: this.state.userMenu ? 'true' : 'false',
      toggleUserMenu: () => this.setState({ userMenu: !this.state.userMenu, roleWarn: false, charWarn: false, menuSwitched: false }),
      closeUserMenu: () => this.setState({ userMenu: false, roleWarn: false }),
      menuIsGm: (this.state.menuRole || 'gm') === 'gm',
      menuNotGm: (this.state.menuRole || 'gm') !== 'gm',
      roleJustSwitched: this.state.menuSwitched === 'gm',
      charJustSwitched: this.state.menuSwitched === 'player',
      charWarn: !!this.state.charWarn,
      charWarnExpanded: this.state.charWarn ? 'true' : 'false',
      askChars: () => this.setState({ charWarn: !this.state.charWarn, roleWarn: false }),
      charWarnText: L('ตัวละครของฉัน ใช้ได้เฉพาะบทบาทผู้เล่น ตอนนี้บัญชีของคุณเป็น "GM" เปลี่ยนเป็นผู้เล่นก่อนเข้า (1 บัญชีเป็นได้ทีละ 1 บทบาท)', 'My Characters is for the Player role. Your account is a GM right now; switch to Player first (one role at a time).'),
      roleWarn: !!this.state.roleWarn,
      roleWarnExpanded: this.state.roleWarn ? 'true' : 'false',
      askSessions: () => this.setState({ roleWarn: !this.state.roleWarn, charWarn: false }),
      switchToGm: () => this.setState({ menuRole: 'gm', roleWarn: false, charWarn: false, menuSwitched: 'gm' }),
      switchToPlayer: () => this.setState({ menuRole: 'player', roleWarn: false, charWarn: false, menuSwitched: 'player' }),
      roleWarnText: L('Session ของฉัน ใช้ได้เฉพาะบทบาท GM ตอนนี้บัญชีของคุณเป็น "ผู้เล่น" เปลี่ยนเป็น GM ก่อนเข้า (1 บัญชีเป็นได้ทีละ 1 บทบาท)', 'My Sessions is for the GM role. Your account is a Player right now; switch to GM first (one role at a time).'),
      userMenuKey: (e) => { if (e && e.key === 'Escape') this.setState({ userMenu: false }); },
      navLogout: () => this.setState({ userMenu: false }),
      setTh: () => this.setState({ lang: 'th' }),
      setEn: () => this.setState({ lang: 'en' }),
      thPressed: th ? 'true' : 'false',
      enPressed: th ? 'false' : 'true',
      thStyle: th ? on : off,
      enStyle: th ? off : on,
      roleName: 'GM',
      roleColor: '#FFD400',
      countLabel: tables.length + L(' session', ' SESSIONS'),
      hasToast: !!this.state.toast,
      toast: this.state.toast,
      createOpen: this.state.create,
      createExpanded: this.state.create ? 'true' : 'false',
      createBtn: this.state.create ? L('× ปิดฟอร์ม', '× Close') : L('+ สร้าง session ใหม่', '+ New session'),
      toggleCreate: () => this.setState({ create: !this.state.create, nameErr: false }),
      fName: this.state.fName,
      onName: (e) => this.setState({ fName: e && e.target ? e.target.value : '', nameErr: false }),
      nameInvalid: this.state.nameErr ? 'true' : 'false',
      nameBorder: this.state.nameErr ? '#FF3D6E' : '#2A2740',
      hasNameErr: this.state.nameErr,
      types: [{ id: 'oneshot', label: 'One-Shot' }, { id: 'campaign', label: L('แคมเปญ', 'Campaign') }].map((ty) => ({
        label: ty.label,
        pressed: this.state.fType === ty.id ? 'true' : 'false',
        pick: () => this.setState({ fType: ty.id }),
        style: 'flex: 1; min-height: 40px; border: 0; cursor: pointer; font-family: Chakra Petch, sans-serif; font-weight: 700; font-size: 14px; ' + (this.state.fType === ty.id ? 'background: #FFD400; color: #0B0A12' : 'background: transparent; color: #D8D6E8')
      })),
      maxOpts: [2, 3, 4, 5, 6].map((v) => ({ v: String(v), sel: v === this.state.fMax })),
      fLv: this.state.fLv,
      lvOpts: [{ v: '', label: '-', sel: !this.state.fLv }].concat(Array.from({ length: 20 }, (_, i) => ({ v: String(i + 1), label: String(i + 1), sel: this.state.fLv === String(i + 1) }))),
      onLv: (e) => this.setState({ fLv: String(e && e.target ? e.target.value : '') }),
      onMax: (e) => this.setState({ fMax: parseInt(e && e.target ? e.target.value : '4', 10) || 4 }),
      create: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const n = String(this.state.fName || '').trim();
        if (!n) return this.setState({ nameErr: true });
        const code = newCode();
        const id = 'n' + (this.state.seq + 1);
        const t = { id: id, code: code, th: n, en: n, type: this.state.fType, st: 'idle', lv: parseInt(this.state.fLv, 10) || null, max: this.state.fMax, players: [], lastTh: 'สร้างเมื่อสักครู่', lastEn: 'Created just now', sessions: 0 };
        this.setState({ tables: [t].concat(this.state.tables), seq: this.state.seq + 1, create: false, fName: '', fLv: '', nameErr: false, filter: 'all', toast: L('สร้าง session "' + n + '" แล้ว · รหัสเชิญ ' + code, 'Session "' + n + '" created · invite code ' + code) });
      },
      filters: fdefs.map((d) => ({
        label: d.label,
        count: String(d.id === 'all' ? tables.length : tables.filter((x) => fst(x) === d.id).length),
        pressed: d.id === cur ? 'true' : 'false',
        pick: () => this.setState({ filter: d.id }),
        style: 'min-height: 40px; padding: 0 16px; cursor: pointer; font-family: Chakra Petch, sans-serif; font-weight: 700; font-size: 14px; ' + (d.id === cur ? 'border: 1px solid ' + d.color + '; background: ' + d.color + '; color: #0B0A12' : 'border: 1px solid #3A3655; background: transparent; color: #D8D6E8')
      })),
      cards: shown.map((x, i) => {
        const s = ST[x.st];
        const mine = cf && cf.id === x.id ? cf.kind : null;
        let cTitle = '', cBody = '', cOk = '', cColor = '#FFD400', cBg = '#1F1A06', confirm = () => {};
        if (mine === 'start') {
          cTitle = L('เริ่ม session นี้?', 'Start a session here?');
          cBody = live ? L('1 บัญชีรันได้ทีละ 1 session session "' + nm(live) + '" ที่ LIVE อยู่จะถูกพักอัตโนมัติ ผู้เล่นที่นั่นจะเห็นสถานะ "รอ GM" ข้อมูลไม่หาย', 'One live session per account. "' + nm(live) + '" will be paused; its players see "waiting for GM" and nothing is lost.') : L('ผู้เล่นใน session จะเห็นสถานะ LIVE และ GM Monitor จะเริ่มรับข้อมูลตัวละคร', 'Seated players go LIVE and the GM Monitor starts receiving their sheets.');
          cOk = live ? L('พัก session เดิม แล้วเริ่ม', 'Pause other & start') : L('เริ่ม session', 'Start');
          cColor = '#4ADE80'; cBg = '#0B1A10';
          confirm = () => this.setState({ tables: this.state.tables.map((y) => (y.id === x.id ? Object.assign({}, y, { st: 'live', lastTh: 'กำลังเล่น', lastEn: 'Running now', sessions: y.sessions + 1 }) : y.st === 'live' ? Object.assign({}, y, { st: 'paused', lastTh: 'พักเมื่อสักครู่', lastEn: 'Paused just now' }) : y)), confirm: null, toast: L('เริ่ม session "' + nm(x) + '" แล้ว', 'Session started: ' + nm(x)) + (live ? L(' · พัก "' + nm(live) + '"', ' · paused "' + nm(live) + '"') : '') });
        } else if (mine === 'reset') {
          cTitle = L('สร้างรหัสเชิญใหม่?', 'Generate a new invite code?');
          cBody = L('รหัสเดิม ' + x.code + ' จะใช้ไม่ได้ทันที ผู้เล่นที่อยู่ใน session แล้วไม่หลุด แต่คนที่ยังไม่เข้าต้องใช้รหัสใหม่', 'The old code ' + x.code + ' stops working now. Seated players stay; anyone joining needs the new one.');
          cOk = L('สร้างรหัสใหม่', 'New code');
          confirm = () => { const c = newCode(); this.setState({ tables: setT(x.id, { code: c }), confirm: null, copied: null, toast: L('รหัสใหม่: ' + c, 'New code: ' + c) }); };
        } else if (mine === 'end') {
          cTitle = x.type === 'campaign' ? L('จบแคมเปญนี้?', 'End this campaign?') : L('จบ session นี้?', 'End this session?');
          cBody = x.type === 'campaign'
            ? L('แคมเปญจะปิดถาวร รหัสเชิญใช้ไม่ได้อีก ผู้เล่นทุกคนออกจากแคมเปญ ตัวละครยังอยู่ในบัญชีของผู้เล่นครบ ส่วนบันทึก session ยังเปิดดูได้', 'The campaign closes for good: the invite code stops working and everyone is unseated. Characters stay in each player\'s account, and your session notes stay readable.')
            : L('รหัสเชิญจะปิดถาวร ผู้เล่นทุกคนออกจาก session ตัวละครยังอยู่ในบัญชีของผู้เล่นครบ ส่วนบันทึก session ยังเปิดดูได้', 'The invite code closes for good and everyone is unseated. Characters stay in each player\'s account, and your session notes stay readable.');
          cOk = x.type === 'campaign' ? L('จบแคมเปญ', 'End campaign') : L('จบ session', 'End session'); cColor = '#FF3D6E'; cBg = '#1A0B14';
          confirm = () => this.setState({ tables: setT(x.id, { st: 'ended', lastTh: 'จบเมื่อสักครู่', lastEn: 'Ended just now' }), confirm: null, toast: L('จบ session "' + nm(x) + '" แล้ว', 'Ended "' + nm(x) + '"') });
        } else if (mine === 'del') {
          cTitle = L('ลบ session นี้ถาวร?', 'Delete this session for good?');
          cBody = L('ประวัติการเล่นและ LIVE FEED ของ session นี้จะหายไป กู้คืนไม่ได้', 'Its session history and LIVE FEED will be gone and can\'t be recovered.');
          cOk = L('ยืนยันลบ', 'Delete'); cColor = '#FF3D6E'; cBg = '#1A0B14';
          confirm = () => this.setState({ tables: this.state.tables.filter((y) => y.id !== x.id), confirm: null, toast: L('ลบ "' + nm(x) + '" แล้ว', 'Deleted "' + nm(x) + '"') });
        }
        return {
          d: (0.06 + i * 0.08).toFixed(2) + 's',
          name: nm(x),
          meta: L(x.lastTh, x.lastEn) + ' · ' + L('เล่นแล้ว ' + x.sessions + ' ครั้ง', 'played ' + x.sessions + (x.sessions === 1 ? ' time' : ' times')),
          type: x.type === 'campaign' ? L('แคมเปญ', 'CAMPAIGN') : 'ONE-SHOT',
          lv: x.lv || '-', hasLv: !!x.lv,
          lvEdit: x.type === 'campaign' && x.st !== 'ended', lvStatic: !(x.type === 'campaign' && x.st !== 'ended') && !!x.lv,
          lvLabel: L('Session Lv ของแคมเปญ (ปรับได้)', 'Campaign Session Lv (adjustable)'),
          lvOpts: [{ v: '', label: 'LV -', sel: !x.lv }].concat(Array.from({ length: 20 }, (_, k) => ({ v: String(k + 1), label: 'LV ' + (k + 1), sel: x.lv === k + 1 }))),
          onLv: (e) => this.setLevel(x, parseInt(e && e.target ? e.target.value : '', 10) || null),
          stColor: s.color, stLabel: s.label, dotClass: s.dot,
          border: x.st === 'live' ? 'rgba(74,222,128,0.4)' : '#2A2740',
          op: x.st === 'ended' ? '0.7' : '1',
          code: x.code,
          codeColor: x.st === 'ended' ? '#6E6A88' : '#FFD400',
          codeDeco: x.st === 'ended' ? 'line-through' : 'none',
          canCode: x.st !== 'ended',
          copyLabel: this.state.copied === x.id ? L('คัดลอกแล้ว', 'Copied') : L('คัดลอก', 'Copy'),
          copy: () => { try { if (navigator.clipboard) navigator.clipboard.writeText(x.code).catch(() => {}); } catch (e) {} this.setState({ copied: x.id }); },
          players: x.players.map((n) => ({ n: n })),
          seats: x.players.length + ' / ' + x.max + L(' ที่นั่ง', ' seats'),
          isLive: x.st === 'live', isPaused: x.st === 'paused' || x.st === 'idle', isEnded: x.st === 'ended',
          monitorHref: 'gm.html',
          startLabel: x.st === 'paused' ? L('เริ่มต่อ', 'Resume') : x.type === 'campaign' && x.sessions > 0 ? L('เริ่ม session ใหม่', 'Start next session') : L('เริ่ม session', 'Start session'),
          endLabel: x.type === 'campaign' ? L('จบแคมเปญ', 'End campaign') : L('จบ session', 'End session'),
          hasConfirm: !!mine, noConfirm: !mine,
          cTitle: cTitle, cBody: cBody, cOk: cOk, cColor: cColor, cBg: cBg,
          confirm: confirm,
          cancel: () => this.setState({ confirm: null }),
          pause: () => this.setState({ tables: setT(x.id, { st: 'paused', lastTh: 'พักเมื่อสักครู่', lastEn: 'Paused just now' }), toast: L('พัก session "' + nm(x) + '" แล้ว', 'Paused "' + nm(x) + '"') }),
          askStart: () => this.setState({ confirm: { id: x.id, kind: 'start' }, toast: '' }),
          askReset: () => this.setState({ confirm: { id: x.id, kind: 'reset' }, toast: '' }),
          askEnd: () => this.setState({ confirm: { id: x.id, kind: 'end' }, toast: '' }),
          askDel: () => this.setState({ confirm: { id: x.id, kind: 'del' }, toast: '' })
        };
      }),
      t: {
        menuChars: L('ตัวละครของฉัน', 'My Characters'),
        menuSessions: L('Session ของฉัน', 'My Sessions'),
        menuSwitchRole: L('เปลี่ยนเป็น GM', 'Switch to GM'),
        menuSwitched: L('✓ เปลี่ยนบทบาทเป็น GM แล้ว', '✓ You are now a GM'),
        menuSwitchPlayer: L('เปลี่ยนเป็นผู้เล่น', 'Switch to Player'),
        menuSwitchedPlayer: L('✓ เปลี่ยนบทบาทเป็นผู้เล่นแล้ว', '✓ You are now a Player'),
        menuSettings: L('ตั้งค่าบัญชี', 'Settings'),
        menuLogout: L('ออกจากระบบ', 'Log out'),
        advisory: L('ประกาศ C.P.D. // ระดับรังสีคอสมิค: สูง // หลีกเลี่ยงพื้นที่ EXTINCTED ZONE', 'C.P.D. ADVISORY // COSMIC RADIATION: ELEVATED // AVOID ALL EXTINCTED ZONES'),
        navHome: L('หน้าแรก', 'HOME'),
        navTables: L('Session ของฉัน', 'MY SESSIONS'),
        navNpc: 'NPC',
        title: L('Session ของฉัน', 'My sessions'),
        rule: L('1 บัญชีรันได้ทีละ 1 session — เมื่อเริ่ม session ใหม่ session ที่ LIVE อยู่จะถูกพักอัตโนมัติ ฝั่งผู้เล่นก็เช่นกัน 1 บัญชีนั่งได้ทีละ 1 session', 'One live session per account. Starting a session pauses whichever session is live. Players follow the same rule: one seat per account.'),
        newTitle: L('สร้าง session ใหม่', 'New session'),
        fName: L('ชื่อ Session', 'SESSION NAME'),
        fNamePh: L('เช่น ปล้นรถขนพลังงาน Shifter', 'e.g. The Shifter Battery Heist'),
        fType: L('รูปแบบ', 'FORMAT'),
        fMax: L('ผู้เล่นสูงสุด', 'MAX PLAYERS'),
        fLv: 'SESSION LV',
        fLvHint: 'Lv 1–20',
        nameErr: L('ตั้งชื่อ Session ก่อนสิ!', 'Give the session a name first.'),
        newNote: L('ระบบสร้างรหัสเชิญให้อัตโนมัติ session ใหม่จะอยู่ในสถานะ "พักอยู่" จนกว่าจะกดเริ่ม session', 'An invite code is generated for you. New sessions stay paused until you start a session.'),
        doCreate: L('สร้าง session', 'Create session'),
        cancel: L('ยกเลิก', 'Cancel'),
        code: L('รหัสเชิญผู้เล่น', 'PLAYER INVITE CODE'),
        resetCode: L('สร้างรหัสใหม่', 'New code'),
        openScreen: L('เปิด GM Monitor', 'Open GM Monitor'),
        openNotes: L('เปิดดูบันทึก', 'Open notes'),
        pause: L('❚❚ พัก session', '❚❚ Pause'),
        start: L('เริ่ม session', 'Start session'),
        end: L('จบ session', 'End session'),
        del: L('ลบ session', 'Delete'),
        protoNote: L('PROTOTYPE // ข้อมูล session เป็นตัวอย่าง ตอนเชื่อม Supabase จะเป็นตาราง tables + table_members ของบัญชี GM นี้', 'PROTOTYPE // Sample tables. With Supabase these come from the GM\'s sessions + table_members rows.')
      }
    };
  }
}
</script>
