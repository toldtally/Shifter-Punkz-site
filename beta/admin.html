<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผู้ใช้ทั้งหมด · Shifter Punkz</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0A12">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
  :root { --bg:#0B0A12; --panel:#15131F; --line:#2A2740; --fg:#ECEAF6; --dim:#8C88A6; --pink:#FF2E88; --ok:#3DDC97; --warn:#FFB547; --bad:#FF5A5A; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 'IBM Plex Sans Thai', system-ui, sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:32px max(16px, env(safe-area-inset-right,0px)) 64px max(16px, env(safe-area-inset-left,0px)); }
  header { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px; }
  .kicker { font:600 12px 'Chakra Petch', sans-serif; letter-spacing:.14em; color:var(--pink); text-transform:uppercase; }
  h1 { margin:4px 0 0; font:700 32px/1.1 'Chakra Petch', sans-serif; }
  a.back { color:var(--dim); text-decoration:none; font:600 14px 'Chakra Petch', sans-serif; }
  a.back:hover { color:var(--fg); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--panel); border:1px solid var(--line); padding:14px 16px; }
  .stat b { display:block; font:700 28px 'Chakra Petch', sans-serif; }
  .stat span { color:var(--dim); font-size:13px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .filters button { background:transparent; color:var(--dim); border:1px solid var(--line); padding:8px 14px; font:600 13px 'Chakra Petch', sans-serif; cursor:pointer; min-height:40px; }
  .filters button[aria-pressed="true"] { color:var(--bg); background:var(--pink); border-color:var(--pink); }
  .tbl { overflow-x:auto; border:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; min-width:900px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font:600 12px 'Chakra Petch', sans-serif; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; background:var(--panel); position:sticky; top:0; }
  td.num { font-family:'JetBrains Mono', monospace; text-align:right; }
  td .sub { display:block; color:var(--dim); font-size:12px; }
  .tag { display:inline-block; padding:2px 8px; font:600 12px 'Chakra Petch', sans-serif; border:1px solid currentColor; }
  .t-ok { color:var(--ok); } .t-warn { color:var(--warn); } .t-bad { color:var(--bad); } .t-dim { color:var(--dim); }
  .msg { padding:24px; background:var(--panel); border:1px solid var(--line); color:var(--dim); }
  .note { color:var(--dim); font-size:13px; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="kicker">Admin</div><h1>ผู้ใช้ทั้งหมด</h1></div>
    <a class="back" href="account.html">← กลับไปหน้าบัญชี</a>
  </header>
  <div id="app"><div class="msg">กำลังโหลด…</div></div>
  <p class="note">บัญชีที่ไม่ยืนยันอีเมลภายใน 7 วันจะถูกลบอัตโนมัติทุกคืนเวลาราว 03:17 น. · "ไม่ active" = ยืนยันแล้วแต่ไม่ได้เข้าใช้เกิน 30 วัน และยังไม่มีตัวละคร</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/sp.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var DAY = 864e5, now = Date.now();
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  var fmt = function (d) { return d ? new Date(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }) : '—'; };
  var ago = function (d) { if (!d) return ''; var n = Math.floor((now - new Date(d)) / DAY); return n <= 0 ? 'วันนี้' : n + ' วันก่อน'; };
  var status = function (u) {
    if (!u.confirmed_at) {
      var left = 7 - Math.floor((now - new Date(u.created_at)) / DAY);
      return { k: 'pending', html: '<span class="tag t-warn">ยังไม่ยืนยันอีเมล</span><span class="sub">ลบใน ' + Math.max(left, 0) + ' วัน</span>' };
    }
    var idle = !u.last_sign_in_at || now - new Date(u.last_sign_in_at) > 30 * DAY;
    var empty = !u.characters && !u.sessions && !u.npcs;
    if (idle && empty) return { k: 'idle', html: '<span class="tag t-dim">ไม่ active</span>' };
    if (empty) return { k: 'empty', html: '<span class="tag t-dim">ยังไม่สร้างอะไร</span>' };
    return { k: 'active', html: '<span class="tag t-ok">ใช้งานอยู่</span>' };
  };
  var rows = [], filter = 'all';
  var FILTERS = [['all', 'ทั้งหมด'], ['pending', 'ยังไม่ยืนยันอีเมล'], ['empty', 'ยังไม่สร้างอะไร'], ['idle', 'ไม่ active'], ['active', 'ใช้งานอยู่']];

  function render() {
    var cnt = function (k) { return rows.filter(function (r) { return r.st.k === k; }).length; };
    var shown = rows.filter(function (r) { return filter === 'all' || r.st.k === filter; });
    app.innerHTML =
      '<div class="stats">' +
        '<div class="stat"><b>' + rows.length + '</b><span>บัญชีทั้งหมด</span></div>' +
        '<div class="stat"><b>' + cnt('active') + '</b><span>ใช้งานอยู่</span></div>' +
        '<div class="stat"><b>' + cnt('empty') + '</b><span>ยังไม่สร้างอะไร</span></div>' +
        '<div class="stat"><b>' + cnt('idle') + '</b><span>ไม่ active</span></div>' +
        '<div class="stat"><b>' + cnt('pending') + '</b><span>ยังไม่ยืนยันอีเมล</span></div>' +
      '</div>' +
      '<div class="filters">' + FILTERS.map(function (f) {
        return '<button data-f="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + (f[0] === 'all' ? '' : ' · ' + cnt(f[0])) + '</button>';
      }).join('') + '</div>' +
      (shown.length ? '<div class="tbl"><table><thead><tr>' +
        '<th>บัญชี</th><th>สถานะ</th><th>สมัคร</th><th>เข้าล่าสุด</th><th>เข้าด้วย</th><th>GM</th><th>ตัวละคร</th><th>Session</th><th>NPC</th><th>ไฟล์รูป</th>' +
        '</tr></thead><tbody>' + shown.map(function (r) {
          var u = r.u;
          return '<tr><td>' + esc(u.display_name || '—') + '<span class="sub">' + esc(u.email) + '</span></td>' +
            '<td>' + r.st.html + '</td>' +
            '<td>' + fmt(u.created_at) + '<span class="sub">' + ago(u.created_at) + '</span></td>' +
            '<td>' + fmt(u.last_sign_in_at) + '<span class="sub">' + ago(u.last_sign_in_at) + '</span></td>' +
            '<td>' + esc(u.provider || '—') + '</td>' +
            '<td>' + (u.gm_allowed ? '<span class="tag t-ok">GM</span>' : '<span class="t-dim">—</span>') + '</td>' +
            '<td class="num">' + u.characters + '</td><td class="num">' + u.sessions + '</td><td class="num">' + u.npcs + '</td><td class="num">' + u.files + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="msg">ไม่มีบัญชีในกลุ่มนี้</div>');
    app.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { filter = b.dataset.f; render(); }; });
  }

  (async function () {
    var s = (await SP.sb.auth.getSession()).data.session;
    if (!s) { location.replace('auth.html?next=admin.html'); return; }
    var r = await SP.sb.rpc('admin_users');
    if (r.error) {
      app.innerHTML = '<div class="msg">' + (/NOT_ADMIN/.test(r.error.message) ? 'หน้านี้เปิดได้เฉพาะแอดมิน' : esc(SP.err(r.error, true))) + '</div>';
      return;
    }
    rows = r.data.map(function (u) { return { u: u, st: status(u) }; });
    render();
  })();
})();
</script>
</body>
</html>
