<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตัวละครของฉัน · Shifter Punkz</title>
<meta name="description" content="ตัวละครของฉัน Shifter Punkz (beta)">
<meta name="robots" content="noindex">
<meta property="og:title" content="ตัวละครของฉัน · Shifter Punkz">
<meta property="og:description" content="ตัวละครของฉัน Shifter Punkz (beta)">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0A12">
<link rel="icon" href="../assets/icons/favicon.ico" sizes="48x48">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="manifest" href="../assets/icons/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0B0A12}
a{color:#2EE6F0}a:hover{color:#FF2E88}
.gl{animation:glIn .84s linear var(--d,0s) both}
@keyframes glIn{
0%{opacity:0;clip-path:inset(40% 0 45% 0);transform:translate3d(-16px,0,0);box-shadow:-4px 0 0 rgba(255,46,136,.7),4px 0 0 rgba(46,230,240,.7)}
7%{opacity:1;clip-path:inset(8% 0 72% 0);transform:translate3d(12px,0,0)}
14%{clip-path:inset(58% 0 18% 0);transform:translate3d(-10px,0,0)}
21%{clip-path:inset(0 0 0 0);transform:translate3d(6px,0,0);opacity:.45}
37%{transform:translate3d(4px,0,0);box-shadow:-3px 0 0 rgba(255,46,136,.6),3px 0 0 rgba(46,230,240,.6)}
54%{transform:translate3d(-3px,0,0);opacity:.75}
100%{opacity:1;clip-path:inset(0 0 0 0);transform:none;box-shadow:none}}
@media (prefers-reduced-motion: reduce){.gl{animation:none}}

[data-soon]{opacity:.5;cursor:not-allowed!important;pointer-events:auto}
[data-soon] .soon-chip{margin-left:6px;padding:1px 6px;border:1px solid currentColor;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
@media (max-width: 720px){
  p.hero-gl{width:auto!important;height:auto!important;max-width:100%!important}
  .hero-bg{justify-content:center!important;align-items:flex-end!important;padding:0 16px 20px!important;font-size:10px}
  .hero-bg > *{opacity:.45}
}
[aria-busy="true"]{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div style="background: #0B0A12; color: #D8D6E8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; min-height: 100vh; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px)">

  <div style="display: flex; align-items: stretch; background: #FFD400; color: #0B0A12; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
    <p style="margin: 0; padding: 9px 16px; flex: 1; min-width: 0">{{t.advisory}}</p>
    <div style="width: 56px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #0B0A12 0 8px, #FFD400 8px 16px)" aria-hidden="true"></div>
  </div>

  <header style="border-bottom: 1px solid #2A2740">
    <nav style="max-width: 1280px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
      <a href="../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 4h12l8 8v12H12L4 16z" fill="none" stroke="#FF2E88" stroke-width="2.5"></path><path d="M10 10h6v6h-6z" fill="#2EE6F0"></path></svg>
        <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.12em">SHIFTER<span style="color: #FF2E88">PUNKZ</span></span>
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 24px; flex: 1; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.06em">
        <a href="../index.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">{{t.navHome}}</a>
        <a href="../trpg.html" style="color: #D8D6E8; text-decoration: none; padding: 12px 0">TRPG</a>
        <a href="characters.html" aria-current="page" style="color: #2EE6F0; text-decoration: none; padding: 12px 0; border-bottom: 2px solid #2EE6F0">{{t.navMine}}</a>
      </div>
      <div style="position: relative" onKeyDown="{{userMenuKey}}">
        <button type="button" onClick="{{toggleUserMenu}}" aria-haspopup="true" aria-expanded="{{userMenuExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px 0 4px; border: 1px solid #2EE6F0; text-decoration: none; color: #FFFFFF; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; background: transparent; cursor: pointer">
        <span style="width: 30px; height: 30px; background: #1D1930; border: 1px solid #3A3655; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #2EE6F0" aria-hidden="true">{{meInitial}}</span><span>{{meName}}</span>
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="margin-left: 2px"><path d="M1.5 3.5L5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg>
        </button>
        <sc-if value="{{userMenuOpen}}" hint-placeholder-val="{{ false }}">
          <div role="menu" style="position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; min-width: 210px; display: flex; flex-direction: column; background: #151225; border: 1px solid #3A3655; box-shadow: 0 14px 34px rgba(0,0,0,0.55)">
            <sc-if value="{{menuNotGm}}" hint-placeholder-val="{{ true }}">
              <a role="menuitem" href="characters.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #2EE6F0; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuChars}}</a>
              <sc-if value="{{charJustSwitched}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: #4ADE80; border-bottom: 1px solid #2A2740">{{t.menuSwitchedPlayer}}</p>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuIsGm}}" hint-placeholder-val="{{ false }}">
              <button type="button" role="menuitem" onClick="{{askChars}}" aria-expanded="{{charWarnExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #2EE6F0; border-bottom: 1px solid #2A2740; width: 100%; border: 0; border-bottom: 1px solid #2A2740; background: transparent; cursor: pointer; text-align: left"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuChars}}<span style="margin-left: auto; padding: 1px 6px; border: 1px solid #2EE6F0; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">PLAYER</span></button>
              <sc-if value="{{charWarn}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #06181A; border-bottom: 1px solid #2A2740">
                  <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #C9EEF0">{{charWarnText}}</p>
                  <button type="button" onClick="{{switchToPlayer}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; background: #2EE6F0; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; cursor: pointer">{{t.menuSwitchPlayer}}</button>
                </div>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuIsGm}}" hint-placeholder-val="{{ false }}">
              <a role="menuitem" href="sessions.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FFD400; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M5 14.5h6M8 12v2.5" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuSessions}}</a>
              <sc-if value="{{roleJustSwitched}}" hint-placeholder-val="{{ false }}">
                <p role="status" style="margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: #4ADE80; border-bottom: 1px solid #2A2740">{{t.menuSwitched}}</p>
              </sc-if>
            </sc-if>
            <sc-if value="{{menuCanAskGm}}" hint-placeholder-val="{{ true }}">
              <button type="button" role="menuitem" onClick="{{askSessions}}" aria-expanded="{{roleWarnExpanded}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; width: 100%; border: 0; border-bottom: 1px solid #2A2740; background: transparent; cursor: pointer; text-align: left; color: #FFD400"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M5 14.5h6M8 12v2.5" stroke="currentColor" stroke-width="1.5"></path></svg>{{t.menuSessions}}<span style="margin-left: auto; padding: 1px 6px; border: 1px solid #FFD400; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em">GM</span></button>
              <sc-if value="{{roleWarn}}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #1F1A06; border-bottom: 1px solid #2A2740">
                  <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #EDE3B8">{{roleWarnText}}</p>
                  <button type="button" onClick="{{switchToGm}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; background: #FFD400; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; border: 0; cursor: pointer">{{t.menuSwitchRole}}</button>
                </div>
              </sc-if>
            </sc-if>
            <a role="menuitem" href="account.html" onClick="{{closeUserMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #D8D6E8; border-bottom: 1px solid #2A2740"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="#2EE6F0" stroke-width="1.5"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="#2EE6F0" stroke-width="1.5"></path></svg>{{t.menuSettings}}</a>
            <a role="menuitem" href="auth.html" onClick="{{navLogout}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FF3D6E"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3v11h3M10.5 5l3 3-3 3M13.5 8H6" fill="none" stroke="#FF3D6E" stroke-width="1.5"></path></svg>{{t.menuLogout}}</a>
          </div>
        </sc-if>
      </div>
      <div role="group" aria-label="Language" style="display: flex; border: 1px solid #2EE6F0">
        <button type="button" onClick="{{setTh}}" aria-pressed="{{thPressed}}" style="{{thStyle}}">TH</button>
        <button type="button" onClick="{{setEn}}" aria-pressed="{{enPressed}}" style="{{enStyle}}">EN</button>
      </div>
    </nav>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 96px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #2EE6F0">ROLE // PLAYER · {{countLabel}}</p>
        <h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: clamp(36px, 4.5vw, 56px); color: #FFFFFF; text-shadow: 0 0 22px rgba(46,230,240,0.3)">{{t.title}}</h1>
      </div>
      <a href="character.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 24px; background: #FF2E88; color: #0B0A12; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.06em; clip-path: polygon(0 0, 100% 0, 100% 70%, 92% 100%, 0 100%)">+ {{t.newChar}}</a>
    </div>

    <div role="group" aria-label="Filter" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{filters}}" as="fl" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{fl.pressed}}" onClick="{{fl.pick}}" style="{{fl.style}}">{{fl.label}} <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.75">{{fl.count}}</span></button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 20px">
      <sc-for list="{{chars}}" as="c" hint-placeholder-count="3">
        <article class="gl" style="display: flex; flex-direction: column; gap: 16px; padding: 22px; background: #151225; border: 1px solid #2A2740; border-top: 3px solid {{c.color}}; --d: {{c.d}}">
          <div style="display: flex; gap: 14px; align-items: center">
            <div style="width: 64px; height: 64px; flex-shrink: 0; background: #0B0A12; border: 1px solid {{c.color}}; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 26px; color: {{c.color}}" aria-hidden="true"><sc-if value="{{c.hasPortrait}}" hint-placeholder-val="{{ false }}"><img src="{{c.portrait}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if><sc-if value="{{c.noPortrait}}" hint-placeholder-val="{{ true }}">{{c.initial}}</sc-if></div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
                <span style="padding: 2px 8px; border: 1px solid {{c.color}}; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: {{c.color}}">{{c.factor}}</span>
                
              </div>
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
                <h2 style="margin: 0; min-width: 0; overflow-wrap: anywhere; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 24px; color: #FFFFFF">{{c.name}}</h2>
                <span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: {{c.color}}">{{c.repTag}}</span>
              </div>
              <p style="margin: 0; font-size: 13px; color: #A9A5C2">{{c.sub}}</p>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <sc-for list="{{c.bars}}" as="b" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 10px">
                <span style="width: 28px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{b.color}}">{{b.k}}</span>
                <div style="flex: 1; height: 8px; background: #0B0A12; border: 1px solid #2A2740" aria-hidden="true"><div style="height: 100%; width: {{b.pct}}; background: {{b.color}}"></div></div>
                <span style="width: 52px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #D8D6E8">{{b.v}}</span>
              </div>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #2A2740; border: 1px solid #2A2740">
            <sc-for list="{{c.stats}}" as="s" hint-placeholder-count="4">
              <div style="padding: 8px 4px; background: #0B0A12; text-align: center"><span style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8C88A6">{{s.k}}</span><span style="display: block; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 18px; color: #FFFFFF">{{s.v}}</span></div>
            </sc-for>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: #0B0A12; border: 1px solid {{c.tblBorder}}">
            <sc-if value="{{c.tLive}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; align-items: center; gap: 10px">
                <span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: {{c.stColor}}" aria-hidden="true"></span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: {{c.stColor}}">{{c.stLabel}} · {{c.joinedCode}}</span><span style="font-size: 13px; color: #FFFFFF">{{c.tableName}}</span></span>
                <button type="button" onClick="{{c.askLeave}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #4A1630; background: transparent; color: #FF3D6E; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">{{t.leave}}</button>
              </div>
            </sc-if>
            <sc-if value="{{c.tLeaving}}" hint-placeholder-val="{{ false }}">
              <div role="alertdialog" aria-label="{{t.leave}}" style="display: flex; flex-direction: column; gap: 8px">
                <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #E8C9D3">{{t.leaveBody}}</p>
                <div style="display: flex; gap: 8px; justify-content: flex-end">
                  <button type="button" onClick="{{c.cancelLeave}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">{{t.cancel}}</button>
                  <button type="button" onClick="{{c.doLeave}}" style="min-height: 36px; padding: 0 12px; border: 0; background: #FF3D6E; color: #0B0A12; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">{{t.confirmLeave}}</button>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{c.tConflict}}" hint-placeholder-val="{{ false }}">
              <div role="alertdialog" aria-label="{{t.oneTable}}" style="display: flex; flex-direction: column; gap: 8px">
                <p style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; color: #FFD400">{{t.oneTable}}</p>
                <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #EDE3B8">{{c.conflictBody}}</p>
                <div style="display: flex; gap: 8px; justify-content: flex-end">
                  <button type="button" onClick="{{c.cancelMove}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">{{t.cancel}}</button>
                  <button type="button" onClick="{{c.doMove}}" style="min-height: 36px; padding: 0 12px; border: 0; background: #FFD400; color: #0B0A12; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">{{t.moveHere}}</button>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{c.tIdle}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8C88A6">TABLE // OFFLINE</span>
                <button type="button" onClick="{{c.openJoin}}" style="min-height: 36px; padding: 0 12px; border: 1px dashed #2EE6F0; background: transparent; color: #2EE6F0; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px">+ {{t.join}}</button>
              </div>
            </sc-if>
            <sc-if value="{{c.tForm}}" hint-placeholder-val="{{ false }}">
              <form onSubmit="{{c.join}}" style="display: flex; gap: 8px; align-items: center">
                <input type="text" aria-label="{{t.codeLabel}}" autocomplete="off" spellcheck="false" maxlength="7" placeholder="SP-XXXX" value="{{c.code}}" onInput="{{c.onCode}}" aria-invalid="{{c.invalid}}" style="flex: 1; min-width: 0; min-height: 36px; padding: 0 10px; background: #151225; border: 1px solid {{c.fldBorder}}; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase">

                <button type="button" onClick="{{c.closeJoin}}" aria-label="{{t.cancel}}" style="width: 36px; min-height: 36px; border: 1px solid #3A3655; background: transparent; color: #A9A5C2; cursor: pointer; font-size: 16px">×</button>

                <button type="button" onClick="{{c.exportJson}}" style="min-height: 40px; padding: 0 14px; border: 1px solid #3A3655; background: transparent; color: #D8D6E8; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">Export</button>

        <span style="width: 56px; height: 56px; border: 1px solid #FF2E88; display: flex; align-items: center; justify-content: center; font-family: 'Chakra Petch', sans-serif; font-size: 30px; color: #FF2E88" aria-hidden="true">+</span>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'th', filter: 'all', deleted: [], confirm: null, toast: '', tbl: { a: { mode: 'live', code: 'SP-K7QX' } } };
  }
  renderVals() {
    const th = this.state.lang !== 'en';
    const L = (a, b) => (th ? a : b);
    const on = 'min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-family: JetBrains Mono, monospace; font-size: 13px; font-weight: 500; background: #2EE6F0; color: #0B0A12';
    const off = 'min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-family: JetBrains Mono, monospace; font-size: 13px; font-weight: 500; background: transparent; color: #2EE6F0';
    const C = { shifter: '#2EE6F0', norms: '#FF2E88', cpd: '#FFD400' };
    const all = [
      { id: 'a', f: 'shifter', factor: 'SHIFTER', name: 'Kaew', portrait: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2314243A'/%3E%3Crect y='0' width='64' height='64' fill='url%28%23g%29'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%232EE6F0' stop-opacity='.25'/%3E%3Cstop offset='1' stop-color='%23FF2E88' stop-opacity='.2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='26' r='11' fill='%230B0A12'/%3E%3Cpath d='M12 64c2-14 10-20 20-20s18 6 20 20z' fill='%230B0A12'/%3E%3Cpath d='M22 24h20' stroke='%232EE6F0' stroke-width='2.5'/%3E%3C/svg%3E", sub: L('Job: Street Doc · Space Shifter', 'Job: Street Doc · Space Shifter'), ip: [8, 10], wm: [6, 10], stats: [['FOR', 1], ['TAC', 2], ['TRI', 3], ['SEN', 2]], rep: 'REP 3 / 3 · ' + L('แก้ไข 2 วันก่อน', 'edited 2 days ago') },
      { id: 'b', f: 'norms', factor: 'NORMS', name: 'Tum', sub: L('Job: Synth-Tech Mechanic', 'Job: Synth-Tech Mechanic'), ip: [10, 10], stats: [['FOR', 2], ['TAC', 3], ['TRI', 2], ['SEN', 1]], rep: 'REP 1 / 1 · ' + L('แก้ไขเมื่อวาน', 'edited yesterday') },
      { id: 'c', f: 'cpd', factor: 'C.P.D.', name: 'Somying', sub: L('Rank 2 · Division 9', 'Rank 2 · Division 9'), ip: [12, 12], wm: null, stats: [['FOR', 3], ['TAC', 2], ['TRI', 1], ['SEN', 3]], rep: 'REP 5 / 5 · ' + L('แก้ไข 1 สัปดาห์ก่อน', 'edited 1 week ago') }
    ].filter((c) => this.state.deleted.indexOf(c.id) === -1);
    const cur = this.state.filter;
    const shown = all.filter((c) => cur === 'all' || c.f === cur);
    const fdefs = [
      { id: 'all', label: L('ทั้งหมด', 'All'), color: '#D8D6E8' },
      { id: 'shifter', label: 'Shifter', color: C.shifter },
      { id: 'norms', label: 'Norms', color: C.norms },
      { id: 'cpd', label: 'C.P.D.', color: C.cpd }
    ];
    return {
      userMenuOpen: !!this.state.userMenu,
      userMenuExpanded: this.state.userMenu ? 'true' : 'false',
      toggleUserMenu: () => this.setState({ userMenu: !this.state.userMenu, roleWarn: false, charWarn: false, menuSwitched: false }),
      closeUserMenu: () => this.setState({ userMenu: false, roleWarn: false }),
      menuIsGm: (this.state.menuRole || 'player') === 'gm',
      menuNotGm: (this.state.menuRole || 'player') !== 'gm',
      roleJustSwitched: this.state.menuSwitched === 'gm',
      charJustSwitched: this.state.menuSwitched === 'player',
      charWarn: !!this.state.charWarn,
      charWarnExpanded: this.state.charWarn ? 'true' : 'false',
      askChars: () => this.setState({ charWarn: !this.state.charWarn, roleWarn: false }),
      charWarnText: L('ตัวละครของฉัน ใช้ได้เฉพาะบทบาทผู้เล่น ตอนนี้บัญชีของคุณเป็น "GM" เปลี่ยนเป็นผู้เล่นก่อนเข้า (1 บัญชีเป็นได้ทีละ 1 บทบาท)', 'My Characters is for the Player role. Your account is a GM right now; switch to Player first (one role at a time).'),
      roleWarn: !!this.state.roleWarn,
      roleWarnExpanded: this.state.roleWarn ? 'true' : 'false',
      askSessions: () => this.setState({ roleWarn: !this.state.roleWarn, charWarn: false }),
      switchToGm: () => this.setState({ menuRole: 'gm', roleWarn: false, charWarn: false, menuSwitched: 'gm' }),
      switchToPlayer: () => this.setState({ menuRole: 'player', roleWarn: false, charWarn: false, menuSwitched: 'player' }),
      roleWarnText: L('Session ของฉัน ใช้ได้เฉพาะบทบาท GM ตอนนี้บัญชีของคุณเป็น "ผู้เล่น" เปลี่ยนเป็น GM ก่อนเข้า (1 บัญชีเป็นได้ทีละ 1 บทบาท)', 'My Sessions is for the GM role. Your account is a Player right now; switch to GM first (one role at a time).'),
      userMenuKey: (e) => { if (e && e.key === 'Escape') this.setState({ userMenu: false }); },
      navLogout: () => this.setState({ userMenu: false }),
      setTh: () => this.setState({ lang: 'th' }),
      setEn: () => this.setState({ lang: 'en' }),
      thPressed: th ? 'true' : 'false',
      enPressed: th ? 'false' : 'true',
      thStyle: th ? on : off,
      enStyle: th ? off : on,
      hasToast: !!this.state.toast,
      toast: this.state.toast,
      countLabel: all.length + L(' ตัวละคร', ' CHARACTERS'),
      filters: fdefs.map((d) => ({
        label: d.label,
        count: String(d.id === 'all' ? all.length : all.filter((c) => c.f === d.id).length),
        pressed: d.id === cur ? 'true' : 'false',
        pick: () => this.setState({ filter: d.id }),
        style: 'min-height: 40px; padding: 0 16px; cursor: pointer; font-family: Chakra Petch, sans-serif; font-weight: 700; font-size: 14px; ' + (d.id === cur ? 'border: 1px solid ' + d.color + '; background: ' + d.color + '; color: #0B0A12' : 'border: 1px solid #3A3655; background: transparent; color: #D8D6E8')
      })),
      chars: shown.map((c, i) => ({
        name: c.name, factor: c.factor, sub: c.sub, rep: c.rep, repTag: c.rep.split(' · ')[0], edited: c.rep.split(' · ').slice(1).join(' · '), color: C[c.f], initial: c.name.charAt(0), portrait: c.portrait || '', hasPortrait: !!c.portrait, noPortrait: !c.portrait,
        isConfirm: this.state.confirm === c.id,
        notConfirm: this.state.confirm !== c.id,
        delLabel: L('ลบ ', 'Delete ') + c.name,
        confirmTitle: L('ลบ ' + c.name + ' ถาวร?', 'Delete ' + c.name + ' for good?'),
        askDel: () => this.setState({ confirm: c.id, toast: '' }),
        cancelDel: () => this.setState({ confirm: null }),
        doDel: () => this.setState({ deleted: this.state.deleted.concat([c.id]), confirm: null, toast: L('ลบ ' + c.name + ' แล้ว', c.name + ' deleted') }),
        d: (0.08 + i * 0.1).toFixed(2) + 's',
        bars: [{ k: 'IP', color: '#FF3D6E', v: c.ip[0] + '/' + c.ip[1], pct: Math.round(c.ip[0] / c.ip[1] * 100) + '%' }].concat(c.wm ? [{ k: 'WM', color: '#2EE6F0', v: c.wm[0] + '/' + c.wm[1], pct: Math.round(c.wm[0] / c.wm[1] * 100) + '%' }] : []),
        stats: c.stats.map((s) => ({ k: s[0], v: String(s[1]) })),
        ...(() => {
          const TABLES = {
            'SP-K7QX': { th: 'ตรอกนีออนลาดพร้าว', en: 'Lat Phrao Neon Alley', st: 'live' },
            'SP-R4MZ': { th: 'ปฏิบัติการชายขอบ Extincted Zone', en: 'Extincted Zone Edge Run', st: 'paused' },
            'SP-H2WD': { th: 'งานใหญ่ที่ Golden Crown', en: 'The Golden Crown Job', st: 'ended' }
          };
          const tName = (k) => (TABLES[k] ? L(TABLES[k].th, TABLES[k].en) : k);
          const names = { a: 'Kaew', b: 'Tum', c: 'Somying' };
          const tb = this.state.tbl[c.id] || { mode: 'idle' };
          const mode = tb.mode || 'idle';
          const seatedId = Object.keys(this.state.tbl).find((k) => k !== c.id && this.state.deleted.indexOf(k) === -1 && this.state.tbl[k] && (this.state.tbl[k].mode === 'live' || this.state.tbl[k].mode === 'leaving'));
          const seated = seatedId ? this.state.tbl[seatedId] : null;
          const put = (patch) => this.setState({ tbl: Object.assign({}, this.state.tbl, { [c.id]: Object.assign({}, tb, patch) }) });
          const jt = tb.code ? TABLES[tb.code] : null;
          const isLive = jt && jt.st === 'live';
          return {
            tLive: mode === 'live', tLeaving: mode === 'leaving', tIdle: mode === 'idle', tForm: mode === 'form', tConflict: mode === 'conflict',
            tblBorder: mode === 'live' ? (isLive ? 'rgba(74,222,128,0.45)' : 'rgba(255,212,0,0.45)') : mode === 'conflict' ? '#FFD400' : '#2A2740',
            stColor: isLive ? '#4ADE80' : '#FFD400',
            stLabel: isLive ? 'LIVE' : L('รอ GM เริ่ม', 'WAITING'),
            joinedCode: tb.code || '',
            tableName: tb.code ? tName(tb.code) : '',
            code: tb.input || '', hasErr: !!tb.err, err: tb.err || '', invalid: tb.err ? 'true' : 'false',
            fldBorder: tb.err ? '#FF3D6E' : '#3A3655',
            conflictBody: seated && tb.pending ? L(names[seatedId] + ' อยู่ที่ session ' + tName(seated.code) + ' ถ้าย้าย ' + names[seatedId] + ' จะออกจาก session เดิม แล้ว ' + c.name + ' เข้า ' + tName(tb.pending) + ' แทน', names[seatedId] + ' is at ' + tName(seated.code) + '. Moving takes ' + names[seatedId] + ' out and seats ' + c.name + ' at ' + tName(tb.pending) + '.') : '',
            openJoin: () => put({ mode: 'form', input: '', err: '' }),
            closeJoin: () => put({ mode: 'idle', err: '' }),
            onCode: (e) => put({ input: String(e && e.target ? e.target.value : '').toUpperCase(), err: '' }),
            join: (e) => {
              if (e && e.preventDefault) e.preventDefault();
              const v = String(tb.input || '').trim().toUpperCase();
              if (!/^SP-[A-HJ-NP-Z2-9]{4}$/.test(v)) return put({ err: L('รหัสต้องเป็นรูปแบบ SP-XXXX (ตัวอักษรหรือตัวเลข 4 ตัว)', 'Codes look like SP-XXXX (4 letters or digits)') });
              if (!TABLES[v]) return put({ err: L('ไม่พบ session นี้ ลองขอรหัสใหม่จาก GM', 'No session with that code.') });
              if (TABLES[v].st === 'ended') return put({ err: L('Session นี้จบไปแล้ว รหัสใช้ไม่ได้อีก', 'That session has ended.') });
              if (seated) return put({ mode: 'conflict', pending: v, err: '' });
              put({ mode: 'live', code: v, input: '', err: '' });
              this.setState({ toast: L(c.name + ' เข้าร่วม session ' + tName(v) + ' แล้ว', c.name + ' joined ' + tName(v)) });
            },
            cancelMove: () => put({ mode: 'form', pending: '' }),
            doMove: () => {
              const next = Object.assign({}, this.state.tbl);
              next[seatedId] = { mode: 'idle' };
              next[c.id] = { mode: 'live', code: tb.pending };
              this.setState({ tbl: next, toast: L('ย้าย ' + c.name + ' เข้า ' + tName(tb.pending) + ' แล้ว · ' + names[seatedId] + ' ออกจาก session เดิม', c.name + ' moved to ' + tName(tb.pending) + ' · ' + names[seatedId] + ' left the old session') });
            },
            askLeave: () => put({ mode: 'leaving' }),
            cancelLeave: () => put({ mode: 'live' }),
            doLeave: () => { this.setState({ tbl: Object.assign({}, this.state.tbl, { [c.id]: { mode: 'idle' } }), toast: L(c.name + ' ออกจาก session แล้ว', c.name + ' left the session') }); }
          };
        })()
      })),
      t: {
        menuChars: L('ตัวละครของฉัน', 'My Characters'),
        menuSessions: L('Session ของฉัน', 'My Sessions'),
        menuSwitchRole: L('เปลี่ยนเป็น GM', 'Switch to GM'),
        menuSwitched: L('✓ เปลี่ยนบทบาทเป็น GM แล้ว', '✓ You are now a GM'),
        menuSwitchPlayer: L('เปลี่ยนเป็นผู้เล่น', 'Switch to Player'),
        menuSwitchedPlayer: L('✓ เปลี่ยนบทบาทเป็นผู้เล่นแล้ว', '✓ You are now a Player'),
        menuSettings: L('ตั้งค่าบัญชี', 'Settings'),
        menuLogout: L('ออกจากระบบ', 'Log out'),
        advisory: L('ประกาศ C.P.D. // ระดับรังสีคอสมิค: สูง // หลีกเลี่ยงพื้นที่ EXTINCTED ZONE', 'C.P.D. ADVISORY // COSMIC RADIATION: ELEVATED // AVOID ALL EXTINCTED ZONES'),
        navHome: L('หน้าแรก', 'HOME'),
        navMine: L('ตัวละครของฉัน', 'MY CHARACTERS'),
        title: L('ตัวละครของฉัน', 'My characters'),
        newChar: L('สร้างตัวละครใหม่', 'New character'),
        newHint: L('เลือก Factor แล้วเริ่มกรอกใบตัวละคร', 'Pick a Factor and start your sheet'),
        open: L('เปิดใบตัวละคร', 'Open sheet'),
        sample: L('ตัวอย่าง', 'SAMPLE'),
        confirmBody: L('ใบตัวละครและข้อมูลทั้งหมดของตัวละครนี้จะหายไป และกู้คืนไม่ได้ ถ้าอยากเก็บไว้ กด Export ก่อนลบ', 'This sheet and all its data will be gone and can\'t be recovered. Export it first if you want to keep a copy.'),
        cancel: L('ยกเลิก', 'Cancel'),
        confirmDel: L('ยืนยันลบ', 'Delete'),
        oneTable: L('1 บัญชีเล่นได้ทีละ 1 session', 'One session per account'),
        moveHere: L('ย้ายมา session นี้', 'Move here'),
        join: L('เข้าร่วม session', 'Join a session'),
        joinShort: L('เข้าร่วม', 'Join'),
        codeLabel: L('รหัสเชิญจาก GM', 'Invite code from your GM'),
        leave: L('ออกจาก session', 'Leave'),
        leaveBody: L('ออกจาก session นี้? GM จะไม่เห็นการอัปเดตของตัวละครนี้อีก', 'Leave this session? Your GM stops seeing this character\'s updates.'),
        confirmLeave: L('ยืนยันออก', 'Leave'),
        protoNote: L('PROTOTYPE // ตัวละครในหน้านี้เป็นตัวอย่าง ตอนเชื่อม Supabase จะแสดงตัวละครจริงของบัญชีนั้น · ลองรหัส SP-K7QX (LIVE) / SP-R4MZ (พักอยู่) / SP-H2WD (จบแล้ว)', 'PROTOTYPE // Sample characters. With Supabase this shows the account\'s real characters. · Try SP-K7QX (live) / SP-R4MZ (paused) / SP-H2WD (ended)')
      }
    };
  }
}
</script>
